<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover ist Pflicht, sonst liefert env(safe-area-inset-*)
     immer 0 und der untere Rand wird in der PWA abgeschnitten. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>1LIVE DJ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="1LIVE DJ">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { width: 100%; background: #000; overflow-x: hidden; }
/* min-height statt fixer height: normalerweise fuellt die App genau einen
   Bildschirm, aber wenn ausnahmsweise alles gleichzeitig sichtbar ist
   (Fortschritt + Fehlermeldung + offene Geraeteliste auf einem kleinen
   Display), darf die Seite scrollen. Vorher war das overflow:hidden - der
   Start-Knopf wurde dann einfach abgeschnitten. */
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
  color: #fff; width: 100%; min-height: 100dvh; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0);
  padding-right: env(safe-area-inset-right, 0);
  padding-left: env(safe-area-inset-left, 0);
  /* Untere Gestensteuerung/Notch. Android meldet env() bei Gestennavigation
     nicht zuverlaessig, deshalb ein fester Mindestabstand - mit 8px klebte
     die Statuszeile noch am unteren Rand. */
  padding-bottom: max(env(safe-area-inset-bottom, 0px), 22px);
}

.topbar {
  flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 2px solid #222;
}
.title { font-size: 19px; font-weight: 900; letter-spacing: 0.5px; }
.title .dj { color: #e8001c; }
.btn-icon {
  background: rgba(255,255,255,0.06); border: 1.5px solid #444; border-radius: 8px; color: #ccc;
  font-size: 16px; cursor: pointer; width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.btn-icon:active { color: #fff; border-color: #e8001c; background: rgba(232,0,28,0.18); }

/* min-height:0 ist der eigentliche Fix: ohne das weigert sich ein flex:1
   Element, unter seine Inhaltsgroesse zu schrumpfen - alles darunter wurde
   aus dem Viewport gedrueckt und von overflow:hidden abgeschnitten. */
.now-playing {
  flex: 1 1 0; min-height: 92px; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 16px 20px; gap: 6px; text-align: center;
}
.np-title  { font-size: clamp(22px, 8vw, 40px); font-weight: 900; line-height: 1.12; }
.np-artist { font-size: clamp(16px, 5.5vw, 26px); color: #999; font-weight: 700; line-height: 1.2; }
.np-meta   { font-size: 12px; color: #666; margin-top: 2px; }
/* Podcast-Schlagzeilen sind lang - auf zwei Zeilen begrenzen, damit sie den
   Bereich nicht sprengen (vorher lief der Titel in den Fortschrittsbalken). */
.np-meta.clamp2 {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; font-size: 13px; color: #888; line-height: 1.3;
  max-width: 100%;
}

.progress-wrap { flex: 0 0 auto; padding: 0 20px 8px; }
.progress-bar { height: 4px; border-radius: 2px; background: #222; overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: #e8001c; transition: width .25s linear; }
.progress-times {
  display: flex; justify-content: space-between; font-size: 11px; color: #555;
  font-variant-numeric: tabular-nums; margin-top: 4px;
}
.progress-wrap.hidden { visibility: hidden; }

.feedback-row, .seek-row { flex: 0 0 auto; display: flex; gap: 12px; padding: 0 16px 10px; }
.btn-seek {
  flex: 1; border: 2px solid #2a4a6a; background: #0b1622; color: #9fd0ff; cursor: pointer;
  border-radius: 16px; font-family: inherit; font-weight: 800; padding: 13px 0;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation;
  transition: transform .1s, filter .1s;
}
.btn-seek .ico { font-size: 24px; line-height: 1; }
.btn-seek .lbl { font-size: 13px; }
.btn-seek:active { transform: scale(0.92); filter: brightness(1.35); }
.btn-feedback {
  flex: 1; border: none; cursor: pointer; border-radius: 16px; font-family: inherit;
  font-weight: 800; padding: 13px 0; display: flex; flex-direction: column; align-items: center;
  gap: 4px; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation;
  transition: transform .1s, filter .1s;
}
.btn-feedback .ico { font-size: 24px; line-height: 1; }
.btn-feedback .lbl { font-size: 13px; }
.btn-feedback:active { transform: scale(0.92); filter: brightness(1.3); }
.btn-feedback:disabled { opacity: 0.3; cursor: default; }
.btn-dislike  { background: #1e0306; color: #ff8fa0; border: 2px solid #5a1018; }
.btn-like     { background: #0d1e0d; color: #8fffa0; border: 2px solid #204020; }
.btn-favorite { background: rgba(255,255,255,0.05); color: #999; border: 2px solid #444; }
.btn-favorite.favorite-active { background: #2a0810; color: #ff4d6d; border-color: #e8001c; }
.btn-feedback.sent { filter: brightness(1.6); }

.controls { flex: 0 0 auto; padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
.btn-skip {
  border: 1.5px solid #444; cursor: pointer; border-radius: 13px; font-family: inherit;
  background: rgba(255,255,255,0.05); color: #fff; font-size: 15px; font-weight: 800;
  padding: 11px 0; -webkit-tap-highlight-color: transparent; user-select: none;
  touch-action: manipulation; transition: transform .1s;
}
.btn-skip:active { transform: scale(0.97); border-color: #666; }
.btn-skip:disabled { opacity: 0.3; cursor: default; }

.extras-row { display: flex; gap: 8px; }
.btn-extra {
  flex: 1; min-width: 0; border: 1.5px solid #444; cursor: pointer; border-radius: 13px;
  font-family: inherit; background: rgba(255,255,255,0.05); color: #ccc; font-size: 12.5px;
  font-weight: 800; padding: 11px 2px; -webkit-tap-highlight-color: transparent; user-select: none;
  touch-action: manipulation; transition: transform .1s, filter .1s;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.btn-extra:active { transform: scale(0.97); }
.btn-extra.active { border-color: #e8001c; color: #fff; background: rgba(232,0,28,0.22); }

/* Beschriftung neben der Zeile statt darueber - spart rund 30px Hoehe,
   die auf kurzen Displays am unteren Rand gefehlt haben. */
.ctl-line { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ctl-key {
  flex: 0 0 46px; font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; color: #555;
}
.ctl-val {
  flex: 1 1 auto; min-width: 0; font-size: 13px; font-weight: 700; color: #999;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ctl-line > button.link {
  flex: 0 0 auto; background: none; border: none; color: #777; font-family: inherit;
  font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
  cursor: pointer; -webkit-tap-highlight-color: transparent; padding: 4px 0;
}
.pill-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.pill {
  flex-shrink: 0; padding: 7px 13px; border-radius: 18px; border: 1.5px solid #444;
  background: rgba(255,255,255,0.05); color: #999; font-size: 13px; font-weight: 700;
  cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent;
  font-family: inherit;
}
.pill.active { border-color: #e8001c; color: #fff; background: rgba(232,0,28,0.18); }
.hidden { display: none !important; }

.power-row { display: flex; gap: 10px; }
.btn-power {
  flex: 1; min-width: 0; border: none; cursor: pointer; border-radius: 15px; font-family: inherit;
  font-size: 17px; font-weight: 900; letter-spacing: 0.3px; padding: 15px 4px;
  -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation;
  transition: transform .1s, filter .1s;
}
.btn-power:active { transform: scale(0.96); }
.btn-power .sub { display: block; font-size: 11px; font-weight: 700; opacity: 0.8; margin-top: 2px; }
.btn-power.start  { background: #e8001c; color: #fff; box-shadow: 0 0 26px rgba(232,0,28,0.35); }
.btn-power.pause  { background: #222; color: #ccc; border: 2px solid #444; }
.btn-power.resume { background: #00e676; color: #000; box-shadow: 0 0 26px rgba(0,230,118,0.3); }
.btn-power.busy   { background: #333; color: #aaa; box-shadow: none; }
.btn-power:disabled { opacity: 0.6; box-shadow: none; cursor: default; }
.btn-end {
  flex: 0 0 92px; border: 2px solid #444; background: #161616; color: #999;
  font-family: inherit; font-size: 14px; font-weight: 800; border-radius: 15px; cursor: pointer;
  -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation;
}
.btn-end:active { transform: scale(0.96); color: #fff; border-color: #e8001c; }
.btn-end:disabled { opacity: 0.3; cursor: default; }

/* Wird nur eingeblendet, wenn wirklich etwas im Argen liegt. */
.alert {
  flex: 0 0 auto; margin: 0 16px 8px; padding: 10px 12px; border-radius: 12px;
  background: #2a0810; border: 1.5px solid #7a1020; font-size: 13px; line-height: 1.35; color: #ffc2cc;
}
.alert .act { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.alert a, .alert button {
  font-family: inherit; font-size: 12.5px; font-weight: 800; padding: 8px 11px; border-radius: 9px;
  border: 1.5px solid #e8001c; background: rgba(232,0,28,0.2); color: #fff;
  text-decoration: none; cursor: pointer; -webkit-tap-highlight-color: transparent;
}

.statusline {
  flex: 0 0 auto; padding: 8px 16px 2px; font-size: 12px; color: #777; text-align: center;
  cursor: pointer; -webkit-tap-highlight-color: transparent; min-height: 26px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.statusline .dot {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #444;
  margin-right: 6px; vertical-align: 1px;
}
.statusline.playing .dot { background: #00e676; }
.statusline.paused  .dot { background: #ffb300; }
.statusline.trouble .dot { background: #ff3b30; }
.statusline.busy    .dot { background: #29b6f6; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0.25; } }
.statusline.trouble { color: #ff8fa0; }

.details {
  flex: 0 0 auto; margin: 6px 16px 0; padding: 10px 12px; border-radius: 10px;
  background: rgba(255,255,255,0.04); border: 1px solid #222;
  font-size: 11.5px; color: #888; line-height: 1.6; text-align: left;
  max-height: 30vh; overflow-y: auto;
}
.details b { color: #bbb; font-weight: 700; }
</style>
</head>
<body>

<div class="topbar">
  <div class="title">1LIVE <span class="dj">DJ</span></div>
  <button class="btn-icon" id="btnReload" title="Neu laden">↺</button>
</div>

<div class="now-playing">
  <div class="np-title" id="npTitle">—</div>
  <div class="np-artist" id="npArtist"></div>
  <div class="np-meta" id="npMeta"></div>
</div>

<div class="progress-wrap hidden" id="progressWrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-times"><span id="tElapsed">0:00</span><span id="tTotal">0:00</span></div>
</div>

<div class="alert hidden" id="alertBox"></div>

<!-- Ersetzt waehrend einer Einspielung die Bewertungs-Reihe: gleiche Hoehe,
     dadurch kein Springen des Layouts beim Umschalten. -->
<div class="seek-row hidden" id="seekRow">
  <button class="btn-seek" id="btnBack5"><span class="ico">⏪</span><span class="lbl">5 Sek</span></button>
  <button class="btn-seek" id="btnFwd10"><span class="ico">⏩</span><span class="lbl">10 Sek</span></button>
</div>

<div class="feedback-row" id="feedbackRow">
  <button class="btn-feedback btn-dislike" id="btnDislike" disabled>
    <span class="ico">👎</span><span class="lbl">nicht mehr</span>
  </button>
  <button class="btn-feedback btn-favorite" id="btnFavorite" disabled>
    <span class="ico" id="favIcon">♡</span><span class="lbl">Favorit</span>
  </button>
  <button class="btn-feedback btn-like" id="btnLike" disabled>
    <span class="ico">👍</span><span class="lbl">öfter</span>
  </button>
</div>

<div class="controls">
  <button class="btn-skip" id="btnSkip" disabled>⏭ Skip</button>

  <div class="extras-row">
    <button class="btn-extra" id="btnNews">📰 News</button>
    <button class="btn-extra" id="btnAktuelles">📻 Aktuelles</button>
    <button class="btn-extra" id="btnUpdate">🗞 Update</button>
  </div>

  <div class="ctl-line">
    <span class="ctl-key">Sender</span>
    <div class="pill-row" id="stationRow"></div>
  </div>

  <div class="ctl-line">
    <span class="ctl-key">Gerät</span>
    <div class="ctl-val" id="deviceCurrent">–</div>
    <button class="link" id="btnToggleDevices">ändern ▾</button>
  </div>
  <div class="pill-row hidden" id="deviceRow"></div>

  <div class="power-row">
    <button class="btn-power start" id="btnPower">▶ Start</button>
    <button class="btn-end" id="btnEnd" disabled>Beenden</button>
  </div>
</div>

<div class="statusline" id="statusLine"><span class="dot"></span>Verbinde…</div>
<div class="details hidden" id="detailsBox"></div>

<!-- Spotify kann keine fremden MP3-URLs abspielen - Nachrichten/Aktuelles
     laufen deshalb ueber dieses Element im Browser selbst, waehrend Spotify
     kurz pausiert wird. Ohne "controls" hat es keine sichtbare Flaeche. -->
<audio id="newsAudio" preload="none"></audio>

<script>
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxBbH87136ak1xaEq16iz-x52AiasndeZUhFcrQYbIgNlx2NfWBA_NZlhw7SP7hx6hxrQ/exec';

const IDLE_POLL_MS  = 20000;  // nichts laeuft: gemaechlich nachsehen
const ERROR_POLL_MS = 12000;  // Problemzustand: etwas haeufiger
const MIN_POLL_MS   = 6000;
// Aelter als das gilt die Anzeige als ueberholt. Beim Zurueckwechseln aus
// einer anderen App ist der letzte Stand oft Minuten alt - ihn so lange
// weiterzuzeigen, als waere er aktuell, ist schlimmer als ihn auszublenden.
const STALE_MS      = 35000;
const MAX_POLL_MS   = 30000;

const $ = id => document.getElementById(id);
const npTitle = $('npTitle'), npArtist = $('npArtist'), npMeta = $('npMeta');
const btnLike = $('btnLike'), btnDislike = $('btnDislike'), btnFavorite = $('btnFavorite'), favIcon = $('favIcon');
const btnSkip = $('btnSkip'), btnPower = $('btnPower'), btnEnd = $('btnEnd'), btnReload = $('btnReload');
const stationRow = $('stationRow'), deviceRow = $('deviceRow'), deviceCurrent = $('deviceCurrent');
const btnToggleDevices = $('btnToggleDevices');
const statusLine = $('statusLine'), detailsBox = $('detailsBox'), alertBox = $('alertBox');
const progressWrap = $('progressWrap'), progressFill = $('progressFill');
const tElapsed = $('tElapsed'), tTotal = $('tTotal');
const btnNews = $('btnNews'), btnAktuelles = $('btnAktuelles'), newsAudio = $('newsAudio');
const btnUpdate = $('btnUpdate'), seekRow = $('seekRow'), feedbackRow = $('feedbackRow');
const btnBack5 = $('btnBack5'), btnFwd10 = $('btnFwd10');

const STATION_LABELS = { '1live': '1LIVE', 'br1': 'Bayern 1', 'br3': 'Bayern 3' };

let st = null;              // letzte Server-Antwort
let currentKey = null;
let pollTimer = null;
let tickTimer = null;
let busy = null;            // Text, solange eine Aktion laeuft
let devicesOpen = false;
let detailsOpen = false;
let knownDevices = [];
let progressBase = 0;       // progress_ms zum Zeitpunkt der Antwort
let progressAt = 0;         // lokale Uhrzeit der Antwort
// Wartezustand: nach einem am Geraet gescheiterten Start prueft die App
// selbstaendig weiter und startet, sobald Spotify erreichbar ist. Sichtbar,
// damit man weiss, dass Warten reicht und man nichts druecken muss.
let waitingUntil = 0;
const WAIT_WINDOW_MS = 5 * 60 * 1000;
const WAIT_POLL_MS   = 5000;    // sichtbar
const WAIT_BG_POLL_MS = 10000;  // im Hintergrund (Android drosselt das evtl.)

// ── Nachrichten & Aktuelles ────────────────────────────────────
// Spotify kann keine fremden MP3-URLs abspielen - diese Beitraege laufen im
// Browser selbst (newsAudio), waehrend Spotify kurz pausiert wird. Zwei
// unabhaengige Ausloese-Wege treffen sich in maybeTriggerInterjection():
//   - vorausschauend in tick(): ~4s vor Songende, schneidet nur den
//     laufenden Song minimal an statt seinen Nachfolger.
//   - reaktiv in refresh(): falls die App waehrenddessen im Hintergrund war
//     (kein tick() lief) und der Songwechsel erst im Nachhinein auffaellt.
let pendingNews = null;               // vorbereitete Nachrichtenfolge, wartet auf die naechste Luecke
let aktuellesOn = localStorage.getItem('aktuellesOn') === '1';
let aktuellesNextItem = null;         // vorab geholt, damit beim Ausloesen keine Wartezeit entsteht
let songsSinceInterjection = 0;
let interjectionThreshold = 2;
let interjectionActive = null;        // { item, kind, paused } waehrend eine Einspielung laeuft
let updateQueue = [];                 // "Update"-Modus: die vier Folgen der Reihe nach
// Senderwechsel wirkt erst zum naechsten Songende: dann wird die komplette
// Wiedergabeliste bei Spotify durch Songs des neuen Senders ersetzt (der
// Start-Aufruf setzt den Kontext neu, siehe topUpQueue_/handleStartSession).
let pendingStationSwitch = false;
let resumeSeekMs = null;              // 0, wenn der naechste Song von vorne starten soll
let interjectionResolve = null;       // laesst Skip/Beenden die laufende Einspielung sofort abbrechen
let interjectionCancelReason = null;  // 'end_session' verhindert das automatische Fortsetzen danach
let lastSeenSongUri = null;
let triggeredForUri = null;           // verhindert doppeltes vorausschauendes Ausloesen fuer denselben Song

// Versions-/Remix-Zusaetze aus Songtiteln entfernen - reine Anzeigesache.
// Spotify haengt sie an ("Finder - Radio-Edit"), fuer die Anzeige interessiert
// aber nur der eigentliche Titel. Die Suchlogik im Backend, die bewusst die
// richtige Version findet, bleibt davon unberuehrt.
const VERSION_WORDS = /\b(radio[ -]?edit|radio[ -]?mix|radio[ -]?version|radio[ -]?cut|single[ -]version|album[ -]version|remaster(ed)?|remix(ed)?|extended|club[ -]mix|vip[ -]mix|original[ -]mix|dub[ -]mix|long[ -]version|maxi[ -]version|video[ -]?version|short[ -]cut|edit|version|live|mono|stereo|deluxe|bonus[ -]track|instrumental|a ?ca?pella|acoustic|karaoke|cover|mix)\b/i;

function cleanTitle(raw) {
  const original = String(raw === null || raw === undefined ? '' : raw);
  let t = original;

  // Klammer-Zusaetze am Ende, ggf. mehrere: "Song (Radio Edit) (Remastered)"
  let prev;
  do {
    prev = t;
    t = t.replace(/\s*[([]([^()[\]]*)[)\]]\s*$/, (m, inner) => VERSION_WORDS.test(inner) ? '' : m);
  } while (t !== prev);

  // Zusaetze hinter einem Trennstrich, ebenfalls ggf. mehrere.
  const parts = t.split(/\s+[-–—]\s+/);
  while (parts.length > 1 && VERSION_WORDS.test(parts[parts.length - 1])) parts.pop();
  t = parts.join(' - ').trim();

  return t || original; // nie leer zurueckgeben
}

function fmt(ms) {
  if (!ms && ms !== 0) return '0:00';
  const s = Math.max(0, Math.round(ms / 1000));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

let lastBadResponse = null;
// Gleitender Mittelwert der Antwortzeit. Apps Script braucht 2-3 s pro
// Aufruf - daraus errechnet sich der Vorlauf fuer den Pause-Befehl, damit
// er genau am Songende ankommt statt drei Sekunden danach.
let apiLatency = 2500;

// Apps Script liefert gelegentlich eine HTML-Seite statt JSON - das passiert
// in Googles HTTP-Schicht, nicht im Skript. Frueher landete das als rohes
// "Unexpected token '<'" beim Nutzer, obwohl die Aktion serverseitig
// erfolgreich war. Jetzt wird daraus ein sauberer Zustand, den der Aufrufer
// durch Nachfragen aufloesen kann.
const API_TIMEOUT_MS = 12000;

function api(action, params) {
  const qs = new URLSearchParams(Object.assign({ action: action, _t: Date.now() }, params || {}));
  const t0 = Date.now();
  // Ohne Zeitlimit konnte eine haengende Anfrage (typisch beim Wechsel
  // WLAN<->Mobilfunk) die komplette Abfrageschleife lahmlegen: der naechste
  // Abruf wird erst im .then() geplant, also nie. Die Anzeige blieb dann
  // minutenlang stehen. Jetzt bricht sie ab und der Aufrufer plant weiter.
  const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const killer = ctrl ? setTimeout(() => ctrl.abort(), API_TIMEOUT_MS) : null;

  return fetch(WEBAPP_URL + '?' + qs.toString(),
               ctrl ? { cache: 'no-store', signal: ctrl.signal } : { cache: 'no-store' })
    .then(r => r.text().then(text => {
      apiLatency = Math.round(apiLatency * 0.7 + (Date.now() - t0) * 0.3);
      try {
        return JSON.parse(text);
      } catch (e) {
        lastBadResponse = { at: Date.now(), action: action, status: r.status, snippet: text.slice(0, 100) };
        return { ok: false, code: 'BAD_RESPONSE',
                 message: 'Server hat keine lesbare Antwort geschickt (HTTP ' + r.status + ')' };
      }
    }))
    // Nie ablehnen, immer ein Ergebnis liefern - so laeuft der .then()-Pfad
    // der Aufrufer (und damit scheduleNext) auch bei Netzproblemen weiter.
    .catch(err => ({
      ok: false,
      code: (err && err.name === 'AbortError') ? 'TIMEOUT' : 'NETWORK',
      message: (err && err.name === 'AbortError')
        ? 'Server antwortet nicht (Zeitlimit)'
        : 'Keine Verbindung'
    }))
    .then(res => { if (killer) clearTimeout(killer); return res; });
}

// ── Anzeige ──────────────────────────────────────────────────
function setBusy(text) {
  busy = text;
  render();
}

let curSong = null;

// Ohne laufenden Song stand hier nur ein Gedankenstrich in einer riesigen
// schwarzen Flaeche - das sah aus wie ein Absturz. Jetzt steht dort, woran
// man ist.
function paintIdle() {
  if (!st || !st.ok) { npTitle.textContent = '—'; npArtist.textContent = ''; npMeta.textContent = ''; return; }
  if (st.phase === 'device_gone') {
    npTitle.textContent = 'Spotify öffnen';
    npArtist.textContent = (st.targetDeviceName || 'Zielgerät') + ' ist nicht erreichbar';
  } else if (st.phase === 'error') {
    npTitle.textContent = 'Kurz gestört';
    npArtist.textContent = 'versuche es gleich erneut';
  } else if (st.phase === 'paused') {
    npTitle.textContent = 'Pausiert';
    npArtist.textContent = '';
  } else {
    npTitle.textContent = 'Bereit';
    npArtist.textContent = (st.poolFresh || 0) + ' neue Songs';
  }
  npMeta.textContent = '';
}

function renderCurrent(cur) {
  curSong = cur || null;
  if (cur) {
    npTitle.textContent = cleanTitle(cur.title) || '—';
    npArtist.textContent = cur.artist || '';
    currentKey = cur.key || null;

    if (cur.mismatch) {
      // Der Sheet-Eintrag zeigte auf einen anderen Track. Angezeigt wird oben
      // das, was Spotify wirklich spielt - hier steht, was es haette sein
      // sollen und dass der Eintrag repariert wurde.
      npMeta.textContent = '⚠ Eintrag „' + cur.mismatch + '" war falsch verknüpft – korrigiert';
      npMeta.style.color = '#ffb300';
    } else {
      const parts = [];
      // Ohne Sheet-Key stammt der Song nicht von uns, sondern aus Spotifys
      // eigener Warteschlange (Reste frueherer Sitzungen). Dann sind auch
      // 👍/👎 wirkungslos - das soll man sehen, statt zu raten.
      if (!cur.key) parts.push('aus Spotifys Warteschlange');
      if (cur.station) parts.push(STATION_LABELS[cur.station] || cur.station);
      if (cur.playCount) parts.push(cur.playCount + '× gespielt');
      npMeta.textContent = parts.join(' · ');
      npMeta.style.color = '';
    }

    btnFavorite.disabled = !cur.uri;
    favIcon.textContent = cur.isFavorite ? '♥' : '♡';
    btnFavorite.classList.toggle('favorite-active', !!cur.isFavorite);
  } else {
    npTitle.textContent = '—';
    npArtist.textContent = '';
    npMeta.textContent = '';
    currentKey = null;
    btnFavorite.disabled = true;
    favIcon.textContent = '♡';
    btnFavorite.classList.remove('favorite-active');
  }
  btnLike.disabled = !currentKey;
  btnDislike.disabled = !currentKey;
}

let stationSig = '';

function renderStations(list) {
  if (!list) return;
  // Nur neu zeichnen, wenn sich wirklich etwas geaendert hat - sonst baut
  // jeder Status-Poll die Kacheln neu auf und kann einen Tap verschlucken.
  const sig = list.map(s => s.id + (s.active ? '1' : '0')).join(',');
  if (sig === stationSig) return;
  stationSig = sig;

  stationRow.innerHTML = '';
  const activeIds = list.filter(s => s.active).map(s => s.id);
  list.forEach(s => {
    const b = document.createElement('button');
    b.className = 'pill' + (s.active ? ' active' : '');
    b.textContent = s.label;
    b.addEventListener('click', () => {
      const next = s.active ? activeIds.filter(id => id !== s.id) : activeIds.concat(s.id);
      api('setStations', { stations: next.join(',') }).then(r => {
        if (!r.ok) return;
        stationSig = ''; renderStations(r.stations);
        // Laeuft gerade Musik, wird die Liste zum Songende getauscht - sonst
        // erst beim naechsten Start, da ist ohnehin nichts zu ersetzen.
        if (st && st.ok && st.isPlaying) { pendingStationSwitch = true; render(); }
      });
    });
    stationRow.appendChild(b);
  });
}

let deviceSig = '';

function renderDevices() {
  deviceRow.classList.toggle('hidden', !devicesOpen);
  btnToggleDevices.textContent = devicesOpen ? 'schließen ▴' : 'ändern ▾';
  if (!devicesOpen) return;

  const sig = knownDevices.map(d => d.id).join(',') + '|' + (st ? st.targetDeviceId : '');
  if (sig === deviceSig && deviceRow.childElementCount) return;
  deviceSig = sig;

  deviceRow.innerHTML = '';
  if (!knownDevices.length) {
    const s = document.createElement('div');
    s.style.cssText = 'font-size:12px;color:#666;padding:4px 0;';
    s.textContent = 'Kein Spotify-Gerät erreichbar.';
    deviceRow.appendChild(s);
    return;
  }
  knownDevices.forEach(d => {
    const b = document.createElement('button');
    b.className = 'pill' + (st && d.id === st.targetDeviceId ? ' active' : '');
    b.textContent = d.name;
    b.addEventListener('click', () => {
      api('setDevice', { id: d.id, name: d.name }).then(() => refresh());
    });
    deviceRow.appendChild(b);
  });
}

function renderAlert() {
  if (busy || !st) { alertBox.classList.add('hidden'); return; }

  const trouble = ['device_gone', 'error'].indexOf(st.phase) !== -1;
  // Alte Hintergrundfehler nicht ewig anzeigen - ein Fehler von vor zwei
  // Stunden ist kein aktueller Zustand, sondern nur Rauschen. Steht die App
  // gerade wirklich im Problemzustand, zeigen wir ihn unabhaengig vom Alter.
  const err = (st.lastError && Date.now() - st.lastError.at < 15 * 60 * 1000) ? st.lastError : null;
  if (!trouble && !(err && st.phase !== 'playing')) { alertBox.classList.add('hidden'); return; }

  // Im Wartezustand steht die Erklaerung schon gross im Hauptbereich - hier
  // dann nur noch die Knoepfe, statt denselben Satz doppelt zu zeigen (spart
  // auf kleinen Displays rund 40px).
  let html = isWaiting() ? '' : ('<div>' + escapeHtml(trouble ? st.message : err.message) + '</div>');
  html += '<div class="act"' + (isWaiting() ? ' style="margin-top:0"' : '') + '>';
  html += '<a id="lnkSpotify" href="spotify://">Spotify öffnen</a>';
  if (knownDevices.length) html += '<button id="btnPickDevice">Anderes Gerät</button>';
  html += '<button id="btnDismiss">Ausblenden</button>';
  html += '</div>';
  alertBox.innerHTML = html;
  alertBox.classList.remove('hidden');

  const lnk = $('lnkSpotify');
  if (lnk) lnk.addEventListener('click', () => { waitingUntil = Date.now() + WAIT_WINDOW_MS; render(); });
  const pick = $('btnPickDevice');
  if (pick) pick.addEventListener('click', () => { devicesOpen = true; renderDevices(); });
  $('btnDismiss').addEventListener('click', () => { alertBox.classList.add('hidden'); });
}

function renderDetails() {
  detailsBox.classList.toggle('hidden', !detailsOpen);
  if (!detailsOpen || !st) return;

  let h = '';
  if (st.pool && st.pool.stations) {
    h += '<b>Vorrat</b><br>';
    Object.keys(st.pool.stations).forEach(s => {
      const p = st.pool.stations[s];
      h += (STATION_LABELS[s] || s) + ': ' + p.fresh + ' neu, ' + p.known + ' bekannt<br>';
    });
    h += 'Stand: ' + new Date(st.pool.at).toLocaleTimeString('de-DE') + '<br><br>';
  }
  if (st.lastRefill) {
    h += '<b>Letzter Nachschub</b><br>' + new Date(st.lastRefill.at).toLocaleTimeString('de-DE') +
         ' · ' + (st.lastRefill.found || 0) + ' von ' + (st.lastRefill.resolved || 0) +
         ' gefunden, ' + (st.lastRefill.added || 0) + ' neu<br><br>';
  }
  h += '<b>Wiedergabe</b><br>Gerät: ' + escapeHtml(st.device || st.targetDeviceName || '–') +
       '<br>Warteschlange: ' + (st.queueAhead || 0) +
       '<br>Session: ' + (st.sessionActive ? 'aktiv' : 'aus') +
       '<br>Antwortzeit: ' + (apiLatency / 1000).toFixed(1) + ' s' +
       ' (Vorlauf ' + (Math.min(3500, Math.max(300, apiLatency - 1000)) / 1000).toFixed(1) + ' s)' +
       (isWaiting() ? '<br>Warte auf Gerät: noch ' + fmt(waitingUntil - Date.now()) : '') +
       (updateQueue.length ? '<br>Update-Folgen offen: ' + updateQueue.length : '') + '<br>';
  if (lastBadResponse) {
    h += '<br><b style="color:#ff8fa0">Unlesbare Serverantwort</b><br>' +
         new Date(lastBadResponse.at).toLocaleTimeString('de-DE') + ' · ' + escapeHtml(lastBadResponse.action) +
         ' · HTTP ' + lastBadResponse.status + '<br>' + escapeHtml(lastBadResponse.snippet) + '<br>';
  }
  if (st.lastError) {
    h += '<br><b style="color:#ff8fa0">Letzter Fehler</b><br>' +
         new Date(st.lastError.at).toLocaleTimeString('de-DE') + ' [' +
         escapeHtml(st.lastError.where) + ']<br>' + escapeHtml(st.lastError.message);
  }
  detailsBox.innerHTML = h;
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// Eigene, einfachere Darstellung waehrend Nachrichten/Aktuelles laeuft -
// wichtig VOR der isStale()-Pruefung im normalen render(): eine Einspielung
// kann laenger als STALE_MS laufen, ohne dass wir zwischendurch pollen,
// sonst wuerde "Aktualisiere..." die Anzeige ueberschreiben.
function renderInterjection() {
  const ia = interjectionActive;
  // Gross nur der Sendungsname - die Folgen-Schlagzeile ist oft vier Zeilen
  // lang und hat den Bereich vorher ueberlaufen lassen.
  npTitle.textContent = ia.item.show || 'Podcast';
  npArtist.textContent = ia.item.source || '';
  // Die Schlagzeile klein und auf zwei Zeilen begrenzt - informativ, ohne
  // das Layout zu sprengen.
  npMeta.textContent = ia.item.title || '';
  npMeta.style.color = '';
  npMeta.classList.add('clamp2');
  document.querySelector('.now-playing').style.opacity = '';

  // Bewertungs-Reihe gegen die Spultasten tauschen (gleiche Hoehe, kein Sprung).
  feedbackRow.classList.add('hidden');
  seekRow.classList.remove('hidden');

  const label = ia.kind === 'news' ? 'Nachrichten' : (ia.kind === 'update' ? 'Update' : 'Aktuelles');
  statusLine.className = 'statusline ' + (ia.paused ? 'paused' : 'playing');
  statusLine.innerHTML = '<span class="dot"></span>' +
    escapeHtml(ia.paused ? label + ' pausiert' : label + ' läuft…');

  // Pause/Fortsetzen wirkt waehrend einer Einspielung auf den Podcast, nicht
  // auf Spotify - Spotify ist ja ohnehin schon angehalten.
  btnPower.classList.remove('start', 'pause', 'resume', 'busy');
  btnPower.disabled = false;
  if (ia.paused) {
    btnPower.textContent = '▶ Fortsetzen';
    btnPower.classList.add('resume');
  } else {
    btnPower.textContent = '⏸ Pause';
    btnPower.classList.add('pause');
  }

  btnEnd.disabled = false;
  btnSkip.disabled = false;
  btnSkip.textContent = '⏭ Überspringen';
}

// Eigene Darstellung, solange auf das Geraet gewartet wird: man soll sehen,
// dass Warten reicht und man nichts druecken muss.
function renderWaiting() {
  const restMs = Math.max(0, waitingUntil - Date.now());
  const name = (st && st.targetDeviceName) || 'dem Gerät';

  npTitle.textContent = 'Warte auf ' + name;
  npArtist.textContent = 'Spotify dort öffnen – ich starte von selbst';
  npMeta.textContent = 'noch ' + fmt(restMs);
  npMeta.style.color = '';
  npMeta.classList.remove('clamp2');
  document.querySelector('.now-playing').style.opacity = '';
  progressWrap.classList.add('hidden');

  seekRow.classList.add('hidden');
  feedbackRow.classList.remove('hidden');
  btnLike.disabled = true; btnDislike.disabled = true; btnFavorite.disabled = true;

  statusLine.className = 'statusline busy';
  statusLine.innerHTML = '<span class="dot"></span>' +
    escapeHtml('Warte auf ' + name + ' · starte automatisch');

  btnPower.classList.remove('start', 'pause', 'resume', 'busy');
  btnPower.classList.add('busy');
  btnPower.textContent = '⏳ Warten abbrechen';
  btnPower.disabled = false;
  btnEnd.disabled = false;
  btnSkip.disabled = true;
  btnSkip.textContent = '⏭ Skip';

  renderAlert();
  renderDetails();
}

function render() {
  if (interjectionActive) { renderInterjection(); return; }
  if (isWaiting() && !(st && st.ok && st.isPlaying)) { renderWaiting(); return; }

  // Zurueck zur Musik: Spultasten weg, Bewertung wieder da.
  seekRow.classList.add('hidden');
  feedbackRow.classList.remove('hidden');
  npMeta.classList.remove('clamp2');

  // Statuszeile ist immer eindeutig - nie leer, nie mehrdeutig.
  let cls = '', text;
  if (busy) {
    cls = 'busy'; text = busy;
  } else if (!st) {
    text = 'Verbinde…';
  } else if (!st.ok) {
    cls = 'trouble'; text = st.message || 'Fehler';
  } else {
    text = st.message;
    if (st.phase === 'playing') cls = 'playing';
    else if (st.phase === 'paused') cls = 'paused';
    else if (st.phase === 'device_gone' || st.phase === 'error') cls = 'trouble';
  }
  // Vorgemerktes sichtbar machen - sonst tippt man und nichts scheint zu passieren.
  if (!busy && st && st.ok) {
    const wartet = [];
    if (pendingStationSwitch) wartet.push('Sender wechselt nach dem Lied');
    if (pendingNews) wartet.push('Nachrichten nach dem Lied');
    if (wartet.length) text = text + ' · ' + wartet.join(' · ');
  }
  // Lieber "ich schaue gerade nach" als eine Angabe, die nicht mehr stimmt.
  if (!busy && isStale()) { cls = 'busy'; text = 'Aktualisiere…'; }

  statusLine.className = 'statusline ' + cls;
  statusLine.innerHTML = '<span class="dot"></span>' + escapeHtml(text);
  document.querySelector('.now-playing').style.opacity = (!busy && isStale()) ? '0.35' : '';

  const phase = busy ? 'busy' : (st && st.ok ? st.phase : 'idle');

  // Power-Knopf haengt an der Phase, NICHT an sessionActive. Frueher zeigte
  // er nach einem gescheiterten Start "Pause" an - man kam ohne "Beenden"
  // nicht mal zu einem zweiten Versuch.
  btnPower.classList.remove('start', 'pause', 'resume', 'busy');
  if (busy) {
    btnPower.innerHTML = escapeHtml(busy);
    btnPower.classList.add('busy');
    btnPower.disabled = true;
  } else if (phase === 'playing') {
    btnPower.textContent = '⏸ Pause';
    btnPower.classList.add('pause');
    btnPower.disabled = false;
  } else if (phase === 'paused') {
    btnPower.textContent = '▶ Fortsetzen';
    btnPower.classList.add('resume');
    btnPower.disabled = false;
  } else {
    // Wenn der Vorrat leer ist, dauert der Start ausnahmsweise laenger -
    // das steht dann vorher am Knopf, statt hinterher zu ueberraschen.
    const empty = st && st.ok && st.pool && !st.poolFresh && !st.poolKnown;
    btnPower.innerHTML = '▶ Start' + (empty ? '<span class="sub">Liste leer – dauert ~20 s</span>' : '');
    btnPower.classList.add('start');
    btnPower.disabled = false;
  }

  // Immer tippbar: das ist der Notausgang, der Session, Pause-Flag und
  // Warteschlangen-Zustand serverseitig zuruecksetzt.
  btnEnd.disabled = !!busy;
  btnSkip.disabled = busy || !(st && st.isPlaying);
  btnSkip.textContent = '⏭ Skip'; // renderInterjection() benennt ihn waehrend einer Einspielung um

  if (st) {
    deviceCurrent.textContent = st.device || st.targetDeviceName || '–';
    deviceCurrent.style.color = (st.targetOnline === false) ? '#ff8fa0' : '#999';
  }

  if (!curSong || !(st && st.ok && (st.isPlaying || st.phase === 'paused'))) paintIdle();

  renderAlert();
  renderDetails();
}

// ── Fortschritt lokal weiterzaehlen ──────────────────────────
// Der Fortschritt wird lokal hochgezaehlt. Nach einer Pause im Hintergrund
// waere die hochgerechnete Position frei erfunden - dann lieber nichts zeigen.
function isStale() {
  if (!st || !st.ok) return false;
  if (st.phase !== 'playing' && st.phase !== 'paused') return false;
  return !progressAt || (Date.now() - progressAt) > STALE_MS;
}

function tick() {
  if (interjectionActive) return;
  // Im Wartezustand laeuft hier nur der Countdown weiter.
  if (isWaiting() && !(st && st.ok && st.isPlaying)) { renderWaiting(); return; } // Fortschritt kommt waehrend einer Einspielung vom Audio-Element selbst (siehe startInterjection)
  if (isStale() || !st || !st.isPlaying || !st.current || !st.current.durationMs || progressBase === null) {
    progressWrap.classList.add('hidden');
    return;
  }
  const dur = st.current.durationMs;
  const pos = Math.min(dur, progressBase + (Date.now() - progressAt));
  progressWrap.classList.remove('hidden');
  progressFill.style.width = (100 * pos / dur).toFixed(1) + '%';
  tElapsed.textContent = fmt(pos);
  tTotal.textContent = fmt(dur);

  // Der Pause-Befehl laeuft ueber Apps Script und braucht 2-3 Sekunden bis er
  // bei Spotify ankommt. Loesen wir exakt am Songende aus, spielt der naechste
  // Song genau diese Zeit an, bevor es still wird. Deshalb um die gemessene
  // Antwortzeit vorziehen (minus ~1 s, damit wir eher knapp NACH dem Ende
  // landen als davor - dort greift dann das Zuruecksetzen auf 0).
  const left = dur - pos;
  const lead = Math.min(3500, Math.max(300, apiLatency - 1000));
  if (left <= lead && left > -6000 && st.current.uri && triggeredForUri !== st.current.uri) {
    if (pendingStationSwitch) {
      // Vorrang vor Einspielungen: erst die Liste tauschen, Beitraege kommen
      // dann ab dem naechsten Songende wieder normal.
      triggeredForUri = st.current.uri;
      pendingStationSwitch = false;
      doStart({ busyText: 'Wechsle Sender…' });
    } else if (interjectionDue()) {
      triggeredForUri = st.current.uri;
      maybeTriggerInterjection();
    }
  }
}

function interjectionDue() {
  if (pendingNews) return true;
  // Update-Modus hat Vorrang vor Aktuelles und braucht genau ein komplettes
  // Lied Abstand.
  if (updateQueue.length && songsSinceInterjection >= 1) return true;
  return aktuellesOn && songsSinceInterjection >= interjectionThreshold && !!aktuellesNextItem;
}

// ── Polling: gezielt zum Songende statt stur alle 20 s ───────
function isWaiting() { return waitingUntil > Date.now(); }

function scheduleNext() {
  clearTimeout(pollTimer);

  // Im Hintergrund normalerweise gar nicht pollen (Akku, Kontingent) - im
  // Wartezustand aber schon, damit die Musik auch dann losgeht, wenn man in
  // der Spotify-App bleibt. Android drosselt das evtl., der Abruf beim
  // Zurueckwechseln greift dann trotzdem sofort.
  if (document.hidden && !isWaiting()) return;
  if (isWaiting()) {
    pollTimer = setTimeout(() => {
      if (Date.now() > waitingUntil) { refresh(); return; }  // Fenster abgelaufen -> normal weiter
      doStart({ quiet: true });
    }, document.hidden ? WAIT_BG_POLL_MS : WAIT_POLL_MS);
    return;
  }

  let delay = IDLE_POLL_MS;

  if (st && st.ok) {
    if (st.phase === 'playing' && st.current && st.current.durationMs && progressBase !== null) {
      const left = st.current.durationMs - (progressBase + (Date.now() - progressAt));
      delay = Math.min(MAX_POLL_MS, Math.max(MIN_POLL_MS, left + 1500));
    } else if (st.phase === 'device_gone' || st.phase === 'error' || st.phase === 'stalled') {
      delay = ERROR_POLL_MS;
    }
  }
  pollTimer = setTimeout(refresh, delay);
}

// Letzten guten Zustand behalten und den Fehler nur darueberlegen. Vorher
// ersetzte eine Fehlerantwort das komplette st - dadurch verschwanden Sender,
// Geraet und Vorratszahlen aus der Anzeige.
function setSoftError(message, phase) {
  st = Object.assign({}, st || {}, { ok: true, phase: phase || 'error', message: message });
  render();
}

let lastPollAt = 0;

function refresh(isRetry) {
  lastPollAt = Date.now();
  return api('status').then(data => {
    if (!data.ok && data.code === 'BAD_RESPONSE' && !isRetry) {
      // Googles Frontend liefert sporadisch eine Fehlerseite statt unserer
      // Antwort. Einmal still nachfassen, bevor der Nutzer davon erfaehrt.
      setTimeout(() => refresh(true), 2000);
      return;
    }
    if (!data.ok) {
      setSoftError(data.message || 'Verbindung gestört', 'error');
      scheduleNext();
      return;
    }
    st = data;
    if (data.ok) {
      progressBase = (typeof data.progressMs === 'number') ? data.progressMs : null;
      progressAt = Date.now();
      renderCurrent(data.current);
      renderStations(data.stations);
      if (data.devices) { knownDevices = data.devices; renderDevices(); }

      // Ein echter Songwechsel (nicht nur ein weiterer Poll desselben Songs)
      // zaehlt fuer "alle 2-3 Lieder" und ist zugleich das Sicherheitsnetz:
      // falls die vorausschauende Ausloesung in tick() verpasst wurde (App
      // war im Hintergrund, kein tick() lief), greift sie hier reaktiv -
      // dann eben mit ein paar Sekunden Ueberlappung in den neuen Song statt
      // sauber an dessen Ende.
      const newUri = data.current ? data.current.uri : null;
      if (lastSeenSongUri && newUri && newUri !== lastSeenSongUri && data.phase === 'playing' && !interjectionActive) {
        songsSinceInterjection++;
        triggeredForUri = null;
        // Reaktives Netz nur, wenn der neue Song gerade erst angefangen hat.
        // Sonst schnitte es mitten hinein - genau das sollte nicht passieren.
        // Ist der Song schon laenger unterwegs, wird nur gezaehlt und aufs
        // naechste Songende gewartet (tick() uebernimmt das).
        if ((data.progressMs || 0) < 10000 && interjectionDue()) maybeTriggerInterjection();
      }
      lastSeenSongUri = newUri || lastSeenSongUri;

      // Wartezustand: sobald das Gerät antwortet, von selbst starten.
      if (waitingUntil > Date.now() && data.targetOnline && data.phase !== 'playing') {
        waitingUntil = 0;
        doStart();
        return;
      }
      if (waitingUntil && Date.now() > waitingUntil) {
        // Nicht stumm aufgeben - sagen, dass jetzt Handarbeit noetig ist.
        waitingUntil = 0;
        setSoftError('Kein Gerät gefunden – Spotify öffnen und Start drücken', 'device_gone');
        scheduleNext();
        return;
      }
    }
    render();
    tick();
    scheduleNext();
  }).catch(err => {
    setSoftError('Keine Verbindung: ' + err.message, 'error');
    scheduleNext();
  });
}

// ── Aktionen ─────────────────────────────────────────────────
// quiet=true: der wiederholte Versuch aus dem Wartezustand heraus. Statt
// erst den Status abzufragen (3,5 s) und DANN zu starten, wird direkt der
// Start versucht - er bricht bei fehlendem Geraet ohnehin frueh ab. Spart im
// Erfolgsfall einen kompletten Roundtrip.
let startInFlight = false;

function doStart(opts) {
  const quiet = !!(opts && opts.quiet);
  if (startInFlight) return;      // kein Doppelstart durch ueberlappende Versuche
  startInFlight = true;
  if (!quiet) setBusy((opts && opts.busyText) || 'Starte…');
  api('startSession').then(r => {
    startInFlight = false;
    if (r.ok) {
      if (r.devices) knownDevices = r.devices;
      busy = null;
      waitingUntil = 0;
      st = Object.assign({}, st || {}, {
        ok: true, phase: 'playing', message: r.message, isPlaying: true, isPaused: false,
        sessionActive: true, current: r.current, queueAhead: r.queueAhead,
        device: r.device, targetOnline: true, lastError: null
      });
      progressBase = 0; progressAt = Date.now();
      renderCurrent(r.current);
      render();
      tick();
      refresh();
    } else if (r.code === 'BAD_RESPONSE') {
      if (quiet) { scheduleNext(); return; }   // im Wartezustand einfach weiterprobieren
      // Kann trotzdem geklappt haben - nachsehen statt etwas zu behaupten.
      setBusy('Antwort unklar – prüfe, ob es läuft…');
      setTimeout(() => { busy = null; refresh(); }, 2500);
      setTimeout(refresh, 9000);
    } else if (quiet) {
      // Geraet weiterhin nicht da - Wartezustand unveraendert weiterlaufen
      // lassen (nicht neu scharfschalten, sonst liefe das Fenster nie ab).
      if (r.devices) knownDevices = r.devices;
      render();
      scheduleNext();
    } else {
      busy = null;
      if (r.devices) { knownDevices = r.devices; renderDevices(); }
      st = Object.assign({}, st || {}, {
        ok: true, phase: r.code === 'DEVICE_GONE' || r.code === 'NO_DEVICE' ? 'device_gone' : 'error',
        message: r.message || 'Start fehlgeschlagen'
      });
      // Scheiterte es am Geraet, ist die Absicht eindeutig: ab jetzt selbst
      // weiterprueferen und starten, sobald Spotify antwortet. Frueher musste
      // man dafuer erst den "Spotify öffnen"-Knopf benutzen.
      if (['DEVICE_GONE', 'NO_DEVICE', 'PLAY_FAILED'].indexOf(r.code) !== -1) {
        waitingUntil = Date.now() + WAIT_WINDOW_MS;
      }
      render();
      scheduleNext();
      // Spotify laesst die Wiedergabe manchmal verzoegert doch anlaufen -
      // deshalb kurz danach nochmal den echten Stand holen.
      setTimeout(refresh, 6000);
    }
  }).catch(err => {
    startInFlight = false;
    if (quiet) { scheduleNext(); return; }
    busy = null;
    st = { ok: false, message: 'Start fehlgeschlagen: ' + err.message, phase: 'error' };
    render();
    scheduleNext();
  });
}

// ── Nachrichten & Aktuelles: die eigentliche Einspielung ──────
function prefetchNextAktuelles() {
  api('nextAktuelles').then(r => { if (r.ok && r.item) aktuellesNextItem = r.item; });
}

function rollInterjectionThreshold() {
  songsSinceInterjection = 0;
  interjectionThreshold = 1; // Beitrag und Lied wechseln sich ab
}

// Nur wenn wirklich eine Session laeuft ausloesen - sonst wuerde playerResume
// nachher unter Umstaenden ungefragt Musik starten, obwohl der Nutzer die
// DJ-Session gar nicht aktiv hat.
function maybeTriggerInterjection() {
  if (interjectionActive || busy) return;
  if (!st || !st.ok || !st.sessionActive) return;

  if (pendingNews) {
    const item = pendingNews;
    pendingNews = null;
    btnNews.classList.remove('active');
    startInterjection(item, 'news');
    return;
  }
  if (updateQueue.length && songsSinceInterjection >= 1) {
    const item = updateQueue.shift();
    songsSinceInterjection = 0;
    renderUpdateButton();
    startInterjection(item, 'update');
    return;
  }
  if (aktuellesOn && songsSinceInterjection >= interjectionThreshold && aktuellesNextItem) {
    const item = aktuellesNextItem;
    aktuellesNextItem = null;
    rollInterjectionThreshold();
    startInterjection(item, 'aktuelles');
    prefetchNextAktuelles(); // fuer die naechste Runde gleich schon mal bereitlegen
  }
}

function renderUpdateButton() {
  const n = updateQueue.length;
  btnUpdate.classList.toggle('active', n > 0);
  btnUpdate.textContent = n > 0 ? '🗞 Update ' + n : '🗞 Update';
}

function cancelInterjection(reason) {
  interjectionCancelReason = reason || 'user_skip';
  if (interjectionResolve) interjectionResolve();
}

async function startInterjection(item, kind) {
  interjectionActive = { item: item, kind: kind, paused: false };
  let watchdog = null;
  render();

  // playerPause/-Resume ruehren bewusst NICHT an Session/Pause-Zustand
  // (siehe News.js) - eine Nachrichten-Unterbrechung soll nicht wie ein
  // Nutzer-Pause aussehen oder den Nachschub-Trigger stoppen.
  resumeSeekMs = null;
  try {
    const pauseRes = await api('playerPause');
    // Da wir erst nach Songende ausloesen, laeuft der naechste Song meist
    // schon ein, zwei Sekunden. Den setzen wir beim Fortsetzen auf 0 zurueck,
    // damit er wirklich komplett laeuft.
    if (pauseRes && pauseRes.ok && typeof pauseRes.progressMs === 'number' && pauseRes.progressMs < 20000) {
      resumeSeekMs = 0;
    }
  } catch (e) { /* egal, weiter mit der Einspielung */ }

  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: item.title,
        artist: kind === 'update' ? (item.show || 'Podcast')
                                  : ('Deutschlandfunk' + (item.show ? ' · ' + item.show : '')),
        album: '1LIVE DJ'
      });
    } catch (e) { /* nicht kritisch */ }
  }

  newsAudio.src = item.url;
  progressWrap.classList.remove('hidden');
  progressFill.style.width = '0%';
  tElapsed.textContent = '0:00';
  tTotal.textContent = fmt(item.durationMs || 0);
  newsAudio.ontimeupdate = () => {
    const d = newsAudio.duration || (item.durationMs ? item.durationMs / 1000 : 0);
    if (!d) return;
    progressFill.style.width = (100 * newsAudio.currentTime / d).toFixed(1) + '%';
    tElapsed.textContent = fmt(newsAudio.currentTime * 1000);
    tTotal.textContent = fmt(d * 1000);
  };

  await new Promise(resolve => {
    interjectionResolve = resolve;
    const done = () => resolve();
    newsAudio.onended = done;
    newsAudio.onerror = done;
    newsAudio.play().catch(done);

    // Wachhund statt starrem Timeout: ein fester Timer wuerde eine laengere
    // Nutzer-Pause faelschlich als Abbruch werten. Hier zaehlt nur, ob die
    // Wiedergabe haengt, WAEHREND sie eigentlich laufen sollte.
    let lastPos = -1, stalledFor = 0;
    watchdog = setInterval(() => {
      if (interjectionActive && interjectionActive.paused) { stalledFor = 0; return; }
      if (newsAudio.currentTime !== lastPos) { lastPos = newsAudio.currentTime; stalledFor = 0; return; }
      stalledFor += 5;
      if (stalledFor >= 40) done(); // 40 s ohne Fortschritt trotz "spielt" -> aufgeben
    }, 5000);
  });
  clearInterval(watchdog);

  const cancelReason = interjectionCancelReason;
  interjectionCancelReason = null;
  interjectionResolve = null;

  newsAudio.onended = null; newsAudio.onerror = null; newsAudio.ontimeupdate = null;
  newsAudio.pause();
  newsAudio.removeAttribute('src');
  newsAudio.load();
  progressWrap.classList.add('hidden');
  interjectionActive = null;
  seekRow.classList.add('hidden');
  feedbackRow.classList.remove('hidden');

  if (cancelReason !== 'end_session') {
    const params = (resumeSeekMs !== null) ? { seekMs: resumeSeekMs } : undefined;
    try { await api('playerResume', params); } catch (e) { /* naechster Poll zeigt den echten Stand */ }
  }
  resumeSeekMs = null;
  refresh();
}

btnNews.addEventListener('click', () => {
  if (pendingNews) {
    // erneutes Tippen nimmt die Anfrage wieder zurueck
    pendingNews = null;
    btnNews.classList.remove('active');
    return;
  }
  btnNews.classList.add('active');
  api('latestNews').then(r => {
    if (r.ok && r.item) {
      pendingNews = r.item;
      // Nur sofort loslegen, wenn gerade wirklich nichts spielt. Laeuft ein
      // Song, wird er ausgespielt - das Ausloesen uebernimmt dann die
      // Songende-Erkennung in tick(). Vorher brach der Knopf den laufenden
      // Song mitten drin ab.
      if (!(st && st.ok && st.isPlaying)) maybeTriggerInterjection();
      render();
    } else {
      btnNews.classList.remove('active');
    }
  }).catch(() => btnNews.classList.remove('active'));
});

btnAktuelles.addEventListener('click', () => {
  aktuellesOn = !aktuellesOn;
  localStorage.setItem('aktuellesOn', aktuellesOn ? '1' : '0');
  btnAktuelles.classList.toggle('active', aktuellesOn);
  if (aktuellesOn) {
    rollInterjectionThreshold();
    if (!aktuellesNextItem) prefetchNextAktuelles();
  }
});

btnPower.addEventListener('click', () => {
  // Waehrend einer Einspielung steuert der Knopf den Podcast, nicht Spotify.
  if (interjectionActive) {
    if (newsAudio.paused) { newsAudio.play().catch(() => {}); interjectionActive.paused = false; }
    else                  { newsAudio.pause();                 interjectionActive.paused = true;  }
    render();
    return;
  }
  if (isWaiting()) { waitingUntil = 0; render(); scheduleNext(); return; }
  const phase = st && st.ok ? st.phase : 'idle';
  if (phase === 'playing') {
    setBusy('Pausiere…');
    api('pause').then(() => { busy = null; refresh(); })
      .catch(e => { busy = null; st = { ok: false, message: String(e), phase: 'error' }; render(); });
  } else if (phase === 'paused') {
    setBusy('Setze fort…');
    api('resume').then(r => {
      busy = null;
      if (!r.ok && r.devices) knownDevices = r.devices;
      refresh();
    }).catch(e => { busy = null; st = { ok: false, message: String(e), phase: 'error' }; render(); });
  } else {
    doStart();
  }
});

btnEnd.addEventListener('click', () => {
  // Notausgang: eine laufende Einspielung sofort abbrechen, OHNE sie danach
  // fortzusetzen - stopSession() pausiert ohnehin gleich alles. Auch den
  // Update-Modus beenden, sonst liefe er nach dem naechsten Start weiter.
  if (interjectionActive) cancelInterjection('end_session');
  updateQueue = [];
  waitingUntil = 0;
  pendingStationSwitch = false;
  pendingNews = null;
  btnNews.classList.remove('active');
  renderUpdateButton();
  setBusy('Beende…');
  api('stopSession').then(() => { busy = null; refresh(); })
    .catch(e => { busy = null; st = { ok: false, message: String(e), phase: 'error' }; render(); });
});

btnSkip.addEventListener('click', () => {
  if (interjectionActive) { cancelInterjection('user_skip'); return; }
  btnSkip.disabled = true;
  api('skip').then(r => {
    if (r.ok && r.current) { renderCurrent(r.current); progressBase = 0; progressAt = Date.now(); }
    else if (!r.ok) { st = Object.assign({}, st, { message: r.message, phase: 'error' }); render(); }
    setTimeout(refresh, 2500);
  }).catch(() => setTimeout(refresh, 2500));
});

function flashSent(btn) {
  btn.classList.add('sent');
  setTimeout(() => btn.classList.remove('sent'), 400);
}

btnLike.addEventListener('click', () => {
  if (!currentKey) return;
  flashSent(btnLike);
  api('like', { key: currentKey }).then(r => {
    if (r.ok && r.current) {
      favIcon.textContent = r.current.isFavorite ? '♥' : '♡';
      btnFavorite.classList.toggle('favorite-active', !!r.current.isFavorite);
    }
  });
});

btnDislike.addEventListener('click', () => {
  if (!currentKey) return;
  flashSent(btnDislike);
  api('dislike', { key: currentKey }).then(r => {
    if (r.current) { renderCurrent(r.current); progressBase = 0; progressAt = Date.now(); }
    setTimeout(refresh, 2500);
  });
});

btnFavorite.addEventListener('click', () => {
  btnFavorite.disabled = true;
  api('toggleFavorite').then(r => {
    btnFavorite.disabled = false;
    if (r.ok) {
      favIcon.textContent = r.isFavorite ? '♥' : '♡';
      btnFavorite.classList.toggle('favorite-active', r.isFavorite);
    }
  }).catch(() => { btnFavorite.disabled = false; });
});

btnToggleDevices.addEventListener('click', () => {
  devicesOpen = !devicesOpen;
  renderDevices();
  if (devicesOpen && !knownDevices.length) {
    api('devices').then(r => { if (r.ok) { knownDevices = r.devices; renderDevices(); } });
  }
});

function seekBy(seconds) {
  if (!interjectionActive) return;
  const dur = newsAudio.duration || (interjectionActive.item.durationMs || 0) / 1000;
  const target = newsAudio.currentTime + seconds;
  newsAudio.currentTime = Math.max(0, dur ? Math.min(dur - 0.5, target) : Math.max(0, target));
}
btnBack5.addEventListener('click', () => seekBy(-5));
btnFwd10.addEventListener('click', () => seekBy(10));

btnUpdate.addEventListener('click', () => {
  if (updateQueue.length) {
    // Erneutes Tippen bricht den Modus ab (eine gerade laufende Folge nicht).
    updateQueue = [];
    renderUpdateButton();
    return;
  }
  btnUpdate.textContent = '🗞 lädt…';
  btnUpdate.disabled = true;
  api('updateEpisodes').then(r => {
    btnUpdate.disabled = false;
    if (r.ok && r.episodes && r.episodes.length) {
      updateQueue = r.episodes;
      // Update hat Vorrang - Aktuelles waehrenddessen ausschalten, damit sich
      // die beiden Modi nicht gegenseitig die Luecken wegnehmen.
      if (aktuellesOn) {
        aktuellesOn = false;
        localStorage.setItem('aktuellesOn', '0');
        btnAktuelles.classList.remove('active');
      }
      songsSinceInterjection = 1; // die erste Folge kommt nach dem laufenden Lied
      renderUpdateButton();
      if (r.failed && r.failed.length) {
        setSoftError('Update: ' + r.failed.join(', ') + ' gerade nicht erreichbar', st ? st.phase : 'idle');
      }
    } else {
      renderUpdateButton();
      setSoftError('Update-Folgen konnten nicht geladen werden', 'error');
    }
  }).catch(() => { btnUpdate.disabled = false; renderUpdateButton(); });
});

statusLine.addEventListener('click', () => { detailsOpen = !detailsOpen; renderDetails(); });
btnReload.addEventListener('click', () => location.reload());

// Bei versteckter Seite gar nicht pollen; beim Zurueckkommen sofort einmal.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clearInterval(tickTimer); tickTimer = null;
    scheduleNext(); // pollt nur weiter, wenn wir auf ein Geraet warten
  } else {
    if (!tickTimer) tickTimer = setInterval(tick, 500);
    // Sofort sichtbar machen, dass der angezeigte Stand von vorhin ist -
    // der Abruf braucht ein paar Sekunden, und genau in diesem Fenster stand
    // bisher der alte Song da, als liefe er gerade.
    render(); tick();
    refresh();
  }
});

// Wachhund: Guertel und Hosentraeger gegen eine abgerissene Abfrageschleife.
// Selbst wenn irgendein Pfad einmal kein scheduleNext() aufruft, kommt die
// App hier von allein zurueck, statt bis zum naechsten Tippen stehenzubleiben.
setInterval(() => {
  if (interjectionActive) return;
  if (document.hidden && !isWaiting()) return;
  if (Date.now() - lastPollAt > 60000) refresh();
}, 15000);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

btnAktuelles.classList.toggle('active', aktuellesOn);
if (aktuellesOn) { rollInterjectionThreshold(); prefetchNextAktuelles(); }
renderUpdateButton();

tickTimer = setInterval(tick, 500);
render();
refresh();
</script>
