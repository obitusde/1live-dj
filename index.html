  if (!spActive()) return api('playerResume', Object.keys(params).length ? params : undefined);
  let kette = Promise.resolve();
  if (params.skipNext) kette = kette.then(() => spCmd('next', '/me/player/next', 'POST'));
  if (params.seekMs !== undefined && params.seekMs !== null) {
    kette = kette.then(() => spCmd('seek', '/me/player/seek?position_ms=' + Math.max(0, parseInt(params.seekMs, 10) || 0), 'PUT')
      .catch(() => null)); // Spulen ist nett, aber kein Grund zu scheitern
  }
  return kette
    .then(() => spCmd('play', '/me/player/play', 'PUT').catch(err => {
      // 403 = laeuft schon (z.B. hat "next" die Wiedergabe gestartet)
      if (err.status !== 403) throw err;
    }))
    .then(() => ({ ok: true }))
    .catch(() => api('playerResume', Object.keys(params).length ? params : undefined));
}

function rollInterjectionThreshold() {
  songsSinceInterjection = 0;
  interjectionThreshold = 1; // Beitrag und Lied wechseln sich ab
}

// Nur wenn wirklich eine Session laeuft ausloesen - sonst wuerde playerResume
// nachher unter Umstaenden ungefragt Musik starten, obwohl der Nutzer die
// DJ-Session gar nicht aktiv hat.
// ── Beitraege im Hintergrund ermoeglichen ───────────────────
// Chrome laedt Audio einer Seite im Hintergrund erst, wenn sie wieder sichtbar
// wird - AUSSER die Seite hat schon einmal Audio abgespielt. Belegt am 16.09.
// um 23:22: Songende im Hintergrund erkannt, Spotify pausiert, der Beitrag lief
// aber nie an ("start_blockiert"). Deshalb zwei Vorkehrungen:
//   1. einmal pro Sitzung einen halbsekuendigen stummen Ton abspielen
//      ("Freischalten"), am besten beim Tippen auf einen Knopf;
//   2. den naechsten Beitrag schon im Vordergrund vorladen.
// Und im Hintergrund wird Spotify nur noch angehalten, wenn der Beitrag
// wirklich abspielbereit ist - sonst laeuft die Musik weiter.
let mediaFreigegeben = false;
let mediaFreigabeLaeuft = false;
let verschobenFuerUri = null;

function stummerTonUrl() {
  const sr = 8000, n = sr / 2, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
  w(36, 'data'); v.setUint32(40, n, true);
  for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}

function medienFreischalten(anlass) {
  if (mediaFreigegeben || mediaFreigabeLaeuft || interjectionActive || document.hidden) return;
  mediaFreigabeLaeuft = true;
  try {
    const url = stummerTonUrl();
    const a = new Audio(url);
    a.play().then(() => {
      mediaFreigegeben = true;
      logEvent('audio_freigabe', 'ok', { anlass: anlass });
      setTimeout(() => { try { a.pause(); URL.revokeObjectURL(url); } catch (e) {} }, 700);
    }).catch(e => {
      logEvent('audio_freigabe', 'abgelehnt', { anlass: anlass, grund: e && e.name });
    }).finally(() => { mediaFreigabeLaeuft = false; });
  } catch (e) { mediaFreigabeLaeuft = false; }
}

// Tipps sind "Nutzeraktionen" - dann laesst Chrome das Abspielen sicher zu.
// Bewusst in der Bubble-Phase: der Knopf-Handler (z.B. "Aktuelles an") ist
// dann schon gelaufen, interjectionFeatureOn() also bereits wahr.
document.addEventListener('click', () => {
  if (interjectionFeatureOn()) medienFreischalten('tipp');
});

function naechsterBeitrag() {
  if (pendingNews) return pendingNews;
  if (updateQueue.length) return updateQueue[0];
  return aktuellesOn ? aktuellesNextItem : null;
}

function vorladenNaechsterBeitrag() {
  if (interjectionActive || document.hidden) return;
  const item = naechsterBeitrag();
  if (!item || !item.url || newsAudio.dataset.item === item.url) return;
  newsAudio.preload = 'auto';
  newsAudio.src = item.url;
  newsAudio.dataset.item = item.url;
  try { newsAudio.load(); } catch (e) {}
}

function beitragBereit(item) {
  // HAVE_FUTURE_DATA: genug gepuffert, um sofort loszuspielen
  return !!item && newsAudio.dataset.item === item.url && newsAudio.readyState >= 3;
}

function maybeTriggerInterjection() {
  if (interjectionActive || busy) return;
  if (!st || !st.ok || !st.sessionActive) return;
  // Laeuft nachweislich fremde Musik (eigene Playlist), keine Beitraege
  // dazwischenschieben - die DJ-Session ist dann nur noch nicht abgelaufen.
  if (st.current && st.current.vonUns === false) return;

  if (document.hidden) {
    const kandidat = naechsterBeitrag();
    if (kandidat && !beitragBereit(kandidat)) {
      const uri = st.current ? st.current.uri : null;
      if (verschobenFuerUri !== uri) {
        verschobenFuerUri = uri;
        logEvent('beitrag_verschoben', 'App im Hintergrund, Beitrag nicht bereit', {
          vorgeladen: newsAudio.dataset.item === kandidat.url,
          readyState: newsAudio.readyState, freigegeben: mediaFreigegeben
        });
      }
      return;
    }
  }

  if (pendingNews) {
    const item = pendingNews;
    pendingNews = null;
    btnNews.classList.remove('active');
    startInterjection(item, 'news');
    return;
  }
  if (updateQueue.length && songsSinceInterjection >= 1) {
    const item = updateQueue.shift();
    songsSinceInterjection = 0;
    renderUpdateButton();
    startInterjection(item, 'update');
    return;
  }
  if (aktuellesOn && songsSinceInterjection >= interjectionThreshold && aktuellesNextItem) {
    const item = aktuellesNextItem;
    aktuellesNextItem = null;
    rollInterjectionThreshold();
    startInterjection(item, 'aktuelles');
    prefetchNextAktuelles(); // fuer die naechste Runde gleich schon mal bereitlegen
  }
}

function renderUpdateButton() {
  const n = updateQueue.length;
  btnUpdate.classList.toggle('active', n > 0);
  btnUpdate.textContent = n > 0 ? '🗞 Update ' + n : '🗞 Update';
}

function cancelInterjection(reason) {
  interjectionCancelReason = reason || 'user_skip';
  if (interjectionResolve) interjectionResolve();
}

async function startInterjection(item, kind) {
  const beginn = Date.now();
  interjectionActive = { item: item, kind: kind, paused: false };
  let watchdog = null;
  logEvent('beitrag_start', (item.show || '') + ' – ' + (item.title || ''), {
    art: kind, quelle: item.source, laengeMs: item.durationMs
  });
  render();

  // playerPause/-Resume ruehren bewusst NICHT an Session/Pause-Zustand
  // (siehe News.js) - eine Nachrichten-Unterbrechung soll nicht wie ein
  // Nutzer-Pause aussehen oder den Nachschub-Trigger stoppen.
  resumeSeekMs = null;
  resumeSkipNext = false;

  // Welcher Song lief, als wir ausgeloest haben? Daran erkennen wir nach dem
  // Pausieren, auf welcher Seite der Songgrenze wir gelandet sind.
  const zielUri = (st && st.current) ? st.current.uri : null;
  const zielDauer = (st && st.current) ? st.current.durationMs : null;

  try {
    const pauseRes = await playerPauseForInterjection();
    if (pauseRes && pauseRes.ok && typeof pauseRes.progressMs === 'number') {
      let versatzMs = null;
      if (zielUri && pauseRes.uri === zielUri) {
        // Noch auf demselben Song - zwei sehr verschiedene Faelle:
        const restMs = zielDauer ? (zielDauer - pauseRes.progressMs) : null;
        if (restMs !== null && restMs <= 5000) {
          // Kurz VOR dem Songende: nur noch ein Ausklang-Fetzen. Nach der
          // Einspielung ueberspringen, damit der naechste Song sauber beginnt.
          resumeSkipNext = true;
        } else {
          // Mitten im Song gelandet - passiert, wenn die Einspielung ueber das
          // reaktive Netz kurz NACH einem Songwechsel ausgeloest wurde.
          // Frueher wurde auch hier uebersprungen und damit ein gerade erst
          // begonnener Song komplett weggeworfen (beobachtet am 21.08. um
          // 09:22: "Memories" lief 8 s, dann Beitrag, dann war der Song weg).
          // Stattdessen zurueck auf Anfang.
          resumeSeekMs = 0;
        }
        if (zielDauer) versatzMs = -(zielDauer - pauseRes.progressMs);
      } else if (pauseRes.progressMs < 20000) {
        // Schon auf dem naechsten Song: wir waren zu SPAET. Beim Fortsetzen
        // auf 0 zuruecksetzen, damit er trotzdem komplett laeuft.
        resumeSeekMs = 0;
        versatzMs = pauseRes.progressMs;
      }
      // Zur Auswertung: wie genau haben wir die Songgrenze getroffen?
      // Negativ = zu frueh (Ausklang angeschnitten), positiv = zu spaet
      // (naechster Song hat angespielt).
      if (versatzMs !== null) {
        logEvent('grenze', (versatzMs < 0 ? 'zu frueh' : 'zu spaet'), {
          versatzMs: Math.round(versatzMs),
          korrekturWar: progressKorrekturMs,
          vorlaufWar: pauseLeadMs(),
          direkt: spActive(),
          hintergrund: document.hidden,
          behandlung: resumeSkipNext ? 'ueberspringen' : 'auf 0 zurueck',
        gleicherSong: !!(zielUri && pauseRes.uri === zielUri)
        }, Math.abs(Math.round(versatzMs)));
      }
    }
  } catch (e) { /* egal, weiter mit der Einspielung */ }

  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: item.title,
        artist: kind === 'update' ? (item.show || 'Podcast')
                                  : ('Deutschlandfunk' + (item.show ? ' · ' + item.show : '')),
        album: '1LIVE DJ'
      });
    } catch (e) { /* nicht kritisch */ }
  }

  const warVorgeladen = newsAudio.dataset.item === item.url;
  logEvent('beitrag_audio', warVorgeladen ? 'vorgeladen' : 'frisch', {
    readyState: warVorgeladen ? newsAudio.readyState : 0, freigegeben: mediaFreigegeben, hintergrund: document.hidden
  });
  if (!warVorgeladen) {
    newsAudio.src = item.url;
    newsAudio.dataset.item = item.url;
  }
  progressWrap.classList.remove('hidden');
  progressFill.style.width = '0%';
  tElapsed.textContent = '0:00';
  tTotal.textContent = fmt(item.durationMs || 0);
  newsAudio.ontimeupdate = () => {
    const d = newsAudio.duration || (item.durationMs ? item.durationMs / 1000 : 0);
    if (!d) return;
    progressFill.style.width = (100 * newsAudio.currentTime / d).toFixed(1) + '%';
    tElapsed.textContent = fmt(newsAudio.currentTime * 1000);
    tTotal.textContent = fmt(d * 1000);
  };

  let angelaufen = false;
  let startWaechter = null;
  await new Promise(resolve => {
    interjectionResolve = resolve;
    const done = () => resolve();
    newsAudio.onended = done;
    newsAudio.onerror = done;
    newsAudio.onplaying = () => { angelaufen = true; };
    newsAudio.play().catch(e => {
      if (!interjectionCancelReason) interjectionCancelReason = 'play_abgelehnt:' + ((e && e.name) || 'fehler');
      done();
    });

    // Laeuft der Beitrag gar nicht erst an (Android haelt Medien in einer
    // Hintergrund-App gern zurueck, oder die Audiodatei laedt nicht), stand
    // bisher bis zu 40 s Stille im Raum. Jetzt nach kurzer Frist aufgeben und
    // die Musik weiterlaufen lassen.
    startWaechter = setTimeout(() => {
      if (!angelaufen && !(interjectionActive && interjectionActive.paused)) {
        interjectionCancelReason = 'start_blockiert';
        done();
      }
    }, document.hidden ? 10000 : 25000);

    // Wachhund statt starrem Timeout: ein fester Timer wuerde eine laengere
    // Nutzer-Pause faelschlich als Abbruch werten. Hier zaehlt nur, ob die
    // Wiedergabe haengt, WAEHREND sie eigentlich laufen sollte.
    let lastPos = -1, stalledFor = 0;
    watchdog = setInterval(() => {
      if (interjectionActive && interjectionActive.paused) { stalledFor = 0; return; }
      if (newsAudio.currentTime !== lastPos) { lastPos = newsAudio.currentTime; stalledFor = 0; return; }
      stalledFor += 5;
      if (stalledFor >= 40) done(); // 40 s ohne Fortschritt trotz "spielt" -> aufgeben
    }, 5000);
  });
  clearInterval(watchdog);
  clearTimeout(startWaechter);
  newsAudio.onplaying = null;

  const cancelReason = interjectionCancelReason;
  interjectionCancelReason = null;
  interjectionResolve = null;

  const gehoert = newsAudio.currentTime || 0;
  newsAudio.onended = null; newsAudio.onerror = null; newsAudio.ontimeupdate = null;
  newsAudio.pause();
  newsAudio.removeAttribute('src');
  delete newsAudio.dataset.item;
  newsAudio.load();
  progressWrap.classList.add('hidden');
  interjectionActive = null;
  seekRow.classList.add('hidden');
  feedbackRow.classList.remove('hidden');

  logEvent('beitrag_ende', (item.show || '') + ' – ' + (item.title || ''), {
    art: kind,
    grund: cancelReason || 'zuende',
    gehoertSek: Math.round(gehoert),
    vonSek: Math.round((item.durationMs || 0) / 1000),
    zurueckAufAnfang: resumeSeekMs === 0
  }, Date.now() - beginn);

  if (cancelReason !== 'end_session') {
    const params = {};
    if (resumeSkipNext) params.skipNext = '1';
    if (resumeSeekMs !== null) params.seekMs = resumeSeekMs;
    try { await playerResumeAfterInterjection(params); }
    catch (e) { /* naechster Poll zeigt den echten Stand */ }
  }
  resumeSeekMs = null;
  resumeSkipNext = false;
  refresh();
}

btnNews.addEventListener('click', () => {
  logEvent('knopf', 'news', { warVorgemerkt: !!pendingNews, laeuft: !!(st && st.isPlaying) });
  if (pendingNews) {
    // erneutes Tippen nimmt die Anfrage wieder zurueck
    pendingNews = null;
    btnNews.classList.remove('active');
    return;
  }
  btnNews.classList.add('active');
  api('latestNews').then(r => {
    if (r.ok && r.item) {
      pendingNews = r.item;
      // Nur sofort loslegen, wenn gerade wirklich nichts spielt. Laeuft ein
      // Song, wird er ausgespielt - das Ausloesen uebernimmt dann die
      // Songende-Erkennung in tick(). Vorher brach der Knopf den laufenden
      // Song mitten drin ab.
      if (!(st && st.ok && st.isPlaying)) maybeTriggerInterjection();
      render();
    } else {
      btnNews.classList.remove('active');
    }
  }).catch(() => btnNews.classList.remove('active'));
});

btnAktuelles.addEventListener('click', () => {
  logEvent('knopf', 'aktuelles', { neuerZustand: !aktuellesOn ? 'an' : 'aus' });
  aktuellesOn = !aktuellesOn;
  localStorage.setItem('aktuellesOn', aktuellesOn ? '1' : '0');
  btnAktuelles.classList.toggle('active', aktuellesOn);
  if (aktuellesOn) {
    rollInterjectionThreshold();
    if (!aktuellesNextItem) prefetchNextAktuelles();
  }
});

btnPower.addEventListener('click', () => {
  logEvent('knopf', 'power', { phase: interjectionActive ? 'einspielung' : (st && st.phase), wartet: isWaiting() });
  // Waehrend einer Einspielung steuert der Knopf den Podcast, nicht Spotify.
  if (interjectionActive) {
    if (newsAudio.paused) { newsAudio.play().catch(() => {}); interjectionActive.paused = false; }
    else                  { newsAudio.pause();                 interjectionActive.paused = true;  }
    render();
    return;
  }
  if (isWaiting()) { waitingUntil = 0; render(); scheduleNext(); return; }
  // Stand unklar: erst nachsehen, was Spotify wirklich macht. Blind zu starten
  // hat hier die laufende Musik ersetzt.
  if (!st || verbindungUnklar) { setBusy('Prüfe…'); refresh().then(() => { busy = null; render(); }); return; }
  const phase = st && st.ok ? st.phase : 'idle';
  if (phase === 'playing') {
    setBusy('Pausiere…');
    // Direkt: sofort. Ueber den Server: 2-30 s. Das PAUSED-Flag des Servers
    // braucht es dafuer nicht - der Nachschub legt ohnehin nur nach, wenn
    // Spotify wirklich spielt.
    const weg = spActive()
      ? spCmd('pause', '/me/player/pause', 'PUT').catch(err => { if (err.status !== 403) return api('pause'); })
      : api('pause');
    weg.then(() => { busy = null; refresh(); })
      .catch(e => { busy = null; st = { ok: false, message: String(e), phase: 'error' }; render(); });
  } else if (phase === 'paused') {
    setBusy('Setze fort…');
    const weg = spActive()
      ? spCmd('play', '/me/player/play', 'PUT').catch(err => { if (err.status !== 403) return api('resume'); })
      : api('resume');
    weg.then(() => {
      busy = null;
      refresh();
    }).catch(e => { busy = null; st = { ok: false, message: String(e), phase: 'error' }; render(); });
  } else {
    doStart();
  }
});

btnEnd.addEventListener('click', () => {
  logEvent('knopf', 'beenden', { phase: st && st.phase });
  // Notausgang: eine laufende Einspielung sofort abbrechen, OHNE sie danach
  // fortzusetzen - stopSession() pausiert ohnehin gleich alles. Auch den
  // Update-Modus beenden, sonst liefe er nach dem naechsten Start weiter.
  if (interjectionActive) cancelInterjection('end_session');
  updateQueue = [];
  waitingUntil = 0;
  pendingStationSwitch = false;
  pendingNews = null;
  btnNews.classList.remove('active');
  renderUpdateButton();
  setBusy('Beende…');
  // Musik direkt sofort anhalten; die Session beendet trotzdem der Server.
  if (spActive()) spCmd('pause', '/me/player/pause', 'PUT').catch(() => {});
  api('stopSession').then(() => {
    busy = null;
    srv = Object.assign({}, srv || {}, { sessionActive: false, current: null, queueAhead: 0 });
    refresh();
  }).catch(e => { busy = null; st = { ok: false, message: String(e), phase: 'error' }; render(); });
});

btnSkip.addEventListener('click', () => {
  logEvent('knopf', 'skip', { waehrendEinspielung: !!interjectionActive,
                              song: curSong ? (curSong.artist + ' – ' + curSong.title) : null });
  if (interjectionActive) { cancelInterjection('user_skip'); return; }
  btnSkip.disabled = true;
  if (spActive()) {
    // Direkt weiter; die Warteschlangen-Buchfuehrung des Servers gleicht sich
    // beim naechsten Server-Abruf selbst ab (syncQueueState_).
    spCmd('next', '/me/player/next', 'POST')
      .then(() => setTimeout(refresh, 700))
      .catch(() => api('skip').then(() => setTimeout(refresh, 700)));
    return;
  }
  api('skip').then(r => {
    if (r.ok && r.current) { renderCurrent(r.current); progressBase = 0; progressAt = Date.now(); }
    else if (!r.ok) { st = Object.assign({}, st, { message: r.message, phase: 'error' }); render(); }
    setTimeout(refresh, 2500);
  }).catch(() => setTimeout(refresh, 2500));
});

function flashSent(btn) {
  btn.classList.add('sent');
  setTimeout(() => btn.classList.remove('sent'), 400);
}

btnLike.addEventListener('click', () => {
  logEvent('knopf', 'like', curSong ? (curSong.artist + ' – ' + curSong.title) : null);
  if (!currentKey) return;
  flashSent(btnLike);
  api('like', { key: currentKey }).then(r => {
    if (r.ok && r.current) {
      favIcon.textContent = r.current.isFavorite ? '♥' : '♡';
      btnFavorite.classList.toggle('favorite-active', !!r.current.isFavorite);
    }
  });
});

btnDislike.addEventListener('click', () => {
  logEvent('knopf', 'dislike', curSong ? (curSong.artist + ' – ' + curSong.title) : null);
  if (!currentKey) return;
  flashSent(btnDislike);
  if (spActive()) {
    // Sofort weiter, bewertet wird im Hintergrund (noskip: sonst floege auch
    // der naechste Song gleich mit raus).
    const key = currentKey;
    spCmd('next', '/me/player/next', 'POST')
      .then(() => { api('dislike', { key: key, noskip: '1' }); setTimeout(refresh, 700); })
      .catch(() => api('dislike', { key: key }).then(() => setTimeout(refresh, 700)));
    return;
  }
  api('dislike', { key: currentKey }).then(r => {
    if (r.current) { renderCurrent(r.current); progressBase = 0; progressAt = Date.now(); }
    setTimeout(refresh, 2500);
  });
});

btnFavorite.addEventListener('click', () => {
  logEvent('knopf', 'favorit', curSong ? (curSong.artist + ' – ' + curSong.title) : null);
  btnFavorite.disabled = true;
  api('toggleFavorite').then(r => {
    btnFavorite.disabled = false;
    if (r.ok) {
      favIcon.textContent = r.isFavorite ? '♥' : '♡';
      btnFavorite.classList.toggle('favorite-active', r.isFavorite);
    }
  }).catch(() => { btnFavorite.disabled = false; });
});

function seekBy(seconds) {
  if (!interjectionActive) return;
  const dur = newsAudio.duration || (interjectionActive.item.durationMs || 0) / 1000;
  const target = newsAudio.currentTime + seconds;
  newsAudio.currentTime = Math.max(0, dur ? Math.min(dur - 0.5, target) : Math.max(0, target));
}
btnBack5.addEventListener('click', () => { logEvent('knopf', 'zurueck5', Math.round(newsAudio.currentTime)); seekBy(-5); });
btnFwd10.addEventListener('click', () => { logEvent('knopf', 'vor10', Math.round(newsAudio.currentTime)); seekBy(10); });

btnUpdate.addEventListener('click', () => {
  logEvent('knopf', 'update', { offeneFolgen: updateQueue.length });
  if (updateQueue.length) {
    // Erneutes Tippen bricht den Modus ab (eine gerade laufende Folge nicht).
    updateQueue = [];
    renderUpdateButton();
    return;
  }
  btnUpdate.textContent = '🗞 lädt…';
  btnUpdate.disabled = true;
  api('updateEpisodes').then(r => {
    btnUpdate.disabled = false;
    if (r.ok && r.episodes && r.episodes.length) {
      updateQueue = r.episodes;
      // Update hat Vorrang - Aktuelles waehrenddessen ausschalten, damit sich
      // die beiden Modi nicht gegenseitig die Luecken wegnehmen.
      if (aktuellesOn) {
        aktuellesOn = false;
        localStorage.setItem('aktuellesOn', '0');
        btnAktuelles.classList.remove('active');
      }
      songsSinceInterjection = 1; // die erste Folge kommt nach dem laufenden Lied
      renderUpdateButton();
      if (r.failed && r.failed.length) {
        setSoftError('Update: ' + r.failed.join(', ') + ' gerade nicht erreichbar', st ? st.phase : 'idle');
      }
    } else {
      renderUpdateButton();
      setSoftError('Update-Folgen konnten nicht geladen werden', 'error');
    }
  }).catch(() => { btnUpdate.disabled = false; renderUpdateButton(); });
});

statusLine.addEventListener('click', () => { detailsOpen = !detailsOpen; renderDetails(); });
btnReload.addEventListener('click', () => location.reload());

// Bei versteckter Seite gar nicht pollen; beim Zurueckkommen sofort einmal.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    logEvent('app_hintergrund', '', { wartet: isWaiting(), einspielung: !!interjectionActive });
    flushLog(true);
    clearInterval(tickTimer); tickTimer = null;
    scheduleNext(); // pollt nur weiter, wenn wir auf ein Geraet warten
  } else {
    logEvent('app_vordergrund', '', { anzeigeVeraltet: isStale() });
    if (!tickTimer) tickTimer = setInterval(tick, 500);
    // Sofort sichtbar machen, dass der angezeigte Stand von vorhin ist -
    // der Abruf braucht ein paar Sekunden, und genau in diesem Fenster stand
    // bisher der alte Song da, als liefe er gerade.
    render(); tick();
    refresh();
  }
});

// Wachhund: Guertel und Hosentraeger gegen eine abgerissene Abfrageschleife.
// Selbst wenn irgendein Pfad einmal kein scheduleNext() aufruft, kommt die
// App hier von allein zurueck, statt bis zum naechsten Tippen stehenzubleiben.
setInterval(() => {
  if (interjectionActive) return;
  if (document.hidden && !isWaiting()) return;
  if (Date.now() - lastPollAt > 60000) refresh();
}, 15000);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

btnAktuelles.classList.toggle('active', aktuellesOn);
if (aktuellesOn) { rollInterjectionThreshold(); prefetchNextAktuelles(); }
renderUpdateButton();

logEvent('app_start', navigator.userAgent.slice(0, 120), {
  fenster: window.innerWidth + 'x' + window.innerHeight,
  aktuellesAn: aktuellesOn,
  standalone: window.matchMedia && window.matchMedia('(display-mode: standalone)').matches
});

// Passt die Seite auf den Bildschirm? Am Entwicklungsrechner laesst sich das
// nur nachstellen, nicht messen: Statusleisten-Aussparung und eine
// vergroesserte Systemschrift gibt es dort nicht. Also einmal nach dem
// Aufbau die echten Werte protokollieren, statt weiter zu schaetzen.
setTimeout(() => {
  try {
    const cs = getComputedStyle(document.body);
    const inhalt = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
    // Was 100dvh auf diesem Geraet wirklich ergibt - Beleg fuer den
    // Mi-9T-Fehler (dvh groesser als das sichtbare Fenster).
    const probe = document.createElement('div');
    probe.style.cssText = 'position:absolute;visibility:hidden;height:100dvh;top:0';
    document.body.appendChild(probe);
    const dvh = Math.round(probe.getBoundingClientRect().height);
    probe.remove();
    logEvent('layout', (inhalt > window.innerHeight + 1) ? 'scrollt' : 'passt', {
      fenster: window.innerWidth + 'x' + window.innerHeight,
      inhalt: inhalt,
      ueberhang: inhalt - window.innerHeight,
      dvh: dvh,
      appH: getComputedStyle(document.documentElement).getPropertyValue('--app-h').trim(),
      sicherOben: cs.paddingTop,
      sicherUnten: cs.paddingBottom,
      schrift: Math.round(parseFloat(getComputedStyle(document.documentElement).fontSize) * 10) / 10,
      dpr: window.devicePixelRatio
    });
  } catch (e) { /* Diagnose darf nie stoeren */ }
}, 1500);

tickTimer = setInterval(tick, 500);
render();
// Kommt die Seite gerade von der Spotify-Anmeldung zurueck, erst die Tokens
// holen - dann laeuft schon der allererste Abruf direkt.
spHandleRedirect().catch(() => {}).then(() => {
  logEvent('spotify_direkt', spConnected() ? 'aktiv' : 'aus', { redirect: SP_REDIRECT });
  // Installierte Apps duerfen oft auch ohne Tipp Audio abspielen - dann ist
  // die Freigabe schon beim Oeffnen erledigt. Sonst klappt es beim ersten Tipp.
  if (interjectionFeatureOn()) medienFreischalten('app_start');
  render();
  refresh();
});
</script>
