<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>1LIVE DJ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="1LIVE DJ">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
  color: #fff; height: 100dvh; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top,0) env(safe-area-inset-right,0)
           env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
}
.topbar {
  flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; border-bottom: 2px solid #222;
}
.title { font-size: 20px; font-weight: 900; letter-spacing: 0.5px; }
.title .dj { color: #e8001c; }
.btn-icon {
  background: rgba(255,255,255,0.06); border: 1.5px solid #444; border-radius: 8px; color: #ccc;
  font-size: 16px; cursor: pointer; width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.btn-icon:active { color: #fff; border-color: #e8001c; background: rgba(232,0,28,0.18); }
.btn-icon:disabled { opacity: 0.35; cursor: default; }

.now-playing {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px; gap: 8px; text-align: center;
}
.np-status { font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #666; }
.np-status.live { color: #00e676; }
.np-title { font-size: clamp(28px, 9.5vw, 48px); font-weight: 900; line-height: 1.15; }
.np-artist { font-size: clamp(20px, 6.5vw, 30px); color: #999; font-weight: 700; }
.np-meta { font-size: 13px; color: #666; margin-top: 4px; }
.np-device { font-size: 13px; color: #555; margin-top: 6px; }

.feedback-row {
  flex-shrink: 0; display: flex; gap: 14px; padding: 0 20px 18px;
}
.btn-feedback {
  flex: 1; border: none; cursor: pointer; border-radius: 18px; font-family: inherit;
  font-weight: 800; padding: 22px 0; display: flex; flex-direction: column; align-items: center;
  gap: 6px; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation;
  transition: transform .1s, filter .1s;
}
.btn-feedback .ico { font-size: 30px; }
.btn-feedback .lbl { font-size: 14px; }
.btn-feedback:active { transform: scale(0.92); filter: brightness(1.3); }
.btn-feedback:disabled { opacity: 0.35; cursor: default; }
.btn-dislike { background: #1e0306; color: #ff8fa0; border: 2px solid #5a1018; }
.btn-like    { background: #0d1e0d; color: #8fffa0; border: 2px solid #204020; }
.btn-favorite { background: rgba(255,255,255,0.05); color: #999; border: 2px solid #444; }
.btn-favorite.favorite-active { background: #2a0810; color: #ff4d6d; border-color: #e8001c; }
.btn-feedback.sent { filter: brightness(1.6); }

.controls { flex-shrink: 0; padding: 0 20px 20px; display: flex; flex-direction: column; gap: 12px; }
.power-row { display: flex; gap: 10px; }
.btn-power {
  flex: 1; min-width: 0; border: none; cursor: pointer; border-radius: 16px; font-family: inherit;
  font-size: 18px; font-weight: 900; letter-spacing: 0.5px; padding: 18px 0;
  -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation;
  transition: transform .1s, filter .1s;
}
.btn-power:active { transform: scale(0.96); }
.btn-power.start  { background: #e8001c; color: #fff; box-shadow: 0 0 30px rgba(232,0,28,0.4); }
.btn-power.pause  { background: #222; color: #ccc; border: 2px solid #444; }
.btn-power.resume { background: #00e676; color: #000; box-shadow: 0 0 30px rgba(0,230,118,0.35); }
.btn-power:disabled { opacity: 0.5; box-shadow: none; cursor: default; }

.btn-end {
  flex-shrink: 0; width: 96px; border: 2px solid #444; background: #161616; color: #999;
  font-family: inherit; font-size: 14px; font-weight: 800; border-radius: 16px; cursor: pointer;
  -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation;
  transition: transform .1s;
}
.btn-end:active { transform: scale(0.96); color: #fff; border-color: #e8001c; }
.btn-end:disabled { opacity: 0.3; cursor: default; }

.btn-skip {
  border: 1.5px solid #444; cursor: pointer; border-radius: 14px; font-family: inherit;
  background: rgba(255,255,255,0.05); color: #fff; font-size: 15px; font-weight: 800;
  padding: 14px 0; -webkit-tap-highlight-color: transparent; user-select: none;
  touch-action: manipulation; transition: transform .1s, filter .1s;
}
.btn-skip:active { transform: scale(0.97); border-color: #666; }
.btn-skip:disabled { opacity: 0.35; cursor: default; }

.pill-label { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #555; margin-bottom: 4px; }
.device-row, .station-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.device-pill {
  flex-shrink: 0; padding: 8px 14px; border-radius: 20px; border: 1.5px solid #444;
  background: rgba(255,255,255,0.05); color: #999; font-size: 13px; font-weight: 700;
  cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent;
}
.device-pill.active { border-color: #e8001c; color: #fff; background: rgba(232,0,28,0.18); }

.bottom-status { flex-shrink: 0; padding: 0 16px 12px; font-size: 12px; color: #555; text-align: center; min-height: 16px; }
.bottom-status.err { color: #ff6b6b; }
</style>
</head>
<body>

<div class="topbar">
  <div class="title">1LIVE <span class="dj">DJ</span></div>
  <button class="btn-icon" id="btnReload" title="Neu laden">↺</button>
</div>

<div class="now-playing">
  <div class="np-status" id="npStatus">Verbinde…</div>
  <div class="np-title" id="npTitle">—</div>
  <div class="np-artist" id="npArtist"></div>
  <div class="np-meta" id="npMeta"></div>
  <div class="np-device" id="npDevice"></div>
</div>

<div class="feedback-row">
  <button class="btn-feedback btn-dislike" id="btnDislike" disabled>
    <span class="ico">👎</span><span class="lbl">nicht mehr</span>
  </button>
  <button class="btn-feedback btn-favorite" id="btnFavorite" disabled>
    <span class="ico" id="favIcon">♡</span><span class="lbl">Favorit</span>
  </button>
  <button class="btn-feedback btn-like" id="btnLike" disabled>
    <span class="ico">👍</span><span class="lbl">öfter</span>
  </button>
</div>

<div class="controls">
  <button class="btn-skip" id="btnSkip" disabled>⏭ Skip</button>
  <div>
    <div class="pill-label">Sender</div>
    <div class="station-row" id="stationRow"></div>
  </div>
  <div>
    <div class="pill-label">Gerät</div>
    <div class="device-row" id="deviceRow"></div>
  </div>
  <div class="power-row">
    <button class="btn-power start" id="btnPower">▶ Station starten</button>
    <button class="btn-end" id="btnEnd" disabled>Beenden</button>
  </div>
</div>

<div class="bottom-status" id="bottomStatus"></div>

<script>
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxBbH87136ak1xaEq16iz-x52AiasndeZUhFcrQYbIgNlx2NfWBA_NZlhw7SP7hx6hxrQ/exec';
const POLL_MS = 20000;
const DEVICE_POLL_EVERY = 3; // Geraeteliste nur bei jedem 3. Status-Poll auffrischen (~60s)

const npStatus   = document.getElementById('npStatus');
const npTitle    = document.getElementById('npTitle');
const npArtist   = document.getElementById('npArtist');
const npMeta     = document.getElementById('npMeta');
const npDevice   = document.getElementById('npDevice');
const btnLike    = document.getElementById('btnLike');
const btnDislike = document.getElementById('btnDislike');
const btnSkip    = document.getElementById('btnSkip');
const btnPower   = document.getElementById('btnPower');
const btnEnd     = document.getElementById('btnEnd');
const btnFavorite = document.getElementById('btnFavorite');
const favIcon    = document.getElementById('favIcon');
const deviceRow  = document.getElementById('deviceRow');
const stationRow = document.getElementById('stationRow');
const bottomStatus = document.getElementById('bottomStatus');
const btnReload  = document.getElementById('btnReload');

const STATION_LABELS = { '1live': '1LIVE', 'br1': 'Bayern 1', 'br3': 'Bayern 3' };

let currentKey = null;
let isRunning = false;
let isPaused = false;
let sessionActive = false;
let pollTimer = null;
let tickCount = 0;
let starting = false;
let startingTimeout = null;
let startingPollTimer = null;

function formatDuration(ms) {
  const totalSec = Math.round(ms / 1000);
  const min = Math.floor(totalSec / 60);
  const sec = totalSec % 60;
  return min + ':' + String(sec).padStart(2, '0');
}

function updatePowerButton(active, paused) {
  btnPower.classList.remove('start', 'pause', 'resume');
  if (!active) {
    btnPower.textContent = '▶ Station starten';
    btnPower.classList.add('start');
  } else if (paused) {
    btnPower.textContent = '▶ Fortsetzen';
    btnPower.classList.add('resume');
  } else {
    btnPower.textContent = '⏸ Pause';
    btnPower.classList.add('pause');
  }
}

function setBottomStatus(text, isErr) {
  bottomStatus.textContent = text || '';
  bottomStatus.classList.toggle('err', !!isErr);
}

function api(action, params) {
  // _t verhindert, dass Googles Edge-Cache identische GET-URLs (gleiche
  // action+params) mit einer alten Antwort beantwortet, statt den Call
  // wirklich serverseitig neu auszufuehren.
  const qs = new URLSearchParams(Object.assign({ action, _t: Date.now() }, params || {}));
  return fetch(WEBAPP_URL + '?' + qs.toString(), { cache: 'no-store' })
    .then(r => r.json());
}

function refreshStatus(alsoLoadDevices) {
  api('status').then(data => {
    if (!data.ok) { setBottomStatus('Fehler: ' + data.error, true); return; }

    isRunning = data.isPlaying;
    isPaused = data.isPaused;
    sessionActive = data.sessionActive;

    // "Starten" laeuft im Hintergrund (Backend antwortet sofort, die
    // eigentliche Auswahl+Wiedergabe braucht noch etwas) - solange das noch
    // nicht bestaetigt ist, bleibt der eigene Status-Text/Button-Zustand
    // stehen, statt zwischendurch faelschlich "Gestoppt" zu zeigen.
    if (starting && data.isPlaying) {
      starting = false;
      clearTimeout(startingTimeout);
      clearInterval(startingPollTimer);
    }

    renderCurrent(data.current);
    npDevice.textContent = data.device ? ('auf ' + data.device) : '';

    if (!starting) {
      setBottomStatus('');
      npStatus.textContent = data.isPlaying ? 'Läuft' : (data.isPaused ? 'Pausiert' : 'Gestoppt');
      npStatus.classList.toggle('live', data.isPlaying);

      updatePowerButton(data.sessionActive, data.isPaused);
      btnPower.disabled = false;
      btnEnd.disabled = !data.sessionActive;
    }

    btnSkip.disabled = !data.isPlaying;

    if (alsoLoadDevices !== false) loadDevices(data.targetDeviceId);
  }).catch(err => setBottomStatus('Verbindung fehlgeschlagen: ' + err, true));
}

// Getrennt von refreshStatus aufrufbar, damit Skip/Dislike den naechsten
// Song SOFORT aus der eigenen Server-Antwort anzeigen koennen, statt auf
// einen weiteren Status-Poll warten zu muessen (siehe advanceQueueState_
// im Backend).
function renderCurrent(current) {
  if (current) {
    npTitle.textContent = current.title;
    npArtist.textContent = current.artist;
    currentKey = current.key;

    const metaParts = [];
    if (current.station) metaParts.push(STATION_LABELS[current.station] || current.station);
    if (current.playCount) metaParts.push(current.playCount + '× gespielt');
    if (current.durationMs) metaParts.push(formatDuration(current.durationMs));
    npMeta.textContent = metaParts.join(' · ');

    btnFavorite.disabled = !current.uri;
    favIcon.textContent = current.isFavorite ? '♥' : '♡';
    btnFavorite.classList.toggle('favorite-active', !!current.isFavorite);
  } else {
    npTitle.textContent = '—';
    npArtist.textContent = '';
    npMeta.textContent = '';
    currentKey = null;
    btnFavorite.disabled = true;
    favIcon.textContent = '♡';
    btnFavorite.classList.remove('favorite-active');
  }
  btnLike.disabled = !currentKey;
  btnDislike.disabled = !currentKey;
}

function loadDevices(targetId) {
  api('devices').then(data => {
    if (!data.ok) return;
    deviceRow.innerHTML = '';
    data.devices.forEach(d => {
      const pill = document.createElement('button');
      pill.className = 'device-pill' + (d.id === (targetId || data.targetDeviceId) ? ' active' : '');
      pill.textContent = d.name;
      pill.addEventListener('click', () => {
        api('setDevice', { id: d.id }).then(() => loadDevices(d.id));
      });
      deviceRow.appendChild(pill);
    });
  });
}

// Sender sind unabhaengig ein-/ausschaltbar (nicht wie Geraete exklusiv) -
// bei mehreren aktiven werden die Playlists gemischt (siehe Backend).
// knownStations wird nur beim ersten Laden geholt (Label/ID aendern sich
// nicht); ein Klick zum Umschalten braucht danach nur noch einen einzigen
// Call (setStations liefert die neue aktive Liste direkt mit), statt einen
// zweiten stations-Call hinterherzuschicken - war spuerbar traege.
let knownStations = [];

function renderStationPills(activeIds) {
  stationRow.innerHTML = '';
  knownStations.forEach(s => {
    const pill = document.createElement('button');
    pill.className = 'device-pill' + (activeIds.indexOf(s.id) !== -1 ? ' active' : '');
    pill.textContent = s.label;
    pill.addEventListener('click', () => {
      const idx = activeIds.indexOf(s.id);
      const next = idx === -1 ? activeIds.concat(s.id) : activeIds.filter(id => id !== s.id);
      api('setStations', { stations: next.join(',') }).then(result => {
        if (result.ok) renderStationPills(result.stations);
      });
    });
    stationRow.appendChild(pill);
  });
}

function loadStations() {
  api('stations').then(data => {
    if (!data.ok) return;
    knownStations = data.stations.map(s => ({ id: s.id, label: s.label }));
    renderStationPills(data.stations.filter(s => s.active).map(s => s.id));
  });
}

function flashSent(btn) {
  btn.classList.add('sent');
  setTimeout(() => btn.classList.remove('sent'), 400);
}

btnLike.addEventListener('click', () => {
  if (!currentKey) return;
  flashSent(btnLike);
  api('like', { key: currentKey }).then(result => {
    if (result.ok && result.current) {
      favIcon.textContent = result.current.isFavorite ? '♥' : '♡';
      btnFavorite.classList.toggle('favorite-active', !!result.current.isFavorite);
    }
  });
});

btnFavorite.addEventListener('click', () => {
  btnFavorite.disabled = true;
  api('toggleFavorite').then(result => {
    btnFavorite.disabled = false;
    if (result.ok) {
      favIcon.textContent = result.isFavorite ? '♥' : '♡';
      btnFavorite.classList.toggle('favorite-active', result.isFavorite);
    } else {
      setBottomStatus('Fehler: ' + result.error, true);
    }
  });
});

btnDislike.addEventListener('click', () => {
  if (!currentKey) return;
  flashSent(btnDislike);
  // Dislike stoesst serverseitig auch gleich einen Skip an, Song stoppt sofort.
  // Der naechste Song kommt direkt in der Antwort mit (Backend kennt ihn ja
  // selbst, siehe advanceQueueState_) - keine Wartezeit noetig, nur zur
  // Sicherheit kurz danach den echten Spotify-Status nachgleichen.
  api('dislike', { key: currentKey }).then(result => {
    if (result.current) renderCurrent(result.current);
    setTimeout(refreshStatus, 3000);
  });
});

btnSkip.addEventListener('click', () => {
  btnSkip.disabled = true;
  api('skip').then(result => {
    if (result.current) renderCurrent(result.current);
    setTimeout(refreshStatus, 3000);
  });
});

btnPower.addEventListener('click', () => {
  if (sessionActive && isPaused) {
    // Fortsetzen ist schnell (nur ein Play-Aufruf, kein Playlist-Scrape).
    btnPower.disabled = true;
    setBottomStatus('Setze fort…');
    api('resume').then(() => { btnPower.disabled = false; refreshStatus(); })
      .catch(err => { btnPower.disabled = false; setBottomStatus('Fehler: ' + err, true); });
    return;
  }

  if (sessionActive) {
    // Pause ist schnell (nur ein Pause-Aufruf) und beendet die Session
    // NICHT - Fortsetzen bleibt dadurch danach ebenfalls schnell.
    btnPower.disabled = true;
    setBottomStatus('Pausiere…');
    api('pause').then(() => { btnPower.disabled = false; refreshStatus(); })
      .catch(err => { btnPower.disabled = false; setBottomStatus('Fehler: ' + err, true); });
    return;
  }

  // Starten (aus komplett gestopptem Zustand): Backend antwortet sofort,
  // die eigentliche Auswahl (Playlist scrapen, Spotify durchsuchen) laeuft
  // im Hintergrund und dauert bis zu einer Minute - Button bleibt bis dahin
  // sichtbar im "startet"-Zustand, statt so zu wirken, als waere der Tap
  // ignoriert worden.
  starting = true;
  btnPower.disabled = true;
  btnPower.textContent = '… wird gestartet';
  setBottomStatus('Starte… (kann bis zu 1 Minute dauern)');

  api('startSession').catch(err => {
    starting = false;
    btnPower.disabled = false;
    setBottomStatus('Fehler: ' + err, true);
  });

  // Waehrend des Startens zusaetzlich zum normalen Poll-Intervall (das bei
  // versteckter Seite/gesperrtem Bildschirm pausiert) alle 10s pruefen -
  // sonst kann die Anzeige haengen bleiben, wenn man z.B. kurz zu Spotify
  // wechselt um nachzuschauen und die Seite dabei in den Hintergrund geht.
  clearInterval(startingPollTimer);
  startingPollTimer = setInterval(() => {
    if (!starting) { clearInterval(startingPollTimer); return; }
    refreshStatus(false);
  }, 10000);

  clearTimeout(startingTimeout);
  startingTimeout = setTimeout(() => {
    if (starting) {
      starting = false;
      clearInterval(startingPollTimer);
      // Echten aktuellen Stand nachladen und normal anzeigen, statt pauschal
      // eine Fehlermeldung zu zeigen, die falsch waere, falls es zwischen-
      // zeitlich doch geklappt hat und nur kein Poll das mitbekommen hat.
      refreshStatus();
    }
  }, 90000);
});

btnEnd.addEventListener('click', () => {
  btnEnd.disabled = true;
  setBottomStatus('Beende…');
  api('stopSession').then(() => refreshStatus())
    .catch(err => setBottomStatus('Fehler: ' + err, true));
});

btnReload.addEventListener('click', () => location.reload());

function tick() {
  tickCount++;
  refreshStatus(tickCount % DEVICE_POLL_EVERY === 0);
}

function startPolling() {
  stopPolling();
  pollTimer = setInterval(tick, POLL_MS);
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

// Sobald die Seite/App nicht sichtbar ist (Bildschirm aus, andere App im
// Vordergrund, Tab gewechselt), komplett aufhoeren zu pollen statt uns auf
// Browser-Throttling zu verlassen - beim Zurueckkommen sofort einmal
// aktualisieren und weiterpollen.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopPolling();
  } else {
    tickCount = 0;
    refreshStatus(true);
    startPolling();
  }
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// Erster Load startet immer sofort (unabhaengig vom initialen
// visibilityState, der ist in manchen Umgebungen beim allerersten Laden
// nicht zuverlaessig "visible") - visibilitychange uebernimmt danach.
refreshStatus(true);
loadStations();
startPolling();
</script>

</body>
</html>
