<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover ist Pflicht, sonst liefert env(safe-area-inset-*)
     immer 0 und der untere Rand wird in der PWA abgeschnitten. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>1LIVE DJ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="1LIVE DJ">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { width: 100%; background: #000; overflow-x: hidden; }
/* min-height statt fixer height: normalerweise fuellt die App genau einen
   Bildschirm, aber wenn ausnahmsweise alles gleichzeitig sichtbar ist
   (Fortschritt + Fehlermeldung + offene Geraeteliste auf einem kleinen
   Display), darf die Seite scrollen. Vorher war das overflow:hidden - der
   Start-Knopf wurde dann einfach abgeschnitten. */
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
  color: #fff; width: 100%; min-height: 100dvh; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0);
  padding-right: env(safe-area-inset-right, 0);
  padding-left: env(safe-area-inset-left, 0);
  /* Untere Gestensteuerung/Notch: mindestens 8px, sonst klebt der
     Beenden-Knopf am Bildschirmrand. */
  padding-bottom: max(env(safe-area-inset-bottom, 0px), 8px);
}

.topbar {
  flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 2px solid #222;
}
.title { font-size: 19px; font-weight: 900; letter-spacing: 0.5px; }
.title .dj { color: #e8001c; }
.btn-icon {
  background: rgba(255,255,255,0.06); border: 1.5px solid #444; border-radius: 8px; color: #ccc;
  font-size: 16px; cursor: pointer; width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.btn-icon:active { color: #fff; border-color: #e8001c; background: rgba(232,0,28,0.18); }

/* min-height:0 ist der eigentliche Fix: ohne das weigert sich ein flex:1
   Element, unter seine Inhaltsgroesse zu schrumpfen - alles darunter wurde
   aus dem Viewport gedrueckt und von overflow:hidden abgeschnitten. */
.now-playing {
  flex: 1 1 0; min-height: 92px; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 16px 20px; gap: 6px; text-align: center;
}
.np-title  { font-size: clamp(22px, 8vw, 40px); font-weight: 900; line-height: 1.12; }
.np-artist { font-size: clamp(16px, 5.5vw, 26px); color: #999; font-weight: 700; line-height: 1.2; }
.np-meta   { font-size: 12px; color: #666; margin-top: 2px; }

.progress-wrap { flex: 0 0 auto; padding: 0 20px 8px; }
.progress-bar { height: 4px; border-radius: 2px; background: #222; overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: #e8001c; transition: width .25s linear; }
.progress-times {
  display: flex; justify-content: space-between; font-size: 11px; color: #555;
  font-variant-numeric: tabular-nums; margin-top: 4px;
}
.progress-wrap.hidden { visibility: hidden; }

.feedback-row { flex: 0 0 auto; display: flex; gap: 12px; padding: 0 16px 10px; }
.btn-feedback {
  flex: 1; border: none; cursor: pointer; border-radius: 16px; font-family: inherit;
  font-weight: 800; padding: 13px 0; display: flex; flex-direction: column; align-items: center;
  gap: 4px; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation;
  transition: transform .1s, filter .1s;
}
.btn-feedback .ico { font-size: 24px; line-height: 1; }
.btn-feedback .lbl { font-size: 13px; }
.btn-feedback:active { transform: scale(0.92); filter: brightness(1.3); }
.btn-feedback:disabled { opacity: 0.3; cursor: default; }
.btn-dislike  { background: #1e0306; color: #ff8fa0; border: 2px solid #5a1018; }
.btn-like     { background: #0d1e0d; color: #8fffa0; border: 2px solid #204020; }
.btn-favorite { background: rgba(255,255,255,0.05); color: #999; border: 2px solid #444; }
.btn-favorite.favorite-active { background: #2a0810; color: #ff4d6d; border-color: #e8001c; }
.btn-feedback.sent { filter: brightness(1.6); }

.controls { flex: 0 0 auto; padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
.btn-skip {
  border: 1.5px solid #444; cursor: pointer; border-radius: 13px; font-family: inherit;
  background: rgba(255,255,255,0.05); color: #fff; font-size: 15px; font-weight: 800;
  padding: 11px 0; -webkit-tap-highlight-color: transparent; user-select: none;
  touch-action: manipulation; transition: transform .1s;
}
.btn-skip:active { transform: scale(0.97); border-color: #666; }
.btn-skip:disabled { opacity: 0.3; cursor: default; }

/* Beschriftung neben der Zeile statt darueber - spart rund 30px Hoehe,
   die auf kurzen Displays am unteren Rand gefehlt haben. */
.ctl-line { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ctl-key {
  flex: 0 0 46px; font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; color: #555;
}
.ctl-val {
  flex: 1 1 auto; min-width: 0; font-size: 13px; font-weight: 700; color: #999;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ctl-line > button.link {
  flex: 0 0 auto; background: none; border: none; color: #777; font-family: inherit;
  font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
  cursor: pointer; -webkit-tap-highlight-color: transparent; padding: 4px 0;
}
.pill-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.pill {
  flex-shrink: 0; padding: 7px 13px; border-radius: 18px; border: 1.5px solid #444;
  background: rgba(255,255,255,0.05); color: #999; font-size: 13px; font-weight: 700;
  cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent;
  font-family: inherit;
}
.pill.active { border-color: #e8001c; color: #fff; background: rgba(232,0,28,0.18); }
.hidden { display: none !important; }

.power-row { display: flex; gap: 10px; }
.btn-power {
  flex: 1; min-width: 0; border: none; cursor: pointer; border-radius: 15px; font-family: inherit;
  font-size: 17px; font-weight: 900; letter-spacing: 0.3px; padding: 15px 4px;
  -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation;
  transition: transform .1s, filter .1s;
}
.btn-power:active { transform: scale(0.96); }
.btn-power .sub { display: block; font-size: 11px; font-weight: 700; opacity: 0.8; margin-top: 2px; }
.btn-power.start  { background: #e8001c; color: #fff; box-shadow: 0 0 26px rgba(232,0,28,0.35); }
.btn-power.pause  { background: #222; color: #ccc; border: 2px solid #444; }
.btn-power.resume { background: #00e676; color: #000; box-shadow: 0 0 26px rgba(0,230,118,0.3); }
.btn-power.busy   { background: #333; color: #aaa; box-shadow: none; }
.btn-power:disabled { opacity: 0.6; box-shadow: none; cursor: default; }
.btn-end {
  flex: 0 0 92px; border: 2px solid #444; background: #161616; color: #999;
  font-family: inherit; font-size: 14px; font-weight: 800; border-radius: 15px; cursor: pointer;
  -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation;
}
.btn-end:active { transform: scale(0.96); color: #fff; border-color: #e8001c; }
.btn-end:disabled { opacity: 0.3; cursor: default; }

/* Wird nur eingeblendet, wenn wirklich etwas im Argen liegt. */
.alert {
  flex: 0 0 auto; margin: 0 16px 8px; padding: 10px 12px; border-radius: 12px;
  background: #2a0810; border: 1.5px solid #7a1020; font-size: 13px; line-height: 1.35; color: #ffc2cc;
}
.alert .act { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.alert a, .alert button {
  font-family: inherit; font-size: 12.5px; font-weight: 800; padding: 8px 11px; border-radius: 9px;
  border: 1.5px solid #e8001c; background: rgba(232,0,28,0.2); color: #fff;
  text-decoration: none; cursor: pointer; -webkit-tap-highlight-color: transparent;
}

.statusline {
  flex: 0 0 auto; padding: 8px 16px 2px; font-size: 12px; color: #777; text-align: center;
  cursor: pointer; -webkit-tap-highlight-color: transparent; min-height: 26px;
}
.statusline .dot {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #444;
  margin-right: 6px; vertical-align: 1px;
}
.statusline.playing .dot { background: #00e676; }
.statusline.paused  .dot { background: #ffb300; }
.statusline.trouble .dot { background: #ff3b30; }
.statusline.busy    .dot { background: #29b6f6; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0.25; } }
.statusline.trouble { color: #ff8fa0; }

.details {
  flex: 0 0 auto; margin: 6px 16px 0; padding: 10px 12px; border-radius: 10px;
  background: rgba(255,255,255,0.04); border: 1px solid #222;
  font-size: 11.5px; color: #888; line-height: 1.6; text-align: left;
  max-height: 30vh; overflow-y: auto;
}
.details b { color: #bbb; font-weight: 700; }
</style>
</head>
<body>

<div class="topbar">
  <div class="title">1LIVE <span class="dj">DJ</span></div>
  <button class="btn-icon" id="btnReload" title="Neu laden">↺</button>
</div>

<div class="now-playing">
  <div class="np-title" id="npTitle">—</div>
  <div class="np-artist" id="npArtist"></div>
  <div class="np-meta" id="npMeta"></div>
</div>

<div class="progress-wrap hidden" id="progressWrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-times"><span id="tElapsed">0:00</span><span id="tTotal">0:00</span></div>
</div>

<div class="alert hidden" id="alertBox"></div>

<div class="feedback-row">
  <button class="btn-feedback btn-dislike" id="btnDislike" disabled>
    <span class="ico">👎</span><span class="lbl">nicht mehr</span>
  </button>
  <button class="btn-feedback btn-favorite" id="btnFavorite" disabled>
    <span class="ico" id="favIcon">♡</span><span class="lbl">Favorit</span>
  </button>
  <button class="btn-feedback btn-like" id="btnLike" disabled>
    <span class="ico">👍</span><span class="lbl">öfter</span>
  </button>
</div>

<div class="controls">
  <button class="btn-skip" id="btnSkip" disabled>⏭ Skip</button>

  <div class="ctl-line">
    <span class="ctl-key">Sender</span>
    <div class="pill-row" id="stationRow"></div>
  </div>

  <div class="ctl-line">
    <span class="ctl-key">Gerät</span>
    <div class="ctl-val" id="deviceCurrent">–</div>
    <button class="link" id="btnToggleDevices">ändern ▾</button>
  </div>
  <div class="pill-row hidden" id="deviceRow"></div>

  <div class="power-row">
    <button class="btn-power start" id="btnPower">▶ Start</button>
    <button class="btn-end" id="btnEnd" disabled>Beenden</button>
  </div>
</div>

<div class="statusline" id="statusLine"><span class="dot"></span>Verbinde…</div>
<div class="details hidden" id="detailsBox"></div>

<script>
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxBbH87136ak1xaEq16iz-x52AiasndeZUhFcrQYbIgNlx2NfWBA_NZlhw7SP7hx6hxrQ/exec';

const IDLE_POLL_MS  = 20000;  // nichts laeuft: gemaechlich nachsehen
const ERROR_POLL_MS = 12000;  // Problemzustand: etwas haeufiger
const MIN_POLL_MS   = 6000;
const MAX_POLL_MS   = 30000;

const $ = id => document.getElementById(id);
const npTitle = $('npTitle'), npArtist = $('npArtist'), npMeta = $('npMeta');
const btnLike = $('btnLike'), btnDislike = $('btnDislike'), btnFavorite = $('btnFavorite'), favIcon = $('favIcon');
const btnSkip = $('btnSkip'), btnPower = $('btnPower'), btnEnd = $('btnEnd'), btnReload = $('btnReload');
const stationRow = $('stationRow'), deviceRow = $('deviceRow'), deviceCurrent = $('deviceCurrent');
const btnToggleDevices = $('btnToggleDevices');
const statusLine = $('statusLine'), detailsBox = $('detailsBox'), alertBox = $('alertBox');
const progressWrap = $('progressWrap'), progressFill = $('progressFill');
const tElapsed = $('tElapsed'), tTotal = $('tTotal');

const STATION_LABELS = { '1live': '1LIVE', 'br1': 'Bayern 1', 'br3': 'Bayern 3' };

let st = null;              // letzte Server-Antwort
let currentKey = null;
let pollTimer = null;
let tickTimer = null;
let busy = null;            // Text, solange eine Aktion laeuft
let devicesOpen = false;
let detailsOpen = false;
let knownDevices = [];
let progressBase = 0;       // progress_ms zum Zeitpunkt der Antwort
let progressAt = 0;         // lokale Uhrzeit der Antwort
let autoStartUntil = 0;     // nach "Spotify öffnen": bei Rueckkehr selbst starten

function fmt(ms) {
  if (!ms && ms !== 0) return '0:00';
  const s = Math.max(0, Math.round(ms / 1000));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function api(action, params) {
  const qs = new URLSearchParams(Object.assign({ action: action, _t: Date.now() }, params || {}));
  return fetch(WEBAPP_URL + '?' + qs.toString(), { cache: 'no-store' }).then(r => r.json());
}

// ── Anzeige ──────────────────────────────────────────────────
function setBusy(text) {
  busy = text;
  render();
}

function renderCurrent(cur) {
  if (cur) {
    npTitle.textContent = cur.title || '—';
    npArtist.textContent = cur.artist || '';
    currentKey = cur.key || null;

    const parts = [];
    if (cur.station) parts.push(STATION_LABELS[cur.station] || cur.station);
    if (cur.playCount) parts.push(cur.playCount + '× gespielt');
    npMeta.textContent = parts.join(' · ');

    btnFavorite.disabled = !cur.uri;
    favIcon.textContent = cur.isFavorite ? '♥' : '♡';
    btnFavorite.classList.toggle('favorite-active', !!cur.isFavorite);
  } else {
    npTitle.textContent = '—';
    npArtist.textContent = '';
    npMeta.textContent = '';
    currentKey = null;
    btnFavorite.disabled = true;
    favIcon.textContent = '♡';
    btnFavorite.classList.remove('favorite-active');
  }
  btnLike.disabled = !currentKey;
  btnDislike.disabled = !currentKey;
}

function renderStations(list) {
  if (!list) return;
  stationRow.innerHTML = '';
  const activeIds = list.filter(s => s.active).map(s => s.id);
  list.forEach(s => {
    const b = document.createElement('button');
    b.className = 'pill' + (s.active ? ' active' : '');
    b.textContent = s.label;
    b.addEventListener('click', () => {
      const next = s.active ? activeIds.filter(id => id !== s.id) : activeIds.concat(s.id);
      api('setStations', { stations: next.join(',') }).then(r => { if (r.ok) renderStations(r.stations); });
    });
    stationRow.appendChild(b);
  });
}

function renderDevices() {
  deviceRow.classList.toggle('hidden', !devicesOpen);
  btnToggleDevices.textContent = devicesOpen ? 'schließen ▴' : 'ändern ▾';
  if (!devicesOpen) return;

  deviceRow.innerHTML = '';
  if (!knownDevices.length) {
    const s = document.createElement('div');
    s.style.cssText = 'font-size:12px;color:#666;padding:4px 0;';
    s.textContent = 'Kein Spotify-Gerät erreichbar.';
    deviceRow.appendChild(s);
    return;
  }
  knownDevices.forEach(d => {
    const b = document.createElement('button');
    b.className = 'pill' + (st && d.id === st.targetDeviceId ? ' active' : '');
    b.textContent = d.name;
    b.addEventListener('click', () => {
      api('setDevice', { id: d.id, name: d.name }).then(() => refresh());
    });
    deviceRow.appendChild(b);
  });
}

function renderAlert() {
  if (busy || !st) { alertBox.classList.add('hidden'); return; }

  const trouble = ['device_gone', 'error'].indexOf(st.phase) !== -1;
  const err = st.lastError;
  if (!trouble && !(err && st.phase !== 'playing')) { alertBox.classList.add('hidden'); return; }

  let html = '<div>' + escapeHtml(trouble ? st.message : err.message) + '</div>';
  html += '<div class="act">';
  html += '<a id="lnkSpotify" href="spotify://">Spotify öffnen</a>';
  if (knownDevices.length) html += '<button id="btnPickDevice">Anderes Gerät</button>';
  html += '<button id="btnDismiss">Ausblenden</button>';
  html += '</div>';
  alertBox.innerHTML = html;
  alertBox.classList.remove('hidden');

  const lnk = $('lnkSpotify');
  if (lnk) lnk.addEventListener('click', () => { autoStartUntil = Date.now() + 120000; });
  const pick = $('btnPickDevice');
  if (pick) pick.addEventListener('click', () => { devicesOpen = true; renderDevices(); });
  $('btnDismiss').addEventListener('click', () => { alertBox.classList.add('hidden'); });
}

function renderDetails() {
  detailsBox.classList.toggle('hidden', !detailsOpen);
  if (!detailsOpen || !st) return;

  let h = '';
  if (st.pool && st.pool.stations) {
    h += '<b>Vorrat</b><br>';
    Object.keys(st.pool.stations).forEach(s => {
      const p = st.pool.stations[s];
      h += (STATION_LABELS[s] || s) + ': ' + p.fresh + ' neu, ' + p.known + ' bekannt<br>';
    });
    h += 'Stand: ' + new Date(st.pool.at).toLocaleTimeString('de-DE') + '<br><br>';
  }
  if (st.lastRefill) {
    h += '<b>Letzter Nachschub</b><br>' + new Date(st.lastRefill.at).toLocaleTimeString('de-DE') +
         ' · ' + (st.lastRefill.found || 0) + ' von ' + (st.lastRefill.resolved || 0) +
         ' gefunden, ' + (st.lastRefill.added || 0) + ' neu<br><br>';
  }
  h += '<b>Wiedergabe</b><br>Gerät: ' + escapeHtml(st.device || st.targetDeviceName || '–') +
       '<br>Warteschlange: ' + (st.queueAhead || 0) +
       '<br>Session: ' + (st.sessionActive ? 'aktiv' : 'aus') + '<br>';
  if (st.lastError) {
    h += '<br><b style="color:#ff8fa0">Letzter Fehler</b><br>' +
         new Date(st.lastError.at).toLocaleTimeString('de-DE') + ' [' +
         escapeHtml(st.lastError.where) + ']<br>' + escapeHtml(st.lastError.message);
  }
  detailsBox.innerHTML = h;
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function render() {
  // Statuszeile ist immer eindeutig - nie leer, nie mehrdeutig.
  let cls = '', text;
  if (busy) {
    cls = 'busy'; text = busy;
  } else if (!st) {
    text = 'Verbinde…';
  } else if (!st.ok) {
    cls = 'trouble'; text = st.message || 'Fehler';
  } else {
    text = st.message;
    if (st.phase === 'playing') cls = 'playing';
    else if (st.phase === 'paused') cls = 'paused';
    else if (st.phase === 'device_gone' || st.phase === 'error') cls = 'trouble';
  }
  statusLine.className = 'statusline ' + cls;
  statusLine.innerHTML = '<span class="dot"></span>' + escapeHtml(text);

  const phase = busy ? 'busy' : (st && st.ok ? st.phase : 'idle');

  // Power-Knopf haengt an der Phase, NICHT an sessionActive. Frueher zeigte
  // er nach einem gescheiterten Start "Pause" an - man kam ohne "Beenden"
  // nicht mal zu einem zweiten Versuch.
  btnPower.classList.remove('start', 'pause', 'resume', 'busy');
  if (busy) {
    btnPower.innerHTML = escapeHtml(busy);
    btnPower.classList.add('busy');
    btnPower.disabled = true;
  } else if (phase === 'playing') {
    btnPower.textContent = '⏸ Pause';
    btnPower.classList.add('pause');
    btnPower.disabled = false;
  } else if (phase === 'paused') {
    btnPower.textContent = '▶ Fortsetzen';
    btnPower.classList.add('resume');
    btnPower.disabled = false;
  } else {
    // Wenn der Vorrat leer ist, dauert der Start ausnahmsweise laenger -
    // das steht dann vorher am Knopf, statt hinterher zu ueberraschen.
    const empty = st && st.ok && st.pool && !st.poolFresh && !st.poolKnown;
    btnPower.innerHTML = '▶ Start' + (empty ? '<span class="sub">Liste leer – dauert ~20 s</span>' : '');
    btnPower.classList.add('start');
    btnPower.disabled = false;
  }

  btnEnd.disabled = busy || !(st && st.sessionActive);
  btnSkip.disabled = busy || !(st && st.isPlaying);

  if (st) {
    deviceCurrent.textContent = st.device || st.targetDeviceName || '–';
    deviceCurrent.style.color = (st.targetOnline === false) ? '#ff8fa0' : '#999';
  }

  renderAlert();
  renderDetails();
}

// ── Fortschritt lokal weiterzaehlen ──────────────────────────
function tick() {
  if (!st || !st.isPlaying || !st.current || !st.current.durationMs || progressBase === null) {
    progressWrap.classList.add('hidden');
    return;
  }
  const dur = st.current.durationMs;
  const pos = Math.min(dur, progressBase + (Date.now() - progressAt));
  progressWrap.classList.remove('hidden');
  progressFill.style.width = (100 * pos / dur).toFixed(1) + '%';
  tElapsed.textContent = fmt(pos);
  tTotal.textContent = fmt(dur);
}

// ── Polling: gezielt zum Songende statt stur alle 20 s ───────
function scheduleNext() {
  clearTimeout(pollTimer);
  let delay = IDLE_POLL_MS;

  if (st && st.ok) {
    if (st.phase === 'playing' && st.current && st.current.durationMs && progressBase !== null) {
      const left = st.current.durationMs - (progressBase + (Date.now() - progressAt));
      delay = Math.min(MAX_POLL_MS, Math.max(MIN_POLL_MS, left + 1500));
    } else if (st.phase === 'device_gone' || st.phase === 'error' || st.phase === 'stalled') {
      delay = ERROR_POLL_MS;
    }
  }
  pollTimer = setTimeout(refresh, delay);
}

function refresh() {
  return api('status').then(data => {
    st = data;
    if (data.ok) {
      progressBase = (typeof data.progressMs === 'number') ? data.progressMs : null;
      progressAt = Date.now();
      renderCurrent(data.current);
      renderStations(data.stations);
      if (data.devices) { knownDevices = data.devices; renderDevices(); }

      // Nach "Spotify öffnen": sobald das Gerät wieder da ist, selbst starten.
      if (autoStartUntil > Date.now() && data.targetOnline && data.phase !== 'playing') {
        autoStartUntil = 0;
        doStart();
        return;
      }
    }
    render();
    tick();
    scheduleNext();
  }).catch(err => {
    st = { ok: false, message: 'Keine Verbindung: ' + err.message, phase: 'error' };
    render();
    scheduleNext();
  });
}

// ── Aktionen ─────────────────────────────────────────────────
function doStart() {
  setBusy('Starte…');
  api('startSession').then(r => {
    if (r.ok) {
      if (r.devices) knownDevices = r.devices;
      busy = null;
      st = Object.assign({}, st || {}, {
        ok: true, phase: 'playing', message: r.message, isPlaying: true, isPaused: false,
        sessionActive: true, current: r.current, queueAhead: r.queueAhead,
        device: r.device, targetOnline: true, lastError: null
      });
      progressBase = 0; progressAt = Date.now();
      renderCurrent(r.current);
      render();
      tick();
      refresh();
    } else {
      busy = null;
      if (r.devices) { knownDevices = r.devices; renderDevices(); }
      st = Object.assign({}, st || {}, {
        ok: true, phase: r.code === 'DEVICE_GONE' || r.code === 'NO_DEVICE' ? 'device_gone' : 'error',
        message: r.message || 'Start fehlgeschlagen'
      });
      render();
      scheduleNext();
    }
  }).catch(err => {
    busy = null;
    st = { ok: false, message: 'Start fehlgeschlagen: ' + err.message, phase: 'error' };
    render();
    scheduleNext();
  });
}

btnPower.addEventListener('click', () => {
  const phase = st && st.ok ? st.phase : 'idle';
  if (phase === 'playing') {
    setBusy('Pausiere…');
    api('pause').then(() => { busy = null; refresh(); })
      .catch(e => { busy = null; st = { ok: false, message: String(e), phase: 'error' }; render(); });
  } else if (phase === 'paused') {
    setBusy('Setze fort…');
    api('resume').then(r => {
      busy = null;
      if (!r.ok && r.devices) knownDevices = r.devices;
      refresh();
    }).catch(e => { busy = null; st = { ok: false, message: String(e), phase: 'error' }; render(); });
  } else {
    doStart();
  }
});

btnEnd.addEventListener('click', () => {
  setBusy('Beende…');
  api('stopSession').then(() => { busy = null; refresh(); })
    .catch(e => { busy = null; st = { ok: false, message: String(e), phase: 'error' }; render(); });
});

btnSkip.addEventListener('click', () => {
  btnSkip.disabled = true;
  api('skip').then(r => {
    if (r.ok && r.current) { renderCurrent(r.current); progressBase = 0; progressAt = Date.now(); }
    else if (!r.ok) { st = Object.assign({}, st, { message: r.message, phase: 'error' }); render(); }
    setTimeout(refresh, 2500);
  }).catch(() => setTimeout(refresh, 2500));
});

function flashSent(btn) {
  btn.classList.add('sent');
  setTimeout(() => btn.classList.remove('sent'), 400);
}

btnLike.addEventListener('click', () => {
  if (!currentKey) return;
  flashSent(btnLike);
  api('like', { key: currentKey }).then(r => {
    if (r.ok && r.current) {
      favIcon.textContent = r.current.isFavorite ? '♥' : '♡';
      btnFavorite.classList.toggle('favorite-active', !!r.current.isFavorite);
    }
  });
});

btnDislike.addEventListener('click', () => {
  if (!currentKey) return;
  flashSent(btnDislike);
  api('dislike', { key: currentKey }).then(r => {
    if (r.current) { renderCurrent(r.current); progressBase = 0; progressAt = Date.now(); }
    setTimeout(refresh, 2500);
  });
});

btnFavorite.addEventListener('click', () => {
  btnFavorite.disabled = true;
  api('toggleFavorite').then(r => {
    btnFavorite.disabled = false;
    if (r.ok) {
      favIcon.textContent = r.isFavorite ? '♥' : '♡';
      btnFavorite.classList.toggle('favorite-active', r.isFavorite);
    }
  }).catch(() => { btnFavorite.disabled = false; });
});

btnToggleDevices.addEventListener('click', () => {
  devicesOpen = !devicesOpen;
  renderDevices();
  if (devicesOpen && !knownDevices.length) {
    api('devices').then(r => { if (r.ok) { knownDevices = r.devices; renderDevices(); } });
  }
});

statusLine.addEventListener('click', () => { detailsOpen = !detailsOpen; renderDetails(); });
btnReload.addEventListener('click', () => location.reload());

// Bei versteckter Seite gar nicht pollen; beim Zurueckkommen sofort einmal.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { clearTimeout(pollTimer); clearInterval(tickTimer); tickTimer = null; }
  else { if (!tickTimer) tickTimer = setInterval(tick, 500); refresh(); }
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

tickTimer = setInterval(tick, 500);
render();
refresh();
</script>

</body>
</html>
