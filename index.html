<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover ist Pflicht, sonst liefert env(safe-area-inset-*)
     immer 0 und der untere Rand wird in der PWA abgeschnitten. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>1LIVE DJ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="1LIVE DJ">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { width: 100%; background: #000; overflow-x: hidden; }
/* min-height statt fixer height: normalerweise fuellt die App genau einen
   Bildschirm, aber wenn ausnahmsweise alles gleichzeitig sichtbar ist
   (Fortschritt + Fehlermeldung + offene Geraeteliste auf einem kleinen
   Display), darf die Seite scrollen. Vorher war das overflow:hidden - der
   Start-Knopf wurde dann einfach abgeschnitten. */
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
  color: #fff; width: 100%; display: flex; flex-direction: column;
  /* Hoehe aus window.innerHeight (per Skript in --app-h), nicht aus 100dvh:
     auf dem Mi 9T (klassische Navigationsleiste) meldete Chrome fuer 100dvh
     943px bei nur 886px sichtbarem Fenster - die App war damit immer genau
     die Leistenhoehe (57px) zu lang und man musste scrollen. */
  min-height: 100dvh;
  min-height: var(--app-h, 100dvh);
  padding-top: env(safe-area-inset-top, 0);
  padding-right: env(safe-area-inset-right, 0);
  padding-left: env(safe-area-inset-left, 0);
  /* Untere Gestensteuerung/Notch. Android meldet env() bei Gestennavigation
     nicht zuverlaessig, deshalb ein fester Mindestabstand - mit 8px klebte
     die Statuszeile noch am unteren Rand. */
  padding-bottom: max(env(safe-area-inset-bottom, 0px), 22px);
}

.topbar {
  flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
  padding: 8px 16px; border-bottom: 2px solid #222;
}
.title { font-size: 19px; font-weight: 900; letter-spacing: 0.5px; }
.title .dj { color: #e8001c; }
.btn-icon {
  background: rgba(255,255,255,0.06); border: 1.5px solid #444; border-radius: 8px; color: #ccc;
  font-size: 16px; cursor: pointer; width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.btn-icon:active { color: #fff; border-color: #e8001c; background: rgba(232,0,28,0.18); }

/* min-height:0 ist der eigentliche Fix: ohne das weigert sich ein flex:1
   Element, unter seine Inhaltsgroesse zu schrumpfen - alles darunter wurde
   aus dem Viewport gedrueckt und von overflow:hidden abgeschnitten.
   Das Minimum ist bewusst klein: dieser Bereich ist der einzige, der
   nachgeben KANN. Je kleiner er darf, desto sicherer passt die Seite auch
   auf kurze Displays, mit Statusleisten-Aussparung oder vergroesserter
   Systemschrift - lieber ein knapper Titelbereich als eine scrollende Seite. */
.now-playing {
  flex: 1 1 0; min-height: 60px; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 16px 20px; gap: 6px; text-align: center;
}
.np-title  { font-size: clamp(22px, 8vw, 40px); font-weight: 900; line-height: 1.12; }
.np-artist { font-size: clamp(16px, 5.5vw, 26px); color: #999; font-weight: 700; line-height: 1.2; }
.np-meta   { font-size: 12px; color: #666; margin-top: 2px; }
/* Podcast-Schlagzeilen sind lang - auf zwei Zeilen begrenzen, damit sie den
   Bereich nicht sprengen (vorher lief der Titel in den Fortschrittsbalken). */
.np-meta.clamp2 {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; font-size: 13px; color: #888; line-height: 1.3;
  max-width: 100%;
}

.progress-wrap { flex: 0 0 auto; padding: 0 20px 8px; }
.progress-bar { height: 4px; border-radius: 2px; background: #222; overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: #e8001c; transition: width .25s linear; }
.progress-times {
  display: flex; justify-content: space-between; font-size: 11px; color: #555;
  font-variant-numeric: tabular-nums; margin-top: 4px;
}
.progress-wrap.hidden { visibility: hidden; }

.feedback-row, .seek-row { flex: 0 0 auto; display: flex; gap: 12px; padding: 0 16px 8px; }
.btn-seek {
  flex: 1; border: 2px solid #2a4a6a; background: #0b1622; color: #9fd0ff; cursor: pointer;
  border-radius: 16px; font-family: inherit; font-weight: 800; padding: 10px 0;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation;
  transition: transform .1s, filter .1s;
}
.btn-seek .ico { font-size: 24px; line-height: 1; }
.btn-seek .lbl { font-size: 13px; }
.btn-seek:active { transform: scale(0.92); filter: brightness(1.35); }
.btn-feedback {
  flex: 1; border: none; cursor: pointer; border-radius: 16px; font-family: inherit;
  font-weight: 800; padding: 10px 0; display: flex; flex-direction: column; align-items: center;
  gap: 3px; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation;
  transition: transform .1s, filter .1s;
}
.btn-feedback .ico { font-size: 24px; line-height: 1; }
.btn-feedback .lbl { font-size: 13px; }
.btn-feedback:active { transform: scale(0.92); filter: brightness(1.3); }
.btn-feedback:disabled { opacity: 0.3; cursor: default; }
.btn-dislike  { background: #1e0306; color: #ff8fa0; border: 2px solid #5a1018; }
.btn-like     { background: #0d1e0d; color: #8fffa0; border: 2px solid #204020; }
.btn-favorite { background: rgba(255,255,255,0.05); color: #999; border: 2px solid #444; }
.btn-favorite.favorite-active { background: #2a0810; color: #ff4d6d; border-color: #e8001c; }
.btn-feedback.sent { filter: brightness(1.6); }

.controls { flex: 0 0 auto; padding: 0 16px; display: flex; flex-direction: column; gap: 6px; }
.btn-skip {
  border: 1.5px solid #444; cursor: pointer; border-radius: 13px; font-family: inherit;
  background: rgba(255,255,255,0.05); color: #fff; font-size: 15px; font-weight: 800;
  padding: 9px 0; -webkit-tap-highlight-color: transparent; user-select: none;
  touch-action: manipulation; transition: transform .1s;
}
.btn-skip:active { transform: scale(0.97); border-color: #666; }
.btn-skip:disabled { opacity: 0.3; cursor: default; }

.extras-row { display: flex; gap: 8px; }
.btn-extra {
  flex: 1; min-width: 0; border: 1.5px solid #444; cursor: pointer; border-radius: 13px;
  font-family: inherit; background: rgba(255,255,255,0.05); color: #ccc; font-size: 12.5px;
  font-weight: 800; padding: 9px 2px; -webkit-tap-highlight-color: transparent; user-select: none;
  touch-action: manipulation; transition: transform .1s, filter .1s;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.btn-extra:active { transform: scale(0.97); }
.btn-extra.active { border-color: #e8001c; color: #fff; background: rgba(232,0,28,0.22); }

/* Beschriftung neben der Zeile statt darueber - spart rund 30px Hoehe,
   die auf kurzen Displays am unteren Rand gefehlt haben. */
/* Die Leiste darf seitlich scrollen, aber der Scrollbalken darf keine Hoehe
   kosten - mit dem dritten Sender kam er dazu und hat die Seite ueber den
   Bildschirmrand geschoben. */
.pill-row {
  display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px;
  scrollbar-width: none; -ms-overflow-style: none;
}
.pill-row::-webkit-scrollbar { display: none; }
.pill {
  flex-shrink: 0; padding: 7px 13px; border-radius: 18px; border: 1.5px solid #444;
  background: rgba(255,255,255,0.05); color: #999; font-size: 13px; font-weight: 700;
  cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent;
  font-family: inherit;
}
.pill.active { border-color: #e8001c; color: #fff; background: rgba(232,0,28,0.18); }
.hidden { display: none !important; }

.power-row { display: flex; gap: 10px; }
.btn-power {
  flex: 1; min-width: 0; border: none; cursor: pointer; border-radius: 15px; font-family: inherit;
  font-size: 17px; font-weight: 900; letter-spacing: 0.3px; padding: 13px 4px;
  -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation;
  transition: transform .1s, filter .1s;
}
.btn-power:active { transform: scale(0.96); }
.btn-power .sub { display: block; font-size: 11px; font-weight: 700; opacity: 0.8; margin-top: 2px; }
.btn-power.start  { background: #e8001c; color: #fff; box-shadow: 0 0 26px rgba(232,0,28,0.35); }
.btn-power.pause  { background: #222; color: #ccc; border: 2px solid #444; }
.btn-power.resume { background: #00e676; color: #000; box-shadow: 0 0 26px rgba(0,230,118,0.3); }
.btn-power.busy   { background: #333; color: #aaa; box-shadow: none; }
.btn-power:disabled { opacity: 0.6; box-shadow: none; cursor: default; }
.btn-end {
  flex: 0 0 92px; border: 2px solid #444; background: #161616; color: #999;
  font-family: inherit; font-size: 14px; font-weight: 800; border-radius: 15px; cursor: pointer;
  -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation;
}
.btn-end:active { transform: scale(0.96); color: #fff; border-color: #e8001c; }
.btn-end:disabled { opacity: 0.3; cursor: default; }

/* Wird nur eingeblendet, wenn wirklich etwas im Argen liegt. */
.alert {
  flex: 0 0 auto; margin: 0 16px 8px; padding: 10px 12px; border-radius: 12px;
  background: #2a0810; border: 1.5px solid #7a1020; font-size: 13px; line-height: 1.35; color: #ffc2cc;
}
.alert .act { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.alert a, .alert button {
  font-family: inherit; font-size: 12.5px; font-weight: 800; padding: 8px 11px; border-radius: 9px;
  border: 1.5px solid #e8001c; background: rgba(232,0,28,0.2); color: #fff;
  text-decoration: none; cursor: pointer; -webkit-tap-highlight-color: transparent;
}

.statusline {
  flex: 0 0 auto; padding: 8px 16px 2px; font-size: 12px; color: #777; text-align: center;
  cursor: pointer; -webkit-tap-highlight-color: transparent; min-height: 26px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.statusline .dot {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #444;
  margin-right: 6px; vertical-align: 1px;
}
.statusline.playing .dot { background: #00e676; }
.statusline.paused  .dot { background: #ffb300; }
.statusline.trouble .dot { background: #ff3b30; }
.statusline.busy    .dot { background: #29b6f6; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0.25; } }
.statusline.trouble { color: #ff8fa0; }

.details {
  flex: 0 0 auto; margin: 6px 16px 0; padding: 10px 12px; border-radius: 10px;
  background: rgba(255,255,255,0.04); border: 1px solid #222;
  font-size: 11.5px; color: #888; line-height: 1.6; text-align: left;
  max-height: 30vh; overflow-y: auto;
}
.details b { color: #bbb; font-weight: 700; }
</style>
</head>
<body>

<div class="topbar">
  <div class="title">1LIVE <span class="dj">DJ</span></div>
  <button class="btn-icon" id="btnReload" title="Neu laden">↺</button>
</div>

<div class="now-playing">
  <div class="np-title" id="npTitle">—</div>
  <div class="np-artist" id="npArtist"></div>
  <div class="np-meta" id="npMeta"></div>
</div>

<div class="progress-wrap hidden" id="progressWrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-times"><span id="tElapsed">0:00</span><span id="tTotal">0:00</span></div>
</div>

<div class="alert hidden" id="alertBox"></div>

<!-- Ersetzt waehrend einer Einspielung die Bewertungs-Reihe: gleiche Hoehe,
     dadurch kein Springen des Layouts beim Umschalten. -->
<div class="seek-row hidden" id="seekRow">
  <button class="btn-seek" id="btnBack5"><span class="ico">⏪</span><span class="lbl">5 Sek</span></button>
  <button class="btn-seek" id="btnFwd10"><span class="ico">⏩</span><span class="lbl">10 Sek</span></button>
</div>

<div class="feedback-row" id="feedbackRow">
  <button class="btn-feedback btn-dislike" id="btnDislike" disabled>
    <span class="ico">👎</span><span class="lbl">nicht mehr</span>
  </button>
  <button class="btn-feedback btn-favorite" id="btnFavorite" disabled>
    <span class="ico" id="favIcon">♡</span><span class="lbl">Favorit</span>
  </button>
  <button class="btn-feedback btn-like" id="btnLike" disabled>
    <span class="ico">👍</span><span class="lbl">öfter</span>
  </button>
</div>

<div class="controls">
  <button class="btn-skip" id="btnSkip" disabled>⏭ Skip</button>

  <div class="extras-row">
    <button class="btn-extra" id="btnNews">📰 News</button>
    <button class="btn-extra" id="btnAktuelles">📻 Aktuelles</button>
    <button class="btn-extra" id="btnUpdate">🗞 Update</button>
  </div>

  <!-- Ohne Beschriftung "SENDER": die kostete 56px, und die Kacheln
       brauchten auf einem 329px-Display 283px bei nur 241px Platz. -->
  <div class="pill-row" id="stationRow"></div>

  <div class="power-row">
    <button class="btn-power start" id="btnPower">▶ Start</button>
    <button class="btn-end" id="btnEnd" disabled>Beenden</button>
  </div>
</div>

<div class="statusline" id="statusLine"><span class="dot"></span>Verbinde…</div>
<div class="details hidden" id="detailsBox"></div>

<!-- Spotify kann keine fremden MP3-URLs abspielen - Nachrichten/Aktuelles
     laufen deshalb ueber dieses Element im Browser selbst, waehrend Spotify
     kurz pausiert wird. Ohne "controls" hat es keine sichtbare Flaeche. -->
<audio id="newsAudio" preload="none"></audio>

<script>
// Sichtbare Fensterhoehe als CSS-Variable (siehe body im Stylesheet). Bei
// jeder Groessenaenderung nachziehen - Navigationsleiste, Drehen, Tastatur.
// Laeuft zusaetzlich im 500-ms-Takt (tick): beim Start einer installierten App
// waechst das Fenster oft noch (Log: 329x627 -> 329x672), ohne dass jedes
// Geraet dafuer zuverlaessig ein resize meldet.
let appHoehe = 0;
function setzeAppHoehe() {
  const vv = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  const h = Math.round(Math.min(vv || window.innerHeight, window.innerHeight));
  if (h === appHoehe || !h) return;
  appHoehe = h;
  document.documentElement.style.setProperty('--app-h', h + 'px');
}
setzeAppHoehe();
window.addEventListener('resize', setzeAppHoehe);
if (window.visualViewport) window.visualViewport.addEventListener('resize', setzeAppHoehe);

const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxBbH87136ak1xaEq16iz-x52AiasndeZUhFcrQYbIgNlx2NfWBA_NZlhw7SP7hx6hxrQ/exec';

const IDLE_POLL_MS  = 20000;  // nichts laeuft: gemaechlich nachsehen
const ERROR_POLL_MS = 12000;  // Problemzustand: etwas haeufiger
const MIN_POLL_MS   = 6000;
// Aelter als das gilt die Anzeige als ueberholt. Beim Zurueckwechseln aus
// einer anderen App ist der letzte Stand oft Minuten alt - ihn so lange
// weiterzuzeigen, als waere er aktuell, ist schlimmer als ihn auszublenden.
const STALE_MS      = 35000;
const MAX_POLL_MS   = 30000;

const $ = id => document.getElementById(id);
const npTitle = $('npTitle'), npArtist = $('npArtist'), npMeta = $('npMeta');
const btnLike = $('btnLike'), btnDislike = $('btnDislike'), btnFavorite = $('btnFavorite'), favIcon = $('favIcon');
const btnSkip = $('btnSkip'), btnPower = $('btnPower'), btnEnd = $('btnEnd'), btnReload = $('btnReload');
const stationRow = $('stationRow');
const statusLine = $('statusLine'), detailsBox = $('detailsBox'), alertBox = $('alertBox');
const progressWrap = $('progressWrap'), progressFill = $('progressFill');
const tElapsed = $('tElapsed'), tTotal = $('tTotal');
const btnNews = $('btnNews'), btnAktuelles = $('btnAktuelles'), newsAudio = $('newsAudio');
const btnUpdate = $('btnUpdate'), seekRow = $('seekRow'), feedbackRow = $('feedbackRow');
const btnBack5 = $('btnBack5'), btnFwd10 = $('btnFwd10');

const STATION_LABELS = { '1live': '1LIVE', 'br1': 'Bayern 1', 'br3': 'Bayern 3', 'spoon': 'Spoon Rock' };

// Auf welchem Geraet laeuft die App gerade? Der User-Agent hilft nicht mehr
// (Chrome meldet seit der UA-Reduktion pauschal "Android 10; K", siehe
// Protokoll), die Client Hints liefern das Modell aber weiterhin - z.B.
// "Pixel 8". Spotify benennt seine Connect-Geraete meist genauso, damit laesst
// sich Pixel von Mi 9T unterscheiden. Reiner Hinweis: klappt es nicht, bleibt
// es bei der Rangfolge im Backend.
let geraeteHinweis = '';
try {
  if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
    navigator.userAgentData.getHighEntropyValues(['model']).then(d => {
      geraeteHinweis = (d && d.model) ? String(d.model).slice(0, 40) : '';
      logEvent('geraet_erkannt', geraeteHinweis || '(leer)');
    }).catch(() => logEvent('geraet_erkannt', '(fehlgeschlagen)'));
  } else {
    logEvent('geraet_erkannt', '(nicht unterstuetzt)');
  }
} catch (e) { /* ohne Hinweis laeuft es normal weiter */ }

let st = null;              // letzte Server-Antwort
let currentKey = null;
let pollTimer = null;
let tickTimer = null;
let busy = null;            // Text, solange eine Aktion laeuft
let detailsOpen = false;
// "Ich weiss es gerade nicht" ist NICHT dasselbe wie "es laeuft nichts".
// Rund ein Fuenftel aller Abrufe lief zuletzt ins Zeitlimit; die App zeigte
// dann denselben aktiven Start-Knopf wie im Ruhezustand - ein Tipper darauf
// hat die laufende Musik ersetzt. Solange der Stand unklar ist, bietet der
// Knopf jetzt "nachsehen" statt "starten" an.
let verbindungUnklar = false;
let progressBase = 0;       // progress_ms zum Zeitpunkt der Antwort
let progressAt = 0;         // lokale Uhrzeit der Antwort
let progressKorrekturMs = 0; // wie viel auf den gemeldeten Stand addiert wurde
// Wartezustand: nach einem am Geraet gescheiterten Start prueft die App
// selbstaendig weiter und startet, sobald Spotify erreichbar ist. Sichtbar,
// damit man weiss, dass Warten reicht und man nichts druecken muss.
let waitingUntil = 0;
let waitingSince = 0;   // fuer die Auswertung: wie lange bis das Geraet zurueckkam
const WAIT_WINDOW_MS = 5 * 60 * 1000;
const WAIT_POLL_MS   = 5000;    // sichtbar
const WAIT_BG_POLL_MS = 10000;  // im Hintergrund (Android drosselt das evtl.)

// ── Nachrichten & Aktuelles ────────────────────────────────────
// Spotify kann keine fremden MP3-URLs abspielen - diese Beitraege laufen im
// Browser selbst (newsAudio), waehrend Spotify kurz pausiert wird. Zwei
// unabhaengige Ausloese-Wege treffen sich in maybeTriggerInterjection():
//   - vorausschauend in tick(): ~4s vor Songende, schneidet nur den
//     laufenden Song minimal an statt seinen Nachfolger.
//   - reaktiv in refresh(): falls die App waehrenddessen im Hintergrund war
//     (kein tick() lief) und der Songwechsel erst im Nachhinein auffaellt.
let pendingNews = null;               // vorbereitete Nachrichtenfolge, wartet auf die naechste Luecke
let aktuellesOn = localStorage.getItem('aktuellesOn') === '1';
let aktuellesNextItem = null;         // vorab geholt, damit beim Ausloesen keine Wartezeit entsteht
let songsSinceInterjection = 0;
let interjectionThreshold = 2;
let interjectionActive = null;        // { item, kind, paused } waehrend eine Einspielung laeuft
let updateQueue = [];                 // "Update"-Modus: die vier Folgen der Reihe nach
// Senderwechsel wirkt erst zum naechsten Songende: dann wird die komplette
// Wiedergabeliste bei Spotify durch Songs des neuen Senders ersetzt (der
// Start-Aufruf setzt den Kontext neu, siehe topUpQueue_/handleStartSession).
let pendingStationSwitch = false;
let resumeSeekMs = null;              // 0, wenn der naechste Song von vorne starten soll
let resumeSkipNext = false;           // true, wenn noch ein Ausklang-Rest zu ueberspringen ist
let interjectionResolve = null;       // laesst Skip/Beenden die laufende Einspielung sofort abbrechen
let interjectionCancelReason = null;  // 'end_session' verhindert das automatische Fortsetzen danach
let lastSeenSongUri = null;
let triggeredForUri = null;           // verhindert doppeltes vorausschauendes Ausloesen fuer denselben Song

// Versions-/Remix-Zusaetze aus Songtiteln entfernen - reine Anzeigesache.
// Spotify haengt sie an ("Finder - Radio-Edit"), fuer die Anzeige interessiert
// aber nur der eigentliche Titel. Die Suchlogik im Backend, die bewusst die
// richtige Version findet, bleibt davon unberuehrt.
const VERSION_WORDS = /\b(radio[ -]?edit|radio[ -]?mix|radio[ -]?version|radio[ -]?cut|single[ -]version|album[ -]version|remaster(ed)?|remix(ed)?|extended|club[ -]mix|vip[ -]mix|original[ -]mix|dub[ -]mix|long[ -]version|maxi[ -]version|video[ -]?version|short[ -]cut|edit|version|live|mono|stereo|deluxe|bonus[ -]track|instrumental|a ?ca?pella|acoustic|karaoke|cover|mix)\b/i;

function cleanTitle(raw) {
  const original = String(raw === null || raw === undefined ? '' : raw);
  let t = original;

  // Klammer-Zusaetze am Ende, ggf. mehrere: "Song (Radio Edit) (Remastered)"
  let prev;
  do {
    prev = t;
    t = t.replace(/\s*[([]([^()[\]]*)[)\]]\s*$/, (m, inner) => VERSION_WORDS.test(inner) ? '' : m);
  } while (t !== prev);

  // Zusaetze hinter einem Trennstrich, ebenfalls ggf. mehrere.
  const parts = t.split(/\s+[-–—]\s+/);
  while (parts.length > 1 && VERSION_WORDS.test(parts[parts.length - 1])) parts.pop();
  t = parts.join(' - ').trim();

  return t || original; // nie leer zurueckgeben
}

function fmt(ms) {
  if (!ms && ms !== 0) return '0:00';
  const s = Math.max(0, Math.round(ms / 1000));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

// ── Ereignisprotokoll ────────────────────────────────────────
// Sammelt lokal und schickt gebuendelt per POST - ein Apps-Script-Aufruf pro
// Ereignis waere bei 2-3 s Antwortzeit undenkbar. Beim Wegwechseln geht der
// Rest per sendBeacon raus, damit nichts verlorengeht. Protokollieren darf
// die App nie ausbremsen oder zum Scheitern bringen: alles in try/catch,
// keine Wartezeiten, keine Fehleranzeige.
const LOG_FLUSH_MS  = 30000;
const LOG_MAX_QUEUE = 30;
const logSession = Math.random().toString(36).slice(2, 8) + '-' +
                   new Date().toISOString().slice(11, 19).replace(/:/g, '');
let logQueue = [];

function logEvent(event, label, detail, ms) {
  try {
    logQueue.push({
      t: Date.now(), event: event,
      label: (label === undefined || label === null) ? '' : String(label).slice(0, 400),
      detail: detail === undefined ? '' : detail,
      ms: (typeof ms === 'number' && isFinite(ms)) ? Math.round(ms) : undefined
    });
    if (logQueue.length >= LOG_MAX_QUEUE) flushLog();
  } catch (e) { /* nie stoeren */ }
}

function flushLog(useBeacon) {
  if (!logQueue.length) return;
  let payload;
  try {
    payload = JSON.stringify({ type: 'log', session: logSession, events: logQueue });
  } catch (e) { logQueue = []; return; }
  logQueue = [];
  try {
    if (useBeacon && navigator.sendBeacon) {
      // text/plain -> einfacher Request ohne CORS-Preflight, und sendBeacon
      // ueberlebt das Wegwechseln der App.
      navigator.sendBeacon(WEBAPP_URL, new Blob([payload], { type: 'text/plain;charset=UTF-8' }));
    } else {
      fetch(WEBAPP_URL, { method: 'POST', body: payload, keepalive: true }).catch(() => {});
    }
  } catch (e) { /* nie stoeren */ }
}

setInterval(() => flushLog(), LOG_FLUSH_MS);
window.addEventListener('pagehide', () => flushLog(true));

let lastBadResponse = null;
// Gleitender Mittelwert der Antwortzeit. Apps Script braucht 2-3 s pro
// Aufruf - daraus errechnet sich der Vorlauf fuer den Pause-Befehl, damit
// er genau am Songende ankommt statt drei Sekunden danach.
let apiLatency = 2500;

// Apps Script liefert gelegentlich eine HTML-Seite statt JSON - das passiert
// in Googles HTTP-Schicht, nicht im Skript. Frueher landete das als rohes
// "Unexpected token '<'" beim Nutzer, obwohl die Aktion serverseitig
// erfolgreich war. Jetzt wird daraus ein sauberer Zustand, den der Aufrufer
// durch Nachfragen aufloesen kann.
// Kurz auf 30 s angehoben und wieder zurueckgenommen: der Gedanke war, dass
// 12 s unter dem gemessenen p90 liegen und die App sich damit selbst Fehler
// baut. In der Praxis war das Gegenteil schlimmer - beim App-Start wartete man
// erst 30 s auf den Abbruch und dann ERROR_POLL_MS bis zum zweiten Versuch,
// also rund eine Minute, bis die App die laufende Musik ueberhaupt bemerkte.
// Ein frueher Abbruch ist inzwischen harmlos: der Start uebernimmt laufende
// Wiedergabe (adoptRunningPlayback_), statt sie zu ersetzen.
const API_TIMEOUT_MS = 12000;
// Der Start darf laenger: er laeuft serverseitig ohnehin weiter, und ein
// Abbruch nach 12 s loeste bisher nur Wiederholungen aus, die dann am
// Server-Lock warteten (15.09., 11:21-11:23).
const API_TIMEOUT_START_MS = 20000;

// ── Doppelt fragen statt lange warten ────────────────────────
// Gemessen am 16.09.: das Skript selbst antwortet in 0,4-0,8 s, Googles
// Web-App-Schicht davor braucht aber mal 1 s, mal 30 s - scheinbar zufaellig
// pro Anfrage. Ein Drittel aller Status-Abrufe lief dadurch ins Zeitlimit.
// Kommt nach HEDGE_AFTER_MS keine Antwort, geht deshalb eine zweite, gleiche
// Anfrage los; die erste brauchbare Antwort gewinnt. Nur fuer Abrufe, die
// nichts veraendern - ein doppelter Start oder Skip waere fatal.
const HEDGE_AFTER_MS = 4000;
const HEDGE_ACTIONS = ['status', 'stations', 'updateEpisodes', 'latestNews', 'spotifyClientId'];
const TRANSPORT_CODES = ['TIMEOUT', 'NETWORK', 'BAD_RESPONSE'];

function apiOnce(action, params) {
  const qs = new URLSearchParams(Object.assign({ action: action, _t: Date.now() + '' + Math.random().toString(36).slice(2, 5) }, params || {}));
  const t0 = Date.now();
  // Ohne Zeitlimit konnte eine haengende Anfrage (typisch beim Wechsel
  // WLAN<->Mobilfunk) die komplette Abfrageschleife lahmlegen: der naechste
  // Abruf wird erst im .then() geplant, also nie. Die Anzeige blieb dann
  // minutenlang stehen. Jetzt bricht sie ab und der Aufrufer plant weiter.
  const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const limit = action === 'startSession' ? API_TIMEOUT_START_MS : API_TIMEOUT_MS;
  const killer = ctrl ? setTimeout(() => ctrl.abort(), limit) : null;

  return fetch(WEBAPP_URL + '?' + qs.toString(),
               ctrl ? { cache: 'no-store', signal: ctrl.signal } : { cache: 'no-store' })
    .then(r => r.text().then(text => {
      try {
        const data = JSON.parse(text);
        apiLatency = Math.round(apiLatency * 0.7 + (Date.now() - t0) * 0.3);
        return data;
      } catch (e) {
        lastBadResponse = { at: Date.now(), action: action, status: r.status, snippet: text.slice(0, 100) };
        return { ok: false, code: 'BAD_RESPONSE',
                 message: 'Server hat keine lesbare Antwort geschickt (HTTP ' + r.status + ')' };
      }
    }))
    // Nie ablehnen, immer ein Ergebnis liefern - so laeuft der .then()-Pfad
    // der Aufrufer (und damit scheduleNext) auch bei Netzproblemen weiter.
    .catch(err => ({
      ok: false,
      code: (err && err.name === 'AbortError') ? 'TIMEOUT' : 'NETWORK',
      message: (err && err.name === 'AbortError')
        ? 'Server antwortet nicht (Zeitlimit)'
        : 'Keine Verbindung'
    }))
    .then(res => {
      if (killer) clearTimeout(killer);
      return res;
    });
}

function api(action, params) {
  const t0 = Date.now();
  const hedge = HEDGE_ACTIONS.indexOf(action) !== -1;
  return new Promise(resolve => {
    let done = false, laufend = 0, hedged = false, letzterFehler = null;
    let hedgeTimer = null;

    const finish = (res, nr) => {
      if (done) return;
      done = true;
      if (hedgeTimer) clearTimeout(hedgeTimer);
      logEvent('api', action, res && res.ok === false ? (res.code || 'fehler') : 'ok', Date.now() - t0);
      if (hedged) logEvent('api_doppelt', action, { gewinner: nr, ergebnis: res && res.ok === false ? res.code : 'ok' });
      resolve(res);
    };
    const launch = nr => {
      laufend++;
      apiOnce(action, params).then(res => {
        laufend--;
        const transport = res && res.ok === false && TRANSPORT_CODES.indexOf(res.code) !== -1;
        if (!transport) { finish(res, nr); return; }
        letzterFehler = res;
        // Transportfehler: sofort die Zweitanfrage schicken statt die
        // Wartezeit abzusitzen, oder auf die noch laufende andere warten.
        if (hedge && !hedged) { startHedge(); return; }
        if (laufend === 0) finish(letzterFehler, nr);
      });
    };
    const startHedge = () => {
      if (hedged || done) return;
      hedged = true;
      launch(2);
    };

    launch(1);
    if (hedge) hedgeTimer = setTimeout(startHedge, HEDGE_AFTER_MS);
  });
}

// ── Direktverbindung zu Spotify ──────────────────────────────
// Status, Pause, Weiter und Skip gehen direkt an Spotify (~0,3 s) statt ueber
// Apps Script (2-30 s, siehe oben). Apps Script bleibt fuer alles, was das
// Sheet braucht: Start (Songauswahl), Bewertungen, Vorrat, Protokoll.
// Anmeldung per PKCE: ohne Client Secret, nur mit der oeffentlichen Client ID.
// Ist nichts verbunden oder streikt die Verbindung, laeuft alles wie bisher
// ueber Apps Script - die App funktioniert also auch ohne diesen Teil.
const SP_SCOPES = 'user-read-playback-state user-modify-playback-state user-read-currently-playing';
// Muss exakt so im Spotify-Dashboard als Redirect URI eingetragen sein.
const SP_REDIRECT = location.origin + location.pathname.replace(/index\.html$/, '');
const SP_TIMEOUT_MS = 6000;
// So oft holt die App im Direktbetrieb die Server-Sicht (Songherkunft,
// Session, Vorrat, Fehler). Bei Songwechsel sofort, sonst hoechstens so selten.
const SRV_META_MS = 60000;

let spAuth = spLoad();
let spDeviceId = null;       // Geraet der letzten Wiedergabe - Ziel fuer Befehle
let spLatency = 500;         // gleitender Mittelwert der Direktbefehle
let spBackoffUntil = 0;      // nach 429/Stoerung eine Weile den alten Weg nehmen
let spFailStreak = 0;
let spNotice = null;         // Hinweis fuer die Detailansicht (z.B. Anmeldung abgebrochen)
let spPollCount = 0;
let lastSpState = null;      // letzter Rohstand von /me/player
let lastDirectOkAt = 0;
let srv = null;              // letzte Server-Antwort auf action=status
let srvAt = 0;
let srvInFlight = null;
let srvLastTry = 0;

function spLoad() {
  try { return JSON.parse(localStorage.getItem('spDirect') || 'null'); } catch (e) { return null; }
}
function spSave(tok, clientId) {
  spAuth = {
    access: tok.access_token,
    // PKCE-Refresh-Tokens werden bei jeder Erneuerung ausgetauscht - fehlt
    // ausnahmsweise ein neuer, bleibt der alte gueltig.
    refresh: tok.refresh_token || (spAuth && spAuth.refresh),
    exp: Date.now() + Math.max(60, (tok.expires_in || 3600) - 120) * 1000,
    clientId: clientId || (spAuth && spAuth.clientId)
  };
  try { localStorage.setItem('spDirect', JSON.stringify(spAuth)); } catch (e) { /* dann eben nur fuer diese Sitzung */ }
}
function spDisconnect(grund) {
  spAuth = null;
  try { localStorage.removeItem('spDirect'); } catch (e) {}
  spNotice = grund || null;
  logEvent('spotify_direkt', 'getrennt', grund || '');
}
function spConnected() { return !!(spAuth && spAuth.refresh && spAuth.clientId); }
function spActive() { return spConnected() && Date.now() >= spBackoffUntil; }

function b64url(buf) {
  let s = '';
  new Uint8Array(buf).forEach(b => { s += String.fromCharCode(b); });
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function spRandom(n) {
  const a = new Uint8Array(n);
  crypto.getRandomValues(a);
  return b64url(a);
}

async function spLogin() {
  logEvent('knopf', 'spotify_verbinden', { redirect: SP_REDIRECT });
  setBusy('Verbinde mit Spotify…');
  let clientId = null;
  try { clientId = localStorage.getItem('spClientId'); } catch (e) {}
  if (!clientId) {
    const r = await api('spotifyClientId');
    clientId = r && r.ok ? r.clientId : null;
    if (clientId) { try { localStorage.setItem('spClientId', clientId); } catch (e) {} }
  }
  if (!clientId) {
    busy = null;
    spNotice = 'Client ID nicht abrufbar – gleich nochmal versuchen';
    render();
    return;
  }
  const verifier = spRandom(48);
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  const state = spRandom(12);
  localStorage.setItem('spPkce', JSON.stringify({ verifier: verifier, state: state, clientId: clientId, at: Date.now() }));
  flushLog(true);
  location.href = 'https://accounts.spotify.com/authorize?' + new URLSearchParams({
    response_type: 'code', client_id: clientId, scope: SP_SCOPES, redirect_uri: SP_REDIRECT,
    code_challenge_method: 'S256', code_challenge: challenge, state: state
  }).toString();
}

// Rueckkehr von der Spotify-Anmeldung: ?code=... gegen Tokens tauschen.
async function spHandleRedirect() {
  const q = new URLSearchParams(location.search);
  if (!q.has('code') && !q.has('error')) return;
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  let pk = null;
  try { pk = JSON.parse(localStorage.getItem('spPkce') || 'null'); localStorage.removeItem('spPkce'); } catch (e) {}
  if (q.get('error')) {
    spNotice = 'Spotify-Anmeldung abgebrochen (' + q.get('error') + ')';
    logEvent('spotify_direkt', 'abgebrochen', q.get('error'));
    return;
  }
  if (!pk || pk.state !== q.get('state')) {
    spNotice = 'Spotify-Anmeldung passte nicht zusammen – bitte nochmal verbinden';
    logEvent('spotify_direkt', 'state_falsch', '');
    return;
  }
  try {
    const r = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        grant_type: 'authorization_code', code: q.get('code'), redirect_uri: SP_REDIRECT,
        client_id: pk.clientId, code_verifier: pk.verifier
      })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.access_token) {
      spNotice = 'Spotify-Anmeldung fehlgeschlagen: ' + (j.error_description || j.error || ('HTTP ' + r.status));
      logEvent('spotify_direkt', 'token_fehler', spNotice);
      return;
    }
    spSave(j, pk.clientId);
    spNotice = null;
    logEvent('spotify_direkt', 'verbunden', { scope: j.scope });
  } catch (e) {
    spNotice = 'Spotify-Anmeldung: keine Verbindung – nochmal versuchen';
    logEvent('spotify_direkt', 'token_netz', e.message);
  }
}

let spRefreshing = null;
function spToken() {
  if (!spConnected()) return Promise.reject(Object.assign(new Error('nicht verbunden'), { authLost: true }));
  if (spAuth.access && Date.now() < spAuth.exp) return Promise.resolve(spAuth.access);
  // Ein anderes Fenster (Browser statt installierter App) kann den Token schon
  // erneuert haben - dessen Refresh-Token ist dann der einzig gueltige.
  const aufPlatte = spLoad();
  if (aufPlatte && aufPlatte.refresh && aufPlatte.exp > Date.now()) { spAuth = aufPlatte; return Promise.resolve(spAuth.access); }
  if (aufPlatte && aufPlatte.refresh) spAuth = aufPlatte;
  if (spRefreshing) return spRefreshing;
  spRefreshing = fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: spAuth.refresh, client_id: spAuth.clientId })
  }).then(r => r.json().catch(() => ({})).then(j => {
    if (!r.ok || !j.access_token) {
      if (r.status === 400 || r.status === 401) {
        spDisconnect('Spotify-Anmeldung abgelaufen – bitte neu verbinden');
        throw Object.assign(new Error('Spotify-Anmeldung abgelaufen'), { authLost: true });
      }
      throw new Error('Token-Erneuerung: HTTP ' + r.status);
    }
    spSave(j);
    return spAuth.access;
  })).finally(() => { spRefreshing = null; });
  return spRefreshing;
}

// Liefert geparstes JSON, null bei leerer Antwort (204), wirft sonst mit .status.
function sp(path, opts) {
  opts = opts || {};
  return spToken().then(token => {
    const ctrl = new AbortController();
    const killer = setTimeout(() => ctrl.abort(), opts.timeout || SP_TIMEOUT_MS);
    const init = { method: opts.method || 'GET', headers: { Authorization: 'Bearer ' + token }, signal: ctrl.signal, cache: 'no-store' };
    if (opts.body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(opts.body); }
    return fetch('https://api.spotify.com/v1' + path, init)
      .finally(() => clearTimeout(killer))
      .then(res => {
        if (res.status === 401 && !opts._nochmal) {
          spAuth.exp = 0;
          return sp(path, Object.assign({}, opts, { _nochmal: true }));
        }
        return res.text().then(text => {
          if (res.status >= 200 && res.status < 300) {
            if (!text) return null;
            try { return JSON.parse(text); } catch (e) { return null; }
          }
          let msg = text;
          try { const j = JSON.parse(text); msg = (j.error && (j.error.message || j.error)) || text; } catch (e) {}
          const err = new Error('Spotify ' + res.status + ': ' + String(msg).slice(0, 120));
          err.status = res.status;
          if (res.status === 429) err.retryAfter = parseInt(res.headers.get('Retry-After') || '30', 10) || 30;
          throw err;
        });
      });
  });
}

function spNoteLatency(ms) { spLatency = Math.round(spLatency * 0.7 + ms * 0.3); }

// Befehl an das Wiedergabegeraet. 404 heisst bei Spotify "kein aktives
// Geraet" - typisch nach einer laengeren Pause (z.B. waehrend einer
// Update-Folge). Dann das Geraet per Transfer aufwecken und einmal wiederholen.
function spCmd(label, path, method, body) {
  const t0 = Date.now();
  const mitGeraet = p => spDeviceId ? p + (p.indexOf('?') === -1 ? '?' : '&') + 'device_id=' + encodeURIComponent(spDeviceId) : p;
  return sp(mitGeraet(path), { method: method, body: body })
    .catch(err => {
      if (err.status !== 404 || !spDeviceId) throw err;
      return sp('/me/player', { method: 'PUT', body: { device_ids: [spDeviceId], play: false } })
        .catch(() => null)
        .then(() => new Promise(r => setTimeout(r, 900)))
        .then(() => sp(mitGeraet(path), { method: method, body: body }));
    })
    .then(res => {
      const ms = Date.now() - t0;
      spNoteLatency(ms);
      logEvent('api', 'sp:' + label, 'ok', ms);
      return res;
    }, err => {
      logEvent('api', 'sp:' + label, err.status ? ('HTTP' + err.status) : 'NETWORK', Date.now() - t0);
      throw err;
    });
}

// Wie lange vor Songende der Pause-Befehl losgeschickt wird.
function pauseLeadMs() {
  const lat = spActive() ? spLatency : apiLatency;
  return Math.min(4500, Math.max(600, lat + 600));
}

function interjectionFeatureOn() {
  return aktuellesOn || updateQueue.length > 0 || !!pendingNews;
}

// Aus dem Spotify-Rohstand dieselbe Form bauen, die action=status liefert -
// der Rest der App muss dann nicht wissen, woher der Stand kommt.
function buildDirectStatus(state) {
  const s = srv || {};
  const item = state && state.item;
  const isPlaying = !!(state && state.is_playing);
  let current = null;
  if (item) {
    const artist = item.type === 'episode'
      ? ((item.show && item.show.name) || '')
      : (item.artists || []).map(a => a.name).join(', ');
    const basis = { uri: item.uri, title: item.name, artist: artist, durationMs: item.duration_ms };
    current = (s.current && s.current.uri === item.uri)
      ? Object.assign({}, s.current, basis)
      // Server hat den Songwechsel noch nicht gesehen: Herkunft unbekannt,
      // NICHT "aus Spotifys Warteschlange" behaupten.
      : Object.assign(basis, { key: null, metaPending: true });
  }
  const ours = !!(current && current.key);
  const session = !!s.sessionActive || (isPlaying && ours);
  const device = state && state.device ? state.device.name : null;
  const vorausBekannt = !!(s.current && current && s.current.uri === current.uri);

  let phase, message;
  if (isPlaying) {
    phase = 'playing';
    message = 'Läuft' + (device ? ' · ' + device : '') +
              (vorausBekannt ? ' · ' + (s.queueAhead || 0) + ' in der Warteschlange' : '');
  } else if (session && item) {
    phase = 'paused';
    message = 'Pausiert' + (device ? ' · ' + device : '');
  } else if (session) {
    phase = 'stalled';
    message = 'Wiedergabe steht – Start drücken';
  } else {
    phase = 'idle';
    message = 'Gestoppt · ' + (s.poolFresh || 0) + ' neu, ' + (s.poolKnown || 0) + ' bekannt';
  }

  return {
    ok: true, direct: true, phase: phase, message: message,
    isPlaying: isPlaying, isPaused: !isPlaying && !!item, sessionActive: session,
    current: current,
    progressMs: (state && typeof state.progress_ms === 'number') ? state.progress_ms : null,
    progressAgeMs: 0, serverMs: 0,
    queueAhead: vorausBekannt ? (s.queueAhead || 0) : null,
    device: device,
    shuffle: state ? state.shuffle_state : null,
    mode: s.mode, stations: s.stations, pool: s.pool,
    poolFresh: s.poolFresh, poolKnown: s.poolKnown,
    lastError: s.lastError, lastRefill: s.lastRefill
  };
}

// Server-Sicht im Direktbetrieb nachziehen, ohne die Anzeige zu blockieren.
function refreshServerMeta(force) {
  if (srvInFlight) return srvInFlight;
  if (!force && Date.now() - srvLastTry < 8000) return Promise.resolve();
  srvLastTry = Date.now();
  srvInFlight = api('status').then(data => {
    srvInFlight = null;
    if (!data || !data.ok) return;
    srv = data;
    srvAt = Date.now();
    if (!spActive() || !st || !st.direct) return;
    const merged = buildDirectStatus(lastSpState);
    st = Object.assign({}, st, merged, { progressMs: st.progressMs });
    if (!interjectionActive) { renderCurrent(st.current); renderStations(st.stations); }
    render();
  });
  return srvInFlight;
}

// ── Anzeige ──────────────────────────────────────────────────
function setBusy(text) {
  busy = text;
  render();
}

let curSong = null;

// Ohne laufenden Song stand hier nur ein Gedankenstrich in einer riesigen
// schwarzen Flaeche - das sah aus wie ein Absturz. Jetzt steht dort, woran
// man ist.
function paintIdle() {
  if (!st || !st.ok) { npTitle.textContent = '—'; npArtist.textContent = ''; npMeta.textContent = ''; return; }
  if (st.phase === 'device_gone') {
    npTitle.textContent = 'Spotify öffnen';
    npArtist.textContent = 'Kein Gerät erreichbar';
  } else if (st.phase === 'error') {
    npTitle.textContent = 'Kurz gestört';
    npArtist.textContent = 'versuche es gleich erneut';
  } else if (st.phase === 'paused') {
    npTitle.textContent = 'Pausiert';
    npArtist.textContent = '';
  } else {
    npTitle.textContent = 'Bereit';
    npArtist.textContent = (st.poolFresh || 0) + ' neue Songs';
  }
  npMeta.textContent = '';
}

function renderCurrent(cur) {
  curSong = cur || null;
  if (cur) {
    npTitle.textContent = cleanTitle(cur.title) || '—';
    npArtist.textContent = cur.artist || '';
    currentKey = cur.key || null;

    if (cur.mismatch) {
      // Der Sheet-Eintrag zeigte auf einen anderen Track. Angezeigt wird oben
      // das, was Spotify wirklich spielt - hier steht, was es haette sein
      // sollen und dass der Eintrag repariert wurde.
      npMeta.textContent = '⚠ Eintrag „' + cur.mismatch + '" war falsch verknüpft – korrigiert';
      npMeta.style.color = '#ffb300';
    } else {
      const parts = [];
      // Ohne Sheet-Key stammt der Song nicht von uns, sondern aus Spotifys
      // eigener Warteschlange (Reste frueherer Sitzungen). Dann sind auch
      // 👍/👎 wirkungslos - das soll man sehen, statt zu raten.
      // metaPending: Direktbetrieb, der Server hat den neuen Song noch nicht
      // gesehen - dann lieber gar nichts sagen als etwas Falsches.
      // vonUns === false: in Spotify selbst gestartet (z.B. eigene Playlist).
      if (cur.vonUns === false) parts.push('nicht vom DJ');
      else if (!cur.key && !cur.metaPending) parts.push('aus Spotifys Warteschlange');
      if (cur.station) parts.push(STATION_LABELS[cur.station] || cur.station);
      if (cur.playCount) parts.push(cur.playCount + '× gespielt');
      npMeta.textContent = parts.join(' · ');
      npMeta.style.color = '';
    }

    btnFavorite.disabled = !cur.uri;
    favIcon.textContent = cur.isFavorite ? '♥' : '♡';
    btnFavorite.classList.toggle('favorite-active', !!cur.isFavorite);
  } else {
    npTitle.textContent = '—';
    npArtist.textContent = '';
    npMeta.textContent = '';
    currentKey = null;
    btnFavorite.disabled = true;
    favIcon.textContent = '♡';
    btnFavorite.classList.remove('favorite-active');
  }
  btnLike.disabled = !currentKey;
  btnDislike.disabled = !currentKey;
}

let stationSig = '';

function renderStations(list) {
  if (!list) return;
  // Nur neu zeichnen, wenn sich wirklich etwas geaendert hat - sonst baut
  // jeder Status-Poll die Kacheln neu auf und kann einen Tap verschlucken.
  const sig = list.map(s => s.id + (s.active ? '1' : '0')).join(',');
  if (sig === stationSig) return;
  stationSig = sig;

  stationRow.innerHTML = '';
  list.forEach(s => {
    const b = document.createElement('button');
    b.className = 'pill' + (s.active ? ' active' : '');
    b.textContent = s.label;
    b.addEventListener('click', () => {
      // Genau eine Auswahl: ein Sender oder Mix. Ein Tipp auf die bereits
      // aktive Kachel waere frueher ein Abwaehlen gewesen - jetzt gibt es
      // keinen Zustand "gar kein Sender" mehr, also passiert nichts.
      if (s.active) return;
      logEvent('knopf', 'sender', { getippt: s.label });
      api('setStations', { mode: s.id }).then(r => {
        if (!r.ok) return;
        stationSig = ''; renderStations(r.stations);
        // Laeuft gerade Musik, wird die Liste zum Songende getauscht - sonst
        // erst beim naechsten Start, da ist ohnehin nichts zu ersetzen.
        if (st && st.ok && st.isPlaying) { pendingStationSwitch = true; render(); }
      });
    });
    stationRow.appendChild(b);
  });
}

function renderAlert() {
  if (busy || !st) { alertBox.classList.add('hidden'); return; }

  const trouble = ['device_gone', 'error'].indexOf(st.phase) !== -1;
  // Alte Hintergrundfehler nicht ewig anzeigen - ein Fehler von vor zwei
  // Stunden ist kein aktueller Zustand, sondern nur Rauschen. Steht die App
  // gerade wirklich im Problemzustand, zeigen wir ihn unabhaengig vom Alter.
  const err = (st.lastError && Date.now() - st.lastError.at < 15 * 60 * 1000) ? st.lastError : null;
  if (!trouble && !(err && st.phase !== 'playing')) {
    // Einmaliger Hinweis, solange die Direktverbindung fehlt - ohne sie bleibt
    // die App auf dem langsamen Weg ueber Google.
    let hintWeg = false;
    try { hintWeg = localStorage.getItem('spHintWeg') === '1'; } catch (e) {}
    if (!spConnected() && (!hintWeg || spNotice) && !isWaiting()) {
      alertBox.innerHTML = '<div>' + escapeHtml(spNotice || 'Schneller: Spotify direkt mit der App verbinden (einmalig).') + '</div>' +
        '<div class="act"><button id="btnSpConnect">Spotify verbinden</button><button id="btnSpLater">Später</button></div>';
      alertBox.classList.remove('hidden');
      $('btnSpConnect').addEventListener('click', spLogin);
      $('btnSpLater').addEventListener('click', () => {
        try { localStorage.setItem('spHintWeg', '1'); } catch (e) {}
        alertBox.classList.add('hidden');
      });
      return;
    }
    alertBox.classList.add('hidden');
    return;
  }

  // Im Wartezustand steht die Erklaerung schon gross im Hauptbereich - hier
  // dann nur noch die Knoepfe, statt denselben Satz doppelt zu zeigen (spart
  // auf kleinen Displays rund 40px).
  let html = isWaiting() ? '' : ('<div>' + escapeHtml(trouble ? st.message : err.message) + '</div>');
  html += '<div class="act"' + (isWaiting() ? ' style="margin-top:0"' : '') + '>';
  html += '<a id="lnkSpotify" href="spotify://">Spotify öffnen</a>';
  html += '<button id="btnDismiss">Ausblenden</button>';
  html += '</div>';
  alertBox.innerHTML = html;
  alertBox.classList.remove('hidden');

  const lnk = $('lnkSpotify');
  if (lnk) lnk.addEventListener('click', () => { waitingUntil = Date.now() + WAIT_WINDOW_MS; render(); });
  $('btnDismiss').addEventListener('click', () => { alertBox.classList.add('hidden'); });
}

function renderDetails() {
  detailsBox.classList.toggle('hidden', !detailsOpen);
  if (!detailsOpen || !st) return;

  let h = '';
  if (st.pool && st.pool.stations) {
    h += '<b>Vorrat</b><br>';
    Object.keys(st.pool.stations).forEach(s => {
      const p = st.pool.stations[s];
      h += (STATION_LABELS[s] || s) + ': ' + p.fresh + ' neu, ' + p.known + ' bekannt<br>';
    });
    h += 'Stand: ' + new Date(st.pool.at).toLocaleTimeString('de-DE') + '<br><br>';
  }
  if (st.lastRefill) {
    h += '<b>Letzter Nachschub</b><br>' + new Date(st.lastRefill.at).toLocaleTimeString('de-DE') +
         ' · ' + (st.lastRefill.found || 0) + ' von ' + (st.lastRefill.resolved || 0) +
         ' gefunden, ' + (st.lastRefill.added || 0) + ' neu<br><br>';
  }
  h += '<b>Spotify-Direktverbindung</b><br>' +
       (spConnected()
         ? (spActive() ? 'aktiv' : 'gestört – nutze vorübergehend den Server') + ' · ' + spLatency + ' ms' +
           ' <button id="btnSpDisconnect" style="margin-left:6px">Trennen</button>'
         : 'nicht verbunden <button id="btnSpConnect2" style="margin-left:6px">Verbinden</button>') +
       (spNotice ? '<br><span style="color:#ffb300">' + escapeHtml(spNotice) + '</span>' : '') + '<br><br>';
  h += '<b>Wiedergabe</b><br>Gerät: ' + escapeHtml(st.device || '–') +
       '<br>Warteschlange: ' + (st.queueAhead === null || st.queueAhead === undefined ? '…' : st.queueAhead) +
       '<br>Session: ' + (st.sessionActive ? 'aktiv' : 'aus') +
       '<br>Stand von: ' + (st.direct ? 'Spotify direkt' : 'Server') +
       '<br>Server-Antwortzeit: ' + (apiLatency / 1000).toFixed(1) + ' s' +
       ' (Vorlauf ' + (pauseLeadMs() / 1000).toFixed(1) + ' s)' +
       (wakeLock ? '<br>Bildschirm bleibt an (für Beiträge)' : '') +
       (isWaiting() ? '<br>Warte auf Gerät: noch ' + fmt(waitingUntil - Date.now()) : '') +
       (updateQueue.length ? '<br>Update-Folgen offen: ' + updateQueue.length : '') + '<br>';
  h += '<br><b>Protokoll</b><br>Sitzung: ' + escapeHtml(logSession) +
       '<br>gepuffert: ' + logQueue.length + ' Ereignisse<br>';
  if (lastBadResponse) {
    h += '<br><b style="color:#ff8fa0">Unlesbare Serverantwort</b><br>' +
         new Date(lastBadResponse.at).toLocaleTimeString('de-DE') + ' · ' + escapeHtml(lastBadResponse.action) +
         ' · HTTP ' + lastBadResponse.status + '<br>' + escapeHtml(lastBadResponse.snippet) + '<br>';
  }
  if (st.lastError) {
    h += '<br><b style="color:#ff8fa0">Letzter Fehler</b><br>' +
         new Date(st.lastError.at).toLocaleTimeString('de-DE') + ' [' +
         escapeHtml(st.lastError.where) + ']<br>' + escapeHtml(st.lastError.message);
  }
  detailsBox.innerHTML = h;
  const bc = $('btnSpConnect2');
  if (bc) bc.addEventListener('click', e => { e.stopPropagation(); spLogin(); });
  const bd = $('btnSpDisconnect');
  if (bd) bd.addEventListener('click', e => {
    e.stopPropagation();
    spDisconnect('von Hand getrennt');
    renderDetails();
    refresh();
  });
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// Eigene, einfachere Darstellung waehrend Nachrichten/Aktuelles laeuft -
// wichtig VOR der isStale()-Pruefung im normalen render(): eine Einspielung
// kann laenger als STALE_MS laufen, ohne dass wir zwischendurch pollen,
// sonst wuerde "Aktualisiere..." die Anzeige ueberschreiben.
function renderInterjection() {
  const ia = interjectionActive;
  // Gross nur der Sendungsname - die Folgen-Schlagzeile ist oft vier Zeilen
  // lang und hat den Bereich vorher ueberlaufen lassen.
  npTitle.textContent = ia.item.show || 'Podcast';
  npArtist.textContent = ia.item.source || '';
  // Die Schlagzeile klein und auf zwei Zeilen begrenzt - informativ, ohne
  // das Layout zu sprengen.
  npMeta.textContent = ia.item.title || '';
  npMeta.style.color = '';
  npMeta.classList.add('clamp2');
  document.querySelector('.now-playing').style.opacity = '';

  // Bewertungs-Reihe gegen die Spultasten tauschen (gleiche Hoehe, kein Sprung).
  feedbackRow.classList.add('hidden');
  seekRow.classList.remove('hidden');

  const label = ia.kind === 'news' ? 'Nachrichten' : (ia.kind === 'update' ? 'Update' : 'Aktuelles');
  statusLine.className = 'statusline ' + (ia.paused ? 'paused' : 'playing');
  statusLine.innerHTML = '<span class="dot"></span>' +
    escapeHtml(ia.paused ? label + ' pausiert' : label + ' läuft…');

  // Pause/Fortsetzen wirkt waehrend einer Einspielung auf den Podcast, nicht
  // auf Spotify - Spotify ist ja ohnehin schon angehalten.
  btnPower.classList.remove('start', 'pause', 'resume', 'busy');
  btnPower.disabled = false;
  if (ia.paused) {
    btnPower.textContent = '▶ Fortsetzen';
    btnPower.classList.add('resume');
  } else {
    btnPower.textContent = '⏸ Pause';
    btnPower.classList.add('pause');
  }

  btnEnd.disabled = false;
  btnSkip.disabled = false;
  btnSkip.textContent = '⏭ Überspringen';
}

// Eigene Darstellung, solange auf das Geraet gewartet wird: man soll sehen,
// dass Warten reicht und man nichts druecken muss.
function renderWaiting() {
  const restMs = Math.max(0, waitingUntil - Date.now());

  npTitle.textContent = 'Warte auf Spotify-Gerät';
  npArtist.textContent = 'Spotify dort öffnen – ich starte von selbst';
  npMeta.textContent = 'noch ' + fmt(restMs);
  npMeta.style.color = '';
  npMeta.classList.remove('clamp2');
  document.querySelector('.now-playing').style.opacity = '';
  progressWrap.classList.add('hidden');

  seekRow.classList.add('hidden');
  feedbackRow.classList.remove('hidden');
  btnLike.disabled = true; btnDislike.disabled = true; btnFavorite.disabled = true;

  statusLine.className = 'statusline busy';
  statusLine.innerHTML = '<span class="dot"></span>' +
    escapeHtml('Warte auf Spotify-Gerät · starte automatisch');

  btnPower.classList.remove('start', 'pause', 'resume', 'busy');
  btnPower.classList.add('busy');
  btnPower.textContent = '⏳ Warten abbrechen';
  btnPower.disabled = false;
  btnEnd.disabled = false;
  btnSkip.disabled = true;
  btnSkip.textContent = '⏭ Skip';

  renderAlert();
  renderDetails();
}

function render() {
  if (interjectionActive) { renderInterjection(); return; }
  if (isWaiting() && !(st && st.ok && st.isPlaying)) { renderWaiting(); return; }

  // Zurueck zur Musik: Spultasten weg, Bewertung wieder da.
  seekRow.classList.add('hidden');
  feedbackRow.classList.remove('hidden');
  npMeta.classList.remove('clamp2');

  // Statuszeile ist immer eindeutig - nie leer, nie mehrdeutig.
  let cls = '', text;
  if (busy) {
    cls = 'busy'; text = busy;
  } else if (!st) {
    text = 'Verbinde…';
  } else if (!st.ok) {
    cls = 'trouble'; text = st.message || 'Fehler';
  } else {
    text = st.message;
    if (st.phase === 'playing') cls = 'playing';
    else if (st.phase === 'paused') cls = 'paused';
    else if (st.phase === 'device_gone' || st.phase === 'error') cls = 'trouble';
  }
  // Vorgemerktes sichtbar machen - sonst tippt man und nichts scheint zu passieren.
  if (!busy && st && st.ok) {
    const wartet = [];
    if (pendingStationSwitch) wartet.push('Sender wechselt nach dem Lied');
    if (pendingNews) wartet.push('Nachrichten nach dem Lied');
    if (wartet.length) text = text + ' · ' + wartet.join(' · ');
  }
  // Lieber "ich schaue gerade nach" als eine Angabe, die nicht mehr stimmt.
  if (!busy && isStale()) { cls = 'busy'; text = 'Aktualisiere…'; }

  statusLine.className = 'statusline ' + cls;
  statusLine.innerHTML = '<span class="dot"></span>' + escapeHtml(text);
  document.querySelector('.now-playing').style.opacity = (!busy && isStale()) ? '0.35' : '';

  const phase = busy ? 'busy' : (st && st.ok ? st.phase : 'idle');

  // Power-Knopf haengt an der Phase, NICHT an sessionActive. Frueher zeigte
  // er nach einem gescheiterten Start "Pause" an - man kam ohne "Beenden"
  // nicht mal zu einem zweiten Versuch.
  btnPower.classList.remove('start', 'pause', 'resume', 'busy');
  if (busy) {
    btnPower.innerHTML = escapeHtml(busy);
    btnPower.classList.add('busy');
    btnPower.disabled = true;
  } else if (phase === 'playing') {
    btnPower.textContent = '⏸ Pause';
    btnPower.classList.add('pause');
    btnPower.disabled = false;
  } else if (phase === 'paused') {
    btnPower.textContent = '▶ Fortsetzen';
    btnPower.classList.add('resume');
    btnPower.disabled = false;
  } else if (!st) {
    // Noch nie eine Antwort gesehen. Der Abruf dauert im Median 4 s - so lange
    // stand hier frueher ein aktiver "Start", obwohl die App noch gar nicht
    // wusste, ob Spotify vielleicht laengst spielt.
    btnPower.textContent = '⏳ Verbinde…';
    btnPower.classList.add('busy');
    btnPower.disabled = true;
  } else if (verbindungUnklar) {
    btnPower.innerHTML = '⟳ Status prüfen<span class="sub">Verbindung war gestört</span>';
    btnPower.classList.add('busy');
    btnPower.disabled = false;
  } else {
    // Wenn der Vorrat leer ist, dauert der Start ausnahmsweise laenger -
    // das steht dann vorher am Knopf, statt hinterher zu ueberraschen.
    const empty = st && st.ok && st.pool && !st.poolFresh && !st.poolKnown;
    btnPower.innerHTML = '▶ Start' + (empty ? '<span class="sub">Liste leer – dauert ~20 s</span>' : '');
    btnPower.classList.add('start');
    btnPower.disabled = false;
  }

  // Immer tippbar: das ist der Notausgang, der Session, Pause-Flag und
  // Warteschlangen-Zustand serverseitig zuruecksetzt.
  btnEnd.disabled = !!busy;
  btnSkip.disabled = busy || !(st && st.isPlaying);
  btnSkip.textContent = '⏭ Skip'; // renderInterjection() benennt ihn waehrend einer Einspielung um

  if (!curSong || !(st && st.ok && (st.isPlaying || st.phase === 'paused'))) paintIdle();

  renderAlert();
  renderDetails();
  syncWakeLock();
}

// ── Bildschirm anlassen, solange Beitraege kommen sollen ─────
// Beitraege (Aktuelles/Update/News) spielt der Browser selbst. Geht der
// Bildschirm aus, legt Android die App schlafen und das Songende wird nie
// bemerkt - belegt im Protokoll: am 15.09. ab 11:40 anderthalb Stunden Musik
// mit "Aktuelles an", aber kein einziger Beitrag. Deshalb den Bildschirm
// anlassen, solange eine Session laeuft und Beitraege eingeschaltet sind.
let wakeLock = null;
let wakeLockBusy = false;
let wakeLockFailedAt = 0;

function wantWakeLock() {
  if (document.hidden) return false;
  if (interjectionActive) return true;
  return !!(st && st.ok && st.sessionActive && st.isPlaying && interjectionFeatureOn());
}

function syncWakeLock() {
  if (!('wakeLock' in navigator) || wakeLockBusy) return;
  const want = wantWakeLock();
  if (want && !wakeLock && Date.now() - wakeLockFailedAt > 60000) {
    wakeLockBusy = true;
    navigator.wakeLock.request('screen').then(lock => {
      wakeLock = lock;
      lock.addEventListener('release', () => { if (wakeLock === lock) wakeLock = null; });
      logEvent('bildschirm', 'bleibt an');
    }).catch(e => {
      wakeLockFailedAt = Date.now();
      logEvent('bildschirm', 'nicht moeglich', e && e.message);
    }).finally(() => { wakeLockBusy = false; });
  } else if (!want && wakeLock) {
    const lock = wakeLock;
    wakeLock = null;
    lock.release().catch(() => {});
    logEvent('bildschirm', 'darf aus');
  }
}

// ── Fortschritt lokal weiterzaehlen ──────────────────────────
// Der Fortschritt wird lokal hochgezaehlt. Nach einer Pause im Hintergrund
// waere die hochgerechnete Position frei erfunden - dann lieber nichts zeigen.
function isStale() {
  if (!st || !st.ok) return false;
  if (st.phase !== 'playing' && st.phase !== 'paused') return false;
  return !progressAt || (Date.now() - progressAt) > STALE_MS;
}

// Fuer das AUSLOESEN von Beitraegen darf der Stand aelter sein als fuer die
// Anzeige: ein einzelner Abruf, der ins Zeitlimit laeuft, liess die Anzeige
// bisher als veraltet gelten - und damit fiel genau am Songende die
// Einspielung aus. Die Hochrechnung ist ueber eine Minute noch genau genug.
const TRIGGER_STALE_MS = 60000;

function tick() {
  setzeAppHoehe();
  if (interjectionActive) return;
  // Im Wartezustand laeuft hier nur der Countdown weiter.
  if (isWaiting() && !(st && st.ok && st.isPlaying)) { renderWaiting(); return; } // Fortschritt kommt waehrend einer Einspielung vom Audio-Element selbst (siehe startInterjection)
  if (aktuellesOn && !aktuellesNextItem) prefetchNextAktuelles();
  vorladenNaechsterBeitrag();
  if (!st || !st.isPlaying || !st.current || !st.current.durationMs || progressBase === null ||
      !progressAt || Date.now() - progressAt > TRIGGER_STALE_MS) {
    progressWrap.classList.add('hidden');
    return;
  }
  const dur = st.current.durationMs;
  const pos = Math.min(dur, progressBase + (Date.now() - progressAt));
  if (isStale()) {
    progressWrap.classList.add('hidden');
  } else {
    progressWrap.classList.remove('hidden');
    progressFill.style.width = (100 * pos / dur).toFixed(1) + '%';
    tElapsed.textContent = fmt(pos);
    tTotal.textContent = fmt(dur);
  }

  // Der Pause-Befehl braucht ueber den Server 2-3 s, direkt ~0,3 s, und
  // schwankt dabei. Wir zielen bewusst knapp VOR das Songende: ein
  // angeschnittener Ausklang faellt kaum auf, ein Fehlstart des naechsten
  // Songs sehr wohl. Beide Faelle werden beim Fortsetzen sauber aufgeloest
  // (siehe startInterjection), egal auf welcher Seite wir landen.
  const left = dur - pos;
  const lead = pauseLeadMs();
  if (left <= lead && left > -6000 && st.current.uri && triggeredForUri !== st.current.uri) {
    if (pendingStationSwitch) {
      // Vorrang vor Einspielungen: erst die Liste tauschen, Beitraege kommen
      // dann ab dem naechsten Songende wieder normal.
      triggeredForUri = st.current.uri;
      pendingStationSwitch = false;
      doStart({ busyText: 'Wechsle Sender…', force: true });
    } else if (interjectionDue()) {
      triggeredForUri = st.current.uri;
      maybeTriggerInterjection();
    }
  }
}

function interjectionDue() {
  if (pendingNews) return true;
  // Update-Modus hat Vorrang vor Aktuelles und braucht genau ein komplettes
  // Lied Abstand.
  if (updateQueue.length && songsSinceInterjection >= 1) return true;
  return aktuellesOn && songsSinceInterjection >= interjectionThreshold && !!aktuellesNextItem;
}

// ── Polling: gezielt zum Songende statt stur alle 20 s ───────
function isWaiting() { return waitingUntil > Date.now(); }

// Direktbetrieb: ein Abruf kostet ~0,3 s und kein Apps-Script-Kontingent,
// also darf deutlich haeufiger nachgesehen werden - Aenderungen, die man in
// der Spotify-App macht (Pause, Skip), sind so nach wenigen Sekunden sichtbar.
const DIRECT_POLL_MS      = 5000;
const DIRECT_IDLE_POLL_MS = 10000;

function scheduleNext() {
  clearTimeout(pollTimer);

  // Im Hintergrund normalerweise gar nicht pollen (Akku, Kontingent) - im
  // Wartezustand aber schon, damit die Musik auch dann losgeht, wenn man in
  // der Spotify-App bleibt. Mit Direktverbindung ausserdem, solange Beitraege
  // eingeschaltet sind: sonst merkt die App im Hintergrund nie ein Songende.
  // Android drosselt das evtl., der Abruf beim Zurueckwechseln greift dann
  // trotzdem sofort.
  const hintergrundBeitraege = spActive() && interjectionFeatureOn() && st && st.ok && st.sessionActive;
  if (document.hidden && !isWaiting() && !hintergrundBeitraege) return;
  if (isWaiting()) {
    pollTimer = setTimeout(() => {
      if (Date.now() > waitingUntil) { refresh(); return; }  // Fenster abgelaufen -> normal weiter
      doStart({ quiet: true });
    }, document.hidden ? WAIT_BG_POLL_MS : WAIT_POLL_MS);
    return;
  }

  let delay = IDLE_POLL_MS;

  if (st && st.ok && st.direct) {
    delay = DIRECT_IDLE_POLL_MS;
    if (st.phase === 'playing' && st.current && st.current.durationMs && progressBase !== null) {
      const left = st.current.durationMs - (progressBase + (Date.now() - progressAt));
      delay = Math.min(DIRECT_POLL_MS, Math.max(800, left + 700));
    } else if (st.phase === 'paused') {
      delay = DIRECT_POLL_MS;
    }
  } else if (st && st.ok) {
    if (st.phase === 'playing' && st.current && st.current.durationMs && progressBase !== null) {
      const left = st.current.durationMs - (progressBase + (Date.now() - progressAt));
      delay = Math.min(MAX_POLL_MS, Math.max(MIN_POLL_MS, left + 1500));
    } else if (st.phase === 'device_gone' || st.phase === 'error' || st.phase === 'stalled') {
      delay = ERROR_POLL_MS;
    }
  }
  pollTimer = setTimeout(refresh, delay);
}

// Letzten guten Zustand behalten und den Fehler nur darueberlegen. Vorher
// ersetzte eine Fehlerantwort das komplette st - dadurch verschwanden Sender,
// Geraet und Vorratszahlen aus der Anzeige.
function setSoftError(message, phase) {
  st = Object.assign({}, st || {}, { ok: true, phase: phase || 'error', message: message });
  render();
}

let lastPollAt = 0;

function refresh(isRetry) {
  return spActive() ? refreshDirect(isRetry) : refreshServer(isRetry);
}

function refreshDirect(isRetry) {
  lastPollAt = Date.now();
  const tAb = Date.now();
  return sp('/me/player?additional_types=episode').then(state => {
    const gesamtMs = Date.now() - tAb;
    spFailStreak = 0;
    lastDirectOkAt = Date.now();
    // Nur jede sechste Abfrage protokollieren - reicht fuer die Auswertung
    // der Antwortzeiten, ohne das Protokoll mit Polls zu fluten.
    if (++spPollCount % 6 === 1) logEvent('api', 'sp:status', 'ok', gesamtMs);
    lastSpState = state || null;
    if (state && state.device && state.device.id) spDeviceId = state.device.id;

    applyStatus(buildDirectStatus(state), gesamtMs);

    // Server-Sicht nachziehen: bei unbekanntem Song sofort, sonst selten.
    const uri = state && state.item ? state.item.uri : null;
    const srvKenntSong = !uri || (srv && srv.current && srv.current.uri === uri);
    if (!srv || !srvKenntSong || Date.now() - srvAt > SRV_META_MS) refreshServerMeta();
  }, err => {
    // Bewusst nur Fehler des Spotify-Abrufs hier - ein Fehler beim Verarbeiten
    // darf nicht still auf den Server-Weg umschalten.
    spFailStreak++;
    logEvent('api', 'sp:status', err.status ? ('HTTP' + err.status) : (err.authLost ? 'ABGEMELDET' : 'NETWORK'), Date.now() - tAb);
    if (err.status === 429) spBackoffUntil = Date.now() + (err.retryAfter || 30) * 1000;
    else if (spFailStreak >= 3) spBackoffUntil = Date.now() + 60000;
    // Dieser Abruf geht ueber den Server - die App bleibt also bedienbar.
    return refreshServer(isRetry);
  });
}

function refreshServer(isRetry) {
  lastPollAt = Date.now();
  const tAb = Date.now();
  return api('status').then(data => {
    const gesamtMs = Date.now() - tAb;
    if (!data.ok && data.code === 'BAD_RESPONSE' && !isRetry) {
      // Googles Frontend liefert sporadisch eine Fehlerseite statt unserer
      // Antwort. Einmal still nachfassen, bevor der Nutzer davon erfaehrt.
      setTimeout(() => refresh(true), 2000);
      return;
    }
    if (!data.ok) {
      // Zeitlimit/Netzfehler heisst: wir wissen den Stand nicht. Das ist etwas
      // anderes als ein echter Spotify-Fehler, den der Server gemeldet hat.
      verbindungUnklar = ['TIMEOUT', 'NETWORK', 'BAD_RESPONSE'].indexOf(data.code) !== -1;
      setSoftError(data.message || 'Verbindung gestört', 'error');
      scheduleNext();
      return;
    }
    srv = data;
    srvAt = Date.now();
    // Server-Antworten brauchen bis zu 30 s. Hat inzwischen ein Direktabruf
    // einen frischeren Stand geliefert, nur die Server-Sicht uebernehmen und
    // die Anzeige nicht auf den alten Stand zurueckwerfen.
    if (spActive() && lastDirectOkAt > tAb) return;
    applyStatus(data, gesamtMs);
  }).catch(err => {
    setSoftError('Keine Verbindung: ' + err.message, 'error');
    scheduleNext();
  });
}

// Reaktives Netz: so weit darf ein neuer Song schon laufen, damit der Beitrag
// noch davor geschoben wird (der Song faengt danach wieder bei 0 an, siehe
// startInterjection). Ueber den Server kommt ein Songwechsel spaeter an als
// direkt, im Hintergrund wegen der Android-Drosselung noch viel spaeter.
function reactiveWindowMs(direct) {
  if (document.hidden) return 60000;
  return direct ? 4000 : 8000;
}

function applyStatus(data, gesamtMs) {
  {
    verbindungUnklar = false;
    st = data;
    if (data.ok) {
      // Der gemeldete Stand ist beim Eintreffen schon veraltet: Spotify hat
      // ihn vor progressAgeMs gemessen (Serverzeit), danach kam noch der
      // Rueckweg dazu. Beides draufrechnen, sonst glauben wir das Lied sei
      // 1-2 s weniger weit - und loesen die Einspielung zu spaet aus.
      const netzMs = Math.max(0, gesamtMs - (data.serverMs || 0));
      progressKorrekturMs = Math.round((data.progressAgeMs || 0) + netzMs / 2);
      progressBase = (typeof data.progressMs === 'number')
        ? data.progressMs + progressKorrekturMs : null;
      progressAt = Date.now();
      renderCurrent(data.current);
      renderStations(data.stations);

      // Ein echter Songwechsel (nicht nur ein weiterer Poll desselben Songs)
      // zaehlt fuer "alle 2-3 Lieder" und ist zugleich das Sicherheitsnetz:
      // falls die vorausschauende Ausloesung in tick() verpasst wurde (App
      // war im Hintergrund, kein tick() lief), greift sie hier reaktiv -
      // dann eben mit ein paar Sekunden Ueberlappung in den neuen Song statt
      // sauber an dessen Ende.
      const newUri = data.current ? data.current.uri : null;
      if (lastSeenSongUri && newUri && newUri !== lastSeenSongUri && data.phase === 'playing' && !interjectionActive) {
        songsSinceInterjection++;
        triggeredForUri = null;
        logEvent('song', (data.current.artist || '') + ' – ' + (data.current.title || ''), {
          sender: data.current.station || null,
          schonGespielt: data.current.playCount,
          dauerMs: data.current.durationMs,
          nochInListe: data.queueAhead,
          // null = Direktbetrieb, Server kennt den Song noch nicht (nicht "fremd")
          fremd: data.current.metaPending ? null : !data.current.key
        });
        // Reaktives Netz nur kurz nach dem Songwechsel. Am 21.08. loeste es 8 s
        // nach Songbeginn aus und der Song war danach weg - inzwischen setzt
        // startInterjection ihn in dem Fall auf 0 zurueck, man hoert also nur
        // einen kurzen Anriss. Das Fenster war mit 3 s aber so knapp, dass es
        // bei 2-3 s Server-Antwortzeit meistens verpasst wurde und der Beitrag
        // ein ganzes Lied spaeter (oder gar nicht) kam.
        if ((data.progressMs || 0) < reactiveWindowMs(!!data.direct) && interjectionDue()) maybeTriggerInterjection();
      }
      lastSeenSongUri = newUri || lastSeenSongUri;

      // Musik laeuft: Warten ist erledigt. Ohne das startete der Wartezustand
      // weiter - am 15.09. um 08:00 neunmal hintereinander, weil die Antworten
      // der erfolgreichen Starts im Zeitlimit haengen blieben.
      if (waitingUntil && data.phase === 'playing') {
        logEvent('warten_erledigt', 'Musik läuft', null, waitingSince ? Date.now() - waitingSince : undefined);
        waitingUntil = 0;
        waitingSince = 0;
      }

      // Wartezustand: bei jedem Abruf waehrenddessen gleich einen Start
      // versuchen - ohne festes Zielgeraet gibt es kein "online"-Signal mehr
      // vorab zu pruefen. Klappt es, uebernimmt doStart() selbst die
      // Zustandspflege; klappt es nicht, laeuft der Wartezustand unveraendert
      // weiter (doStart() setzt waitingUntil dann erneut).
      if (waitingUntil > Date.now() && data.phase !== 'playing') {
        doStart();
        return;
      }
      if (waitingUntil && Date.now() > waitingUntil) {
        // Nicht stumm aufgeben - sagen, dass jetzt Handarbeit noetig ist.
        waitingUntil = 0;
        logEvent('warten_abgelaufen', 'kein Gerät gefunden', null, waitingSince ? Date.now() - waitingSince : undefined);
        waitingSince = 0;
        setSoftError('Kein Gerät gefunden – Spotify öffnen und Start drücken', 'device_gone');
        scheduleNext();
        return;
      }
    }
    render();
    tick();
    scheduleNext();
  }
}

// ── Aktionen ─────────────────────────────────────────────────
// quiet=true: der wiederholte Versuch aus dem Wartezustand heraus. Statt
// erst den Status abzufragen (3,5 s) und DANN zu starten, wird direkt der
// Start versucht - er bricht bei fehlendem Geraet ohnehin frueh ab. Spart im
// Erfolgsfall einen kompletten Roundtrip.
let startInFlight = false;

// force=true: laufende Wiedergabe bewusst ersetzen. Nur der Senderwechsel
// braucht das - er soll die Liste ja gerade austauschen. Ohne force uebernimmt
// der Server laufende Musik, statt ein anderes Lied zu starten.
// Direktbetrieb: gibt es ueberhaupt ein Spotify-Geraet? Beantwortet Spotify in
// ~0,3 s selbst - vorher kostete jede Wartezustands-Runde einen kompletten
// Start-Aufruf ueber Apps Script (am 15.09. elf Stueck in zwei Minuten).
// Liefert true/false, oder null wenn die Direktabfrage nicht klappt.
function spHasDevice() {
  if (!spActive()) return Promise.resolve(null);
  return sp('/me/player/devices')
    .then(d => ((d && d.devices) || []).length > 0)
    .catch(() => null);
}

function doStart(opts) {
  const quiet = !!(opts && opts.quiet);
  const force = !!(opts && opts.force);
  if (startInFlight) return;      // kein Doppelstart durch ueberlappende Versuche
  startInFlight = true;
  if (!quiet) setBusy((opts && opts.busyText) || 'Starte…');
  const params = {};
  if (force) params.force = '1';
  if (geraeteHinweis) params.hint = geraeteHinweis;

  spHasDevice().then(hatGeraet => {
    if (hatGeraet === false) {
      return { ok: false, code: 'NO_DEVICE', message: 'Kein Spotify-Gerät erreichbar – Spotify auf dem Handy öffnen.', lokal: true };
    }
    return api('startSession', Object.keys(params).length ? params : undefined);
  }).then(r => {
    startInFlight = false;
    if (r.ok) {
      busy = null;
      if (waitingUntil) logEvent('warten_erledigt', 'gestartet', null, waitingSince ? Date.now() - waitingSince : undefined);
      waitingUntil = 0;
      waitingSince = 0;
      verbindungUnklar = false;
      st = Object.assign({}, st || {}, {
        ok: true, phase: 'playing', message: r.message, isPlaying: true, isPaused: false,
        sessionActive: true, current: r.current, queueAhead: r.queueAhead,
        device: r.device, lastError: null
      });
      // Die Server-Sicht fuer den Direktbetrieb gleich mitnehmen - sonst
      // stuende der erste Song bis zum naechsten Server-Abruf ohne Herkunft da.
      srv = Object.assign({}, srv || {}, {
        sessionActive: true, current: r.current, queueAhead: r.queueAhead, lastError: null
      });
      // Uebernommene Wiedergabe laeuft mitten im Song - der Fortschritt kommt
      // dann vom naechsten Status, nicht von 0.
      if (r.uebernommen) { progressBase = null; progressAt = 0; }
      else { progressBase = 0; progressAt = Date.now(); }
      renderCurrent(r.current);
      render();
      tick();
      refresh();
      if (spActive()) setTimeout(() => refreshServerMeta(true), 3000);
    } else if (r.code === 'BAD_RESPONSE' || r.code === 'TIMEOUT' || r.code === 'NETWORK') {
      // Im Wartezustand NICHT gleich den naechsten Start hinterherschicken:
      // der hier kann serverseitig laengst erfolgreich gewesen sein. Erst
      // nachsehen - refresh() startet selbst neu, falls wirklich nichts laeuft.
      if (quiet) { clearTimeout(pollTimer); pollTimer = setTimeout(refresh, WAIT_POLL_MS); return; }
      // Kann trotzdem geklappt haben - nachsehen statt etwas zu behaupten.
      // Belegt im Protokoll: ein "pause" brauchte 10,3 s und war erfolgreich,
      // waehrend das Zeitlimit der App bei 12 s liegt. Ein abgelaufener Aufruf
      // ist also keine Aussage darueber, ob der Server ihn ausgefuehrt hat.
      setBusy('Antwort unklar – prüfe, ob es läuft…');
      setTimeout(() => { busy = null; refresh(); }, spActive() ? 800 : 2500);
      setTimeout(refresh, spActive() ? 4000 : 9000);
    } else if (quiet) {
      // Geraet weiterhin nicht da - Wartezustand unveraendert weiterlaufen
      // lassen (nicht neu scharfschalten, sonst liefe das Fenster nie ab).
      render();
      scheduleNext();
    } else {
      busy = null;
      st = Object.assign({}, st || {}, {
        ok: true, phase: r.code === 'DEVICE_GONE' || r.code === 'NO_DEVICE' ? 'device_gone' : 'error',
        message: r.message || 'Start fehlgeschlagen'
      });
      // Scheiterte es am Geraet, ist die Absicht eindeutig: ab jetzt selbst
      // weiterprueferen und starten, sobald Spotify antwortet. Frueher musste
      // man dafuer erst den "Spotify öffnen"-Knopf benutzen.
      if (['DEVICE_GONE', 'NO_DEVICE', 'PLAY_FAILED'].indexOf(r.code) !== -1) {
        if (!isWaiting()) { waitingSince = Date.now(); logEvent('warten_start', r.code, { meldung: r.message, direktGeprueft: !!r.lokal }); }
        waitingUntil = Date.now() + WAIT_WINDOW_MS;
      }
      render();
      scheduleNext();
      // Spotify laesst die Wiedergabe manchmal verzoegert doch anlaufen -
      // deshalb kurz danach nochmal den echten Stand holen.
      setTimeout(refresh, 6000);
    }
  }).catch(err => {
    startInFlight = false;
    if (quiet) { scheduleNext(); return; }
    busy = null;
    st = { ok: false, message: 'Start fehlgeschlagen: ' + err.message, phase: 'error' };
    render();
    scheduleNext();
  });
}

// ── Nachrichten & Aktuelles: die eigentliche Einspielung ──────
// Frueher genau EIN Versuch: scheiterte der (Median 5,7 s ueber Apps Script),
// blieb "Aktuelles" fuer den Rest der Sitzung stumm - interjectionDue()
// braucht ein vorgeladenes Item. Jetzt mit Wiederholung und wachsendem
// Abstand; tick() stoesst es an, solange eines fehlt.
let aktuellesPrefetchLaeuft = false;
let aktuellesPrefetchFehler = 0;
let aktuellesPrefetchNaechster = 0;

function prefetchNextAktuelles() {
  if (aktuellesPrefetchLaeuft || aktuellesNextItem) return;
  if (Date.now() < aktuellesPrefetchNaechster) return;
  aktuellesPrefetchLaeuft = true;
  api('nextAktuelles').then(r => {
    aktuellesPrefetchLaeuft = false;
    if (r.ok && r.item) {
      aktuellesNextItem = r.item;
      aktuellesPrefetchFehler = 0;
      return;
    }
    aktuellesPrefetchFehler++;
    aktuellesPrefetchNaechster = Date.now() + Math.min(120000, 10000 * aktuellesPrefetchFehler);
    logEvent('aktuelles_vorladen', 'fehlgeschlagen', { code: r.code || (r.ok ? 'leer' : 'fehler'), versuch: aktuellesPrefetchFehler });
  });
}

// Spotify fuer einen Beitrag anhalten. Direkt, wenn moeglich (~0,3 s statt
// 2-3 s - der Beitrag setzt damit viel genauer am Songende an).
function playerPauseForInterjection() {
  if (!spActive()) return api('playerPause');
  return spCmd('pause', '/me/player/pause', 'PUT')
    .catch(err => {
      // 403 = war schon pausiert - kein Grund, den Beitrag ausfallen zu lassen.
      if (err.status !== 403) throw err;
    })
    .then(() => sp('/me/player?additional_types=episode'))
    .then(state => ({
      ok: true,
      uri: state && state.item ? state.item.uri : null,
      progressMs: state && typeof state.progress_ms === 'number' ? state.progress_ms : null
    }))
    .catch(() => api('playerPause'));
}

// Nach dem Beitrag: optional den Ausklang-Rest ueberspringen, optional an den
// Songanfang, dann weiterspielen. Klappt es direkt nicht, macht es der Server.
function playerResumeAfterInterjection(params) {
  params = params || {};
